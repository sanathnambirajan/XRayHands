<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>X-Ray Hands Code Study</title>
<style>
:root{--bg:#f6f8fb;--panel:#fff;--ink:#1a2230;--muted:#5b6676;--line:#dde3ea;--accent:#1b7fb0;--code:#0f1724;--codeink:#d6e2ef;--hl:#2a4b6b}
@media (prefers-color-scheme:dark){:root{--bg:#0d1117;--panel:#151b23;--ink:#e3e9f0;--muted:#94a1b2;--line:#2a333f;--accent:#4fb3e6}}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{font-family:"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--ink);display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:12px;padding:8px 14px;border-bottom:1px solid var(--line);background:var(--panel)}
header b{font-size:15px}header span{color:var(--muted);font-size:12.5px}
main{flex:1;display:grid;grid-template-columns:230px minmax(320px,38%) 1fr;min-height:0}
nav{overflow:auto;border-right:1px solid var(--line);background:var(--panel);padding:6px 0}
nav h4{margin:12px 14px 4px;font-size:11px;letter-spacing:.6px;text-transform:uppercase;color:var(--muted)}
nav button{display:block;width:100%;text-align:left;border:0;background:none;color:var(--ink);padding:5px 14px;font:inherit;font-size:13px;cursor:pointer}
nav button:hover{background:var(--bg)}nav button.on{background:var(--accent);color:#fff}
nav small{display:block;font-size:10.5px;opacity:.7;font-family:Consolas,monospace}
#notes{overflow:auto;padding:16px 18px;border-right:1px solid var(--line)}
#notes h2{margin:0 0 2px;font-size:19px}#notes .p{font-family:Consolas,monospace;font-size:12px;color:var(--muted);margin-bottom:10px}
#notes .what{background:var(--panel);border-left:3px solid var(--accent);padding:9px 12px;border-radius:4px;margin-bottom:14px;line-height:1.5}
.pt{display:block;width:100%;text-align:left;font:inherit;color:inherit;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:8px 11px;margin-bottom:7px;cursor:pointer;line-height:1.45}
.pt:hover,.pt.on{border-color:var(--accent)}.pt b{color:var(--accent);font-family:Consolas,monospace;font-size:12.5px}
.pt i{float:right;font-style:normal;font-size:11px;color:var(--muted)}
#notes h3{font-size:13px;margin:16px 0 6px}#notes ul{margin:0;padding-left:18px;line-height:1.6}
#code{overflow:auto;background:var(--code);color:var(--codeink);font:12.5px/1.55 Consolas,"Cascadia Mono",monospace}
.l{display:flex;white-space:pre}.l .ln{flex:0 0 52px;text-align:right;padding-right:12px;color:#5d6b7c;user-select:none}
.l.hl{background:#1f3d5c}.l.hl .ln{color:#fff;background:#1b7fb0}.l.hlt{box-shadow:inset 0 2px 0 #4fb3e6}.l.hlb{box-shadow:inset 0 -2px 0 #4fb3e6}.l.key .ln{color:#ffcc80;font-weight:700}
.pt.on{background:color-mix(in srgb,var(--accent) 12%,var(--panel));box-shadow:0 0 0 2px var(--accent)}
.c{color:#7f8fa3;font-style:italic}.s{color:#a5d6a7}.k{color:#82b1ff}.n{color:#ffcc80}
.tip{font-size:12px;color:var(--muted);margin-top:14px}
#pick{display:none;font:inherit;font-size:13px;padding:3px 6px;max-width:60%}
@media (max-width:1100px){main{grid-template-columns:minmax(260px,40%) 1fr}nav{display:none}#pick{display:block}header span{display:none}#notes{padding:12px}#notes .what,.pt{font-size:13px}}
</style></head><body>
<header><b>X-Ray Hands &middot; code study</b><select id="pick"></select><span>Pick a file on the left &middot; click a point to jump to that code &middot; keys: &uarr;/&darr; previous/next file</span></header>
<main><nav id="nav"></nav><section id="notes"></section><section id="code"></section></main>
<script>
const D=[{"group": "1 Data (Python)", "path": "tools/preprocess.py", "title": "Loading, thresholds, downsampling", "what": "Reads the CT slices (TIFF or DICOM), picks the threshold between air and metal, converts to 8-bit and shrinks the volume for the headset.", "qs": ["Why ISO50 and not Otsu?", "Why mean for grey values but max for labels?"], "points": [{"line": 96, "label": "load_dicom()", "text": "Reads the Enigma DICOM slices and the voxel spacing from the file headers.", "end": 127}, {"line": 156, "label": "otsu_threshold()", "text": "The method we tried first and rejected: it needs two histogram peaks, but pores are under 1 % of voxels, so it found 103,094 fake pores.", "end": 159}, {"line": 165, "label": "iso50_threshold()", "text": "The one we use: the surface is halfway between the air and metal grey values. Standard in industrial CT. Gives 2,910 pores.", "end": 181}, {"line": 213, "label": "to_u8()", "text": "Maps the 16-bit grey values to 0-255 for the GPU texture.", "end": 219}, {"line": 234, "label": "downsample_mean()", "text": "Shrinks grey values by averaging blocks (the physically correct average).", "end": 250}, {"line": 253, "label": "downsample_max()", "text": "Shrinks labels by taking the maximum, so every small pore keeps at least one voxel.", "end": 269}], "code": ["<span class=\"s\">&quot;&quot;</span>&quot;Load CT stacks, crop to the object, pick a display window <span class=\"k\">and</span> downsample.", "", "All functions are pure array transforms (no file I/O except the loaders) so they can be", "unit-tested on synthetic volumes. ``pipeline.py`` wires them together per specimen.", "<span class=\"s\">&quot;&quot;</span>&quot;", "<span class=\"k\">from</span> __future__ <span class=\"k\">import</span> annotations", "", "<span class=\"k\">import</span> logging", "<span class=\"k\">import</span> math", "<span class=\"k\">from</span> pathlib <span class=\"k\">import</span> Path", "", "<span class=\"k\">import</span> numpy <span class=\"k\">as</span> np", "<span class=\"k\">from</span> skimage.filters <span class=\"k\">import</span> threshold_otsu", "", "LOG = logging.getLogger(<span class=\"s\">&quot;preprocess&quot;</span>)", "", "<span class=\"c\"># Display window from intensity percentiles of the object voxels: robust to the few</span>", "<span class=\"c\"># extremely bright reconstruction artefacts that a plain min/max window would chase.</span>", "WINDOW_LOW_PERCENTILE = <span class=\"n\">0.5</span>", "WINDOW_HIGH_PERCENTILE = <span class=\"n\">99.8</span>", "CROP_MARGIN_VOXELS = <span class=\"n\">4</span>", "HISTOGRAM_SAMPLE_STRIDE = <span class=\"n\">4</span>  <span class=\"c\"># sample every 4th voxel per axis for histogram stats (64x fewer voxels)</span>", "", "", "<span class=\"c\"># --------------------------------------------------------------------------- loaders</span>", "", "<span class=\"k\">def</span> load_tiff_stack(", "    folder: Path,", "    dtype: np.dtype = np.uint16,", "    step: <span class=\"k\">int</span> = <span class=\"n\">1</span>,", "    crop: tuple[slice, slice, slice] | <span class=\"k\">None</span> = <span class=\"k\">None</span>,", ") -&gt; np.ndarray:", "    <span class=\"s\">&quot;&quot;</span>&quot;Load a folder of single-slice TIFFs into a [z, y, x] array.", "", "    Slices are sorted by the trailing number <span class=\"k\">in</span> the file name (NIST naming: ``...-&lt;n&gt;.tif``,", "    higher n = towards the top of the sample), <span class=\"k\">not</span> lexicographically, so slice <span class=\"n\">10</span> follows <span class=\"n\">9</span>.", "    ``step`` decimates all three axes (<span class=\"k\">for</span> quick statistics); ``crop`` selects a sub-volume", "    <span class=\"k\">while</span> reading, so the full stack never has to fit <span class=\"k\">in</span> memory.", "    <span class=\"s\">&quot;&quot;</span>&quot;", "    <span class=\"k\">import</span> re", "", "    <span class=\"k\">import</span> tifffile", "", "    files = [p <span class=\"k\">for</span> p <span class=\"k\">in</span> folder.rglob(<span class=\"s\">&quot;*&quot;</span>) <span class=\"k\">if</span> p.suffix.lower() <span class=\"k\">in</span> (<span class=\"s\">&quot;.tif&quot;</span>, <span class=\"s\">&quot;.tiff&quot;</span>)]", "    <span class=\"k\">if</span> <span class=\"k\">not</span> files:", "        <span class=\"k\">raise</span> FileNotFoundError(f<span class=\"s\">&quot;no TIFF files under {folder}&quot;</span>)", "", "    <span class=\"k\">def</span> slice_index(p: Path) -&gt; <span class=\"k\">int</span>:", "        m = re.search(r<span class=\"s\">&quot;(\\d+)(?!.*\\d)&quot;</span>, p.stem)", "        <span class=\"k\">return</span> <span class=\"k\">int</span>(m.group(<span class=\"n\">1</span>)) <span class=\"k\">if</span> m <span class=\"k\">else</span> <span class=\"n\">0</span>", "", "    files.sort(key=slice_index)", "    zs, ys, xs = crop <span class=\"k\">if</span> crop <span class=\"k\">else</span> (slice(<span class=\"k\">None</span>), slice(<span class=\"k\">None</span>), slice(<span class=\"k\">None</span>))", "    files = files[zs][::step]", "    first = tifffile.imread(files[<span class=\"n\">0</span>])[ys, xs][::step, ::step]", "    vol = np.empty((len(files), *first.shape), dtype=dtype)", "    <span class=\"k\">for</span> i, f <span class=\"k\">in</span> enumerate(files):", "        vol[i] = tifffile.imread(f)[ys, xs][::step, ::step]", "    LOG.info(<span class=\"s\">&quot;loaded %s from %s (step %d)&quot;</span>, vol.shape, folder, step)", "    <span class=\"k\">return</span> vol", "", "", "<span class=\"k\">def</span> load_tiff_stack_from_zip(", "    zip_path: Path,", "    dtype: np.dtype = np.uint16,", "    crop: tuple[slice, slice, slice] | <span class=\"k\">None</span> = <span class=\"k\">None</span>,", ") -&gt; np.ndarray:", "    <span class=\"s\">&quot;&quot;</span>&quot;Like :func:`load_tiff_stack` but reads slices straight <span class=\"k\">out</span> of the zip.", "", "    Avoids extracting ~<span class=\"n\">1.8</span> GB of TIFFs to disk (the dev laptop has &lt;<span class=\"n\">20</span> GB free).", "    <span class=\"s\">&quot;&quot;</span>&quot;", "    <span class=\"k\">import</span> io", "    <span class=\"k\">import</span> re", "    <span class=\"k\">import</span> zipfile", "", "    <span class=\"k\">import</span> tifffile", "", "    <span class=\"k\">def</span> slice_index(name: str) -&gt; <span class=\"k\">int</span>:", "        m = re.search(r<span class=\"s\">&quot;(\\d+)(?!.*\\d)&quot;</span>, Path(name).stem)", "        <span class=\"k\">return</span> <span class=\"k\">int</span>(m.group(<span class=\"n\">1</span>)) <span class=\"k\">if</span> m <span class=\"k\">else</span> <span class=\"n\">0</span>", "", "    <span class=\"k\">with</span> zipfile.ZipFile(zip_path) <span class=\"k\">as</span> zf:", "        names = sorted((n <span class=\"k\">for</span> n <span class=\"k\">in</span> zf.namelist() <span class=\"k\">if</span> n.lower().endswith((<span class=\"s\">&quot;.tif&quot;</span>, <span class=\"s\">&quot;.tiff&quot;</span>))), key=slice_index)", "        <span class=\"k\">if</span> <span class=\"k\">not</span> names:", "            <span class=\"k\">raise</span> FileNotFoundError(f<span class=\"s\">&quot;no TIFF files in {zip_path}&quot;</span>)", "        zs, ys, xs = crop <span class=\"k\">if</span> crop <span class=\"k\">else</span> (slice(<span class=\"k\">None</span>), slice(<span class=\"k\">None</span>), slice(<span class=\"k\">None</span>))", "        names = names[zs]", "        first = tifffile.imread(io.BytesIO(zf.read(names[<span class=\"n\">0</span>])))[ys, xs]", "        vol = np.empty((len(names), *first.shape), dtype=dtype)", "        <span class=\"k\">for</span> i, n <span class=\"k\">in</span> enumerate(names):", "            vol[i] = tifffile.imread(io.BytesIO(zf.read(n)))[ys, xs]", "    LOG.info(<span class=\"s\">&quot;loaded %d slices of %s from %s&quot;</span>, len(names), first.shape, zip_path.name)", "    <span class=\"k\">return</span> vol", "", "", "<span class=\"k\">def</span> load_dicom(folder: Path) -&gt; tuple[np.ndarray, tuple[<span class=\"k\">float</span>, <span class=\"k\">float</span>, <span class=\"k\">float</span>]]:", "    <span class=\"s\">&quot;&quot;</span>&quot;Load a DICOM volume (multi-frame file <span class=\"k\">or</span> one file per slice).", "", "    Returns the [z, y, x] array <span class=\"k\">and</span> the voxel spacing (sx, sy, sz) <span class=\"k\">in</span> mm read <span class=\"k\">from</span> the headers.", "    <span class=\"s\">&quot;&quot;</span>&quot;", "    <span class=\"k\">import</span> pydicom", "", "    files = sorted(p <span class=\"k\">for</span> p <span class=\"k\">in</span> folder.rglob(<span class=\"s\">&quot;*&quot;</span>) <span class=\"k\">if</span> p.is_file() <span class=\"k\">and</span> p.suffix.lower() <span class=\"k\">in</span> (<span class=\"s\">&quot;.dcm&quot;</span>, <span class=\"s\">&quot;&quot;</span>))", "    datasets = []", "    <span class=\"k\">for</span> f <span class=\"k\">in</span> files:", "        <span class=\"k\">try</span>:", "            datasets.append(pydicom.dcmread(f))", "        except Exception:  <span class=\"c\"># noqa: BLE001 - non-DICOM files in the zip are skipped on purpose</span>", "            <span class=\"k\">continue</span>", "    <span class=\"k\">if</span> <span class=\"k\">not</span> datasets:", "        <span class=\"k\">raise</span> FileNotFoundError(f<span class=\"s\">&quot;no DICOM files under {folder}&quot;</span>)", "", "    <span class=\"k\">if</span> len(datasets) == <span class=\"n\">1</span> <span class=\"k\">and</span> <span class=\"k\">int</span>(getattr(datasets[<span class=\"n\">0</span>], <span class=\"s\">&quot;NumberOfFrames&quot;</span>, <span class=\"n\">1</span>)) &gt; <span class=\"n\">1</span>:", "        ds = datasets[<span class=\"n\">0</span>]", "        vol = ds.pixel_array", "        sy, sx = (<span class=\"k\">float</span>(v) <span class=\"k\">for</span> v <span class=\"k\">in</span> _pixel_spacing(ds))", "        sz = _slice_thickness(ds, <span class=\"k\">default</span>=sx)", "    <span class=\"k\">else</span>:", "        datasets.sort(key=<span class=\"k\">lambda</span> d: <span class=\"k\">float</span>(getattr(d, <span class=\"s\">&quot;ImagePositionPatient&quot;</span>, [<span class=\"n\">0</span>, <span class=\"n\">0</span>, getattr(d, <span class=\"s\">&quot;InstanceNumber&quot;</span>, <span class=\"n\">0</span>)])[<span class=\"n\">2</span>]))", "        vol = np.stack([d.pixel_array <span class=\"k\">for</span> d <span class=\"k\">in</span> datasets])", "        sy, sx = (<span class=\"k\">float</span>(v) <span class=\"k\">for</span> v <span class=\"k\">in</span> _pixel_spacing(datasets[<span class=\"n\">0</span>]))", "        <span class=\"k\">if</span> len(datasets) &gt; <span class=\"n\">1</span> <span class=\"k\">and</span> hasattr(datasets[<span class=\"n\">0</span>], <span class=\"s\">&quot;ImagePositionPatient&quot;</span>):", "            sz = abs(<span class=\"k\">float</span>(datasets[<span class=\"n\">1</span>].ImagePositionPatient[<span class=\"n\">2</span>]) - <span class=\"k\">float</span>(datasets[<span class=\"n\">0</span>].ImagePositionPatient[<span class=\"n\">2</span>])) <span class=\"k\">or</span> sx", "        <span class=\"k\">else</span>:", "            sz = _slice_thickness(datasets[<span class=\"n\">0</span>], <span class=\"k\">default</span>=sx)", "    LOG.info(<span class=\"s\">&quot;loaded DICOM volume %s, spacing %.4f/%.4f/%.4f mm&quot;</span>, vol.shape, sx, sy, sz)", "    <span class=\"k\">return</span> vol, (sx, sy, sz)", "", "", "<span class=\"k\">def</span> _pixel_spacing(ds) -&gt; tuple[<span class=\"k\">float</span>, <span class=\"k\">float</span>]:", "    <span class=\"k\">if</span> hasattr(ds, <span class=\"s\">&quot;PixelSpacing&quot;</span>):", "        <span class=\"k\">return</span> ds.PixelSpacing", "    shared = getattr(ds, <span class=\"s\">&quot;SharedFunctionalGroupsSequence&quot;</span>, <span class=\"k\">None</span>)", "    <span class=\"k\">if</span> shared:", "        <span class=\"k\">return</span> shared[<span class=\"n\">0</span>].PixelMeasuresSequence[<span class=\"n\">0</span>].PixelSpacing", "    <span class=\"k\">raise</span> ValueError(<span class=\"s\">&quot;DICOM has no PixelSpacing&quot;</span>)", "", "", "<span class=\"k\">def</span> _slice_thickness(ds, <span class=\"k\">default</span>: <span class=\"k\">float</span>) -&gt; <span class=\"k\">float</span>:", "    <span class=\"k\">if</span> hasattr(ds, <span class=\"s\">&quot;SpacingBetweenSlices&quot;</span>):", "        <span class=\"k\">return</span> <span class=\"k\">float</span>(ds.SpacingBetweenSlices)", "    <span class=\"k\">if</span> hasattr(ds, <span class=\"s\">&quot;SliceThickness&quot;</span>):", "        <span class=\"k\">return</span> <span class=\"k\">float</span>(ds.SliceThickness)", "    shared = getattr(ds, <span class=\"s\">&quot;SharedFunctionalGroupsSequence&quot;</span>, <span class=\"k\">None</span>)", "    <span class=\"k\">if</span> shared:", "        pm = shared[<span class=\"n\">0</span>].PixelMeasuresSequence[<span class=\"n\">0</span>]", "        <span class=\"k\">if</span> hasattr(pm, <span class=\"s\">&quot;SpacingBetweenSlices&quot;</span>):", "            <span class=\"k\">return</span> <span class=\"k\">float</span>(pm.SpacingBetweenSlices)", "        <span class=\"k\">if</span> hasattr(pm, <span class=\"s\">&quot;SliceThickness&quot;</span>):", "            <span class=\"k\">return</span> <span class=\"k\">float</span>(pm.SliceThickness)", "    <span class=\"k\">return</span> <span class=\"k\">default</span>", "", "", "<span class=\"c\"># --------------------------------------------------------------------------- transforms</span>", "", "<span class=\"k\">def</span> otsu_threshold(vol: np.ndarray) -&gt; <span class=\"k\">float</span>:", "    <span class=\"s\">&quot;&quot;</span><span class=\"s\">&quot;Otsu air/material threshold on a strided sample of the volume (fast, same answer).&quot;</span><span class=\"s\">&quot;&quot;</span>", "    s = HISTOGRAM_SAMPLE_STRIDE", "    <span class=\"k\">return</span> <span class=\"k\">float</span>(threshold_otsu(vol[::s, ::s, ::s]))", "", "", "ISO50_AIR_FRACTION = <span class=\"n\">0.003</span>", "", "", "<span class=\"k\">def</span> iso50_threshold(vol: np.ndarray, air_fraction: <span class=\"k\">float</span> = ISO50_AIR_FRACTION) -&gt; tuple[<span class=\"k\">float</span>, <span class=\"k\">float</span>, <span class=\"k\">float</span>]:", "    <span class=\"s\">&quot;&quot;</span>&quot;ISO50 surface threshold <span class=\"k\">for</span> a volume that <span class=\"k\">is</span> mostly material <span class=\"k\">with</span> sparse pores.", "", "    ISO50 (standard surface determination <span class=\"k\">in</span> industrial CT) places the material/air", "    boundary halfway between the air <span class=\"k\">and</span> the material grey values. Here the material value", "    <span class=\"k\">is</span> the median voxel <span class=\"k\">and</span> the air value <span class=\"k\">is</span> the median of the darkest ``air_fraction`` of", "    voxels (the pore interiors). Otsu cannot be used on such data: <span class=\"k\">with</span> &lt;<span class=\"n\">1</span> % pores the", "    histogram <span class=\"k\">is</span> unimodal <span class=\"k\">and</span> Otsu splits the metal&#x27;s own noise <span class=\"k\">in</span> two.", "", "    Returns ``(threshold, air_value, material_value)``.", "    <span class=\"s\">&quot;&quot;</span>&quot;", "    s = HISTOGRAM_SAMPLE_STRIDE // 2  # denser sample: the air tail is tiny", "    sample = vol[::s, ::s, ::s].ravel()", "    material = <span class=\"k\">float</span>(np.median(sample))", "    cutoff = np.percentile(sample, <span class=\"n\">100.0</span> * air_fraction)", "    air = <span class=\"k\">float</span>(np.median(sample[sample &lt;= cutoff]))", "    <span class=\"k\">return</span> <span class=\"n\">0.5</span> * (air + material), air, material", "", "", "<span class=\"k\">def</span> object_bbox(mask: np.ndarray, margin: <span class=\"k\">int</span> = CROP_MARGIN_VOXELS) -&gt; tuple[slice, slice, slice]:", "    <span class=\"s\">&quot;&quot;</span><span class=\"s\">&quot;Bounding box of the True voxels of ``mask`` plus ``margin`` voxels, clamped to the array.&quot;</span><span class=\"s\">&quot;&quot;</span>", "    <span class=\"k\">if</span> <span class=\"k\">not</span> mask.any():", "        <span class=\"k\">raise</span> ValueError(<span class=\"s\">&quot;object mask is empty; threshold is wrong&quot;</span>)", "    slices = []", "    <span class=\"k\">for</span> axis <span class=\"k\">in</span> range(<span class=\"n\">3</span>):", "        other = tuple(a <span class=\"k\">for</span> a <span class=\"k\">in</span> range(<span class=\"n\">3</span>) <span class=\"k\">if</span> a != axis)", "        hit = np.flatnonzero(mask.any(axis=other))", "        lo = max(<span class=\"k\">int</span>(hit[<span class=\"n\">0</span>]) - margin, <span class=\"n\">0</span>)", "        hi = min(<span class=\"k\">int</span>(hit[-<span class=\"n\">1</span>]) + margin + <span class=\"n\">1</span>, mask.shape[axis])", "        slices.append(slice(lo, hi))", "    <span class=\"k\">return</span> tuple(slices)  <span class=\"c\"># type: ignore[return-value]</span>", "", "", "<span class=\"k\">def</span> window_from_percentiles(vol: np.ndarray, object_mask: np.ndarray | <span class=\"k\">None</span> = <span class=\"k\">None</span>) -&gt; tuple[<span class=\"k\">float</span>, <span class=\"k\">float</span>]:", "    <span class=\"s\">&quot;&quot;</span>&quot;Return (low, high) raw intensities <span class=\"k\">for</span> the display window.", "", "    Uses percentiles of the object voxels when a mask <span class=\"k\">is</span> given, otherwise of the whole volume.", "    <span class=\"s\">&quot;&quot;</span>&quot;", "    s = HISTOGRAM_SAMPLE_STRIDE", "    sample = vol[::s, ::s, ::s]", "    <span class=\"k\">if</span> object_mask <span class=\"k\">is</span> <span class=\"k\">not</span> <span class=\"k\">None</span>:", "        sample = sample[object_mask[::s, ::s, ::s]]", "    lo, hi = np.percentile(sample, [WINDOW_LOW_PERCENTILE, WINDOW_HIGH_PERCENTILE])", "    <span class=\"k\">if</span> hi &lt;= lo:", "        hi = lo + <span class=\"n\">1.0</span>", "    <span class=\"k\">return</span> <span class=\"k\">float</span>(lo), <span class=\"k\">float</span>(hi)", "", "", "<span class=\"k\">def</span> to_u8(vol: np.ndarray, low: <span class=\"k\">float</span>, high: <span class=\"k\">float</span>) -&gt; np.ndarray:", "    <span class=\"s\">&quot;&quot;</span><span class=\"s\">&quot;Linearly map [low, high] to [0, 255] with clamping. Processes slab-wise to bound memory.&quot;</span><span class=\"s\">&quot;&quot;</span>", "    <span class=\"k\">out</span> = np.empty(vol.shape, dtype=np.uint8)", "    scale = <span class=\"n\">255.0</span> / (high - low)", "    <span class=\"k\">for</span> z <span class=\"k\">in</span> range(vol.shape[<span class=\"n\">0</span>]):", "        <span class=\"k\">out</span>[z] = np.clip((vol[z].astype(np.float32) - low) * scale, <span class=\"n\">0</span>, <span class=\"n\">255</span>).astype(np.uint8)", "    <span class=\"k\">return</span> <span class=\"k\">out</span>", "", "", "<span class=\"k\">def</span> downsample_factor(shape: tuple[<span class=\"k\">int</span>, ...], target: <span class=\"k\">int</span>) -&gt; <span class=\"k\">int</span>:", "    <span class=\"s\">&quot;&quot;</span><span class=\"s\">&quot;Smallest integer factor that brings the longest axis to &lt;= ``target`` voxels.&quot;</span><span class=\"s\">&quot;&quot;</span>", "    <span class=\"k\">return</span> max(<span class=\"n\">1</span>, math.ceil(max(shape) / target))", "", "", "<span class=\"k\">def</span> _pad_to_multiple(vol: np.ndarray, f: <span class=\"k\">int</span>, mode: str) -&gt; np.ndarray:", "    pad = [(<span class=\"n\">0</span>, (-n) % f) <span class=\"k\">for</span> n <span class=\"k\">in</span> vol.shape]", "    <span class=\"k\">if</span> <span class=\"k\">not</span> any(p[<span class=\"n\">1</span>] <span class=\"k\">for</span> p <span class=\"k\">in</span> pad):", "        <span class=\"k\">return</span> vol", "    <span class=\"k\">return</span> np.pad(vol, pad, mode=mode)", "", "", "<span class=\"k\">def</span> downsample_mean(vol: np.ndarray, f: <span class=\"k\">int</span>) -&gt; np.ndarray:", "    <span class=\"s\">&quot;&quot;</span>&quot;Area-mean (box filter) downsampling by integer factor ``f`` on all axes.", "", "    Area-mean <span class=\"k\">is</span> the correct anti-aliasing filter <span class=\"k\">for</span> intensities: each output voxel <span class=\"k\">is</span> the", "    average attenuation of the physical region it covers. Edge blocks are padded by", "    replicating the border so they are <span class=\"k\">not</span> darkened.", "    <span class=\"s\">&quot;&quot;</span>&quot;", "    <span class=\"k\">if</span> f == <span class=\"n\">1</span>:", "        <span class=\"k\">return</span> vol.copy()", "    v = _pad_to_multiple(vol, f, mode=<span class=\"s\">&quot;edge&quot;</span>)", "    nz, ny, nx = (n // f for n in v.shape)", "    <span class=\"k\">out</span> = np.empty((nz, ny, nx), dtype=np.float32)", "    <span class=\"c\"># Slab-wise over z to keep peak memory at one slab of float32.</span>", "    <span class=\"k\">for</span> z <span class=\"k\">in</span> range(nz):", "        block = v[z * f:(z + <span class=\"n\">1</span>) * f].astype(np.float32)", "        <span class=\"k\">out</span>[z] = block.reshape(f, ny, f, nx, f).mean(axis=(<span class=\"n\">0</span>, <span class=\"n\">2</span>, <span class=\"n\">4</span>))", "    <span class=\"k\">return</span> np.clip(np.rint(<span class=\"k\">out</span>), <span class=\"n\">0</span>, np.iinfo(vol.dtype).max <span class=\"k\">if</span> vol.dtype.kind <span class=\"k\">in</span> <span class=\"s\">&quot;ui&quot;</span> <span class=\"k\">else</span> <span class=\"k\">None</span>).astype(vol.dtype)", "", "", "<span class=\"k\">def</span> downsample_max(labels: np.ndarray, f: <span class=\"k\">int</span>) -&gt; np.ndarray:", "    <span class=\"s\">&quot;&quot;</span>&quot;Max-pool downsampling <span class=\"k\">for</span> label volumes.", "", "    Why max <span class=\"k\">and</span> <span class=\"k\">not</span> mean <span class=\"k\">or</span> nearest: a <span class=\"n\">20</span> \u00b5m pore covers only a few full-res voxels; nearest", "    sampling would drop most of them <span class=\"k\">and</span> averaging label IDs <span class=\"k\">is</span> meaningless. Max-pool keeps", "    every defect that touches a block (<span class=\"k\">if</span> two defects share a block, the higher ID wins,", "    which <span class=\"k\">is</span> acceptable at display resolution).", "    <span class=\"s\">&quot;&quot;</span>&quot;", "    <span class=\"k\">if</span> f == <span class=\"n\">1</span>:", "        <span class=\"k\">return</span> labels.copy()", "    v = _pad_to_multiple(labels, f, mode=<span class=\"s\">&quot;constant&quot;</span>)", "    nz, ny, nx = (n // f for n in v.shape)", "    <span class=\"k\">out</span> = np.empty((nz, ny, nx), dtype=labels.dtype)", "    <span class=\"k\">for</span> z <span class=\"k\">in</span> range(nz):", "        block = v[z * f:(z + <span class=\"n\">1</span>) * f]", "        <span class=\"k\">out</span>[z] = block.reshape(f, ny, f, nx, f).max(axis=(<span class=\"n\">0</span>, <span class=\"n\">2</span>, <span class=\"n\">4</span>))", "    <span class=\"k\">return</span> <span class=\"k\">out</span>"]}, {"group": "1 Data (Python)", "path": "tools/segment.py", "title": "Finding the pores", "what": "Turns the thresholded volume into separate pores, each with its own ID.", "qs": ["What exactly is a pore in your code?", "How do you remove noise?"], "points": [{"line": 23, "label": "material_mask()", "text": "Every voxel brighter than the threshold is metal.", "end": 25}, {"line": 28, "label": "enclosed_air()", "text": "The definition of a pore: air completely enclosed by metal (3D hole filling). Air touching the outside is not a pore.", "end": 35}, {"line": 38, "label": "label_components()", "text": "26-connected components: each separate air blob gets an ID (16-bit). Blobs below a minimum voxel count are dropped as noise.", "end": 52}, {"line": 65, "label": "multi_threshold_components()", "text": "For the Enigma: splits the parts into density classes (several thresholds) instead of pores.", "end": 88}], "code": ["<span class=\"s\">&quot;&quot;</span>&quot;Defect <span class=\"k\">and</span> component segmentation at full resolution.", "", "Pore definition (specimen A): a pore <span class=\"k\">is</span> *air enclosed by material*. We threshold material,", "fill its holes <span class=\"k\">in</span> 3D, <span class=\"k\">and</span> the difference (filled minus material) <span class=\"k\">is</span> exactly the enclosed", "air. Air that touches the outside of the scanned region <span class=\"k\">is</span> <span class=\"k\">not</span> a pore <span class=\"k\">and</span> <span class=\"k\">is</span> excluded", "automatically, because ``binary_fill_holes`` only fills cavities <span class=\"k\">with</span> no path to the border.", "<span class=\"s\">&quot;&quot;</span>&quot;", "<span class=\"k\">from</span> __future__ <span class=\"k\">import</span> annotations", "", "<span class=\"k\">import</span> logging", "", "<span class=\"k\">import</span> cc3d", "<span class=\"k\">import</span> numpy <span class=\"k\">as</span> np", "<span class=\"k\">from</span> scipy <span class=\"k\">import</span> ndimage", "", "<span class=\"k\">from</span> common <span class=\"k\">import</span> MIN_COMPONENT_VOXELS", "", "LOG = logging.getLogger(<span class=\"s\">&quot;segment&quot;</span>)", "", "CONNECTIVITY = <span class=\"n\">26</span>  <span class=\"c\"># full 3D neighbourhood: diagonal voxel contacts belong to the same pore</span>", "", "", "<span class=\"k\">def</span> material_mask(vol: np.ndarray, threshold: <span class=\"k\">float</span>) -&gt; np.ndarray:", "    <span class=\"s\">&quot;&quot;</span><span class=\"s\">&quot;Voxels brighter than ``threshold`` (attenuating material).&quot;</span><span class=\"s\">&quot;&quot;</span>", "    <span class=\"k\">return</span> vol &gt; threshold", "", "", "<span class=\"k\">def</span> enclosed_air(material: np.ndarray) -&gt; tuple[np.ndarray, np.ndarray]:", "    <span class=\"s\">&quot;&quot;</span>&quot;Return ``(pores, filled)`` where ``filled`` <span class=\"k\">is</span> material <span class=\"k\">with</span> all cavities filled.", "", "    ``filled`` <span class=\"k\">is</span> also the object mask used later <span class=\"k\">for</span> the depth-below-surface distance.", "    <span class=\"s\">&quot;&quot;</span>&quot;", "    filled = ndimage.binary_fill_holes(material)", "    pores = filled &amp; ~material", "    <span class=\"k\">return</span> pores, filled", "", "", "<span class=\"k\">def</span> label_components(mask: np.ndarray, min_voxels: <span class=\"k\">int</span> = MIN_COMPONENT_VOXELS) -&gt; tuple[np.ndarray, <span class=\"k\">int</span>]:", "    <span class=\"s\">&quot;&quot;</span>&quot;<span class=\"n\">26</span>-connected components of ``mask``; drops components under ``min_voxels``.", "", "    Returns ``(labels, count)`` <span class=\"k\">with</span> labels renumbered <span class=\"n\">1</span>..count <span class=\"k\">in</span> uint16 (<span class=\"n\">0</span> = background).", "    uint16 halves memory against cc3d&#x27;s <span class=\"k\">default</span> uint32, which matters at ~<span class=\"n\">900</span> M voxels;", "    a ValueError <span class=\"k\">is</span> raised <span class=\"k\">if</span> a volume ever has more than <span class=\"n\">65535</span> components.", "    <span class=\"s\">&quot;&quot;</span>&quot;", "    labels = cc3d.connected_components(mask, connectivity=CONNECTIVITY, out_dtype=np.uint32)", "    <span class=\"k\">if</span> min_voxels &gt; <span class=\"n\">1</span>:", "        labels = cc3d.dust(labels, threshold=min_voxels, connectivity=CONNECTIVITY, in_place=<span class=\"k\">True</span>)", "    labels, count = _relabel_sequential(labels)", "    <span class=\"k\">if</span> count &gt; np.iinfo(np.uint16).max:", "        <span class=\"k\">raise</span> ValueError(f<span class=\"s\">&quot;{count} components exceed the uint16 label range&quot;</span>)", "    LOG.info(<span class=\"s\">&quot;labelled %d components (min size %d voxels)&quot;</span>, count, min_voxels)", "    <span class=\"k\">return</span> labels.astype(np.uint16), count", "", "", "<span class=\"k\">def</span> _relabel_sequential(labels: np.ndarray) -&gt; tuple[np.ndarray, <span class=\"k\">int</span>]:", "    ids = np.unique(labels)", "    ids = ids[ids != <span class=\"n\">0</span>]", "    <span class=\"k\">if</span> ids.size == <span class=\"n\">0</span>:", "        <span class=\"k\">return</span> np.zeros_like(labels), <span class=\"n\">0</span>", "    lut = np.zeros(<span class=\"k\">int</span>(ids.max()) + <span class=\"n\">1</span>, dtype=labels.dtype)", "    lut[ids] = np.arange(<span class=\"n\">1</span>, ids.size + <span class=\"n\">1</span>, dtype=labels.dtype)", "    <span class=\"k\">return</span> lut[labels], <span class=\"k\">int</span>(ids.size)", "", "", "<span class=\"k\">def</span> multi_threshold_components(", "    vol: np.ndarray, thresholds: list[<span class=\"k\">float</span>], min_voxels: <span class=\"k\">int</span>", ") -&gt; tuple[np.ndarray, <span class=\"k\">int</span>, np.ndarray]:", "    <span class=\"s\">&quot;&quot;</span>&quot;Specimen B: connected components per attenuation bin.", "", "    Voxels are binned by ``thresholds`` (bin <span class=\"n\">0</span> = air <span class=\"k\">is</span> ignored); each bin <span class=\"k\">is</span> labelled", "    separately so a steel pin touching a brass contact stays two components.", "    Returns ``(labels, count, bin_of_label)`` where ``bin_of_label[i]`` <span class=\"k\">is</span> the bin of label i.", "    <span class=\"s\">&quot;&quot;</span>&quot;", "    bins = np.digitize(vol, thresholds).astype(np.uint8)", "    <span class=\"k\">out</span> = np.zeros(vol.shape, dtype=np.uint16)", "    bin_of_label = [<span class=\"n\">0</span>]", "    next_id = <span class=\"n\">1</span>", "    <span class=\"k\">for</span> b <span class=\"k\">in</span> range(<span class=\"n\">1</span>, len(thresholds) + <span class=\"n\">1</span>):", "        lab, n = label_components(bins == b, min_voxels=min_voxels)", "        <span class=\"k\">if</span> n == <span class=\"n\">0</span>:", "            <span class=\"k\">continue</span>", "        <span class=\"k\">if</span> next_id + n - <span class=\"n\">1</span> &gt; np.iinfo(np.uint16).max:", "            <span class=\"k\">raise</span> ValueError(<span class=\"s\">&quot;too many components for uint16 labels&quot;</span>)", "        sel = lab &gt; <span class=\"n\">0</span>", "        <span class=\"k\">out</span>[sel] = lab[sel] + (next_id - <span class=\"n\">1</span>)", "        bin_of_label.extend([b] * n)", "        next_id += n", "    <span class=\"k\">return</span> <span class=\"k\">out</span>, next_id - <span class=\"n\">1</span>, np.asarray(bin_of_label, dtype=np.uint8)"]}, {"group": "1 Data (Python)", "path": "tools/features.py", "title": "Measuring each pore", "what": "Computes size, shape and position for every pore, classifies it, and compares our result with NIST's reference.", "qs": ["How do you compute sphericity?", "What are precision, recall and IoU?"], "points": [{"line": 52, "label": "equivalent_diameter()", "text": "Diameter of a sphere with the same volume.", "end": 54}, {"line": 57, "label": "sphericity()", "text": "How round a pore is (1 = perfect sphere), from volume and surface area. Not meaningful for very small pores (8-30 voxels).", "end": 63}, {"line": 77, "label": "elongation()", "text": "How stretched a pore is: sqrt(largest / smallest eigenvalue) of the voxel spread. Max/min (not max/mid) so flat disc-shaped cracks are caught too.", "end": 88}, {"line": 91, "label": "classify()", "text": "Crack = sphericity < 0.5 and elongation > 3; lack of fusion = sphericity < 0.75; everything else = gas pore.", "end": 97}, {"line": 114, "label": "compute_features()", "text": "Runs all measurements for every pore and builds the rows for features.csv.", "end": 167}, {"line": 182, "label": "compare_to_ground_truth()", "text": "Matches our pores with NIST's: TP (correct), FP (false), FN (missed). Gives precision 0.90, recall 0.75, IoU 0.59.", "end": 203}], "code": ["<span class=\"s\">&quot;&quot;</span>&quot;Per-defect shape features, classification <span class=\"k\">and</span> ground-truth comparison.", "", "Every feature <span class=\"k\">is</span> computed at full resolution <span class=\"k\">in</span> physical units (mm), before any", "downsampling, so the chart shows the <span class=\"k\">true</span> geometry rather than display-resolution blobs.", "<span class=\"s\">&quot;&quot;</span>&quot;", "<span class=\"k\">from</span> __future__ <span class=\"k\">import</span> annotations", "", "<span class=\"k\">import</span> logging", "<span class=\"k\">import</span> math", "<span class=\"k\">from</span> dataclasses <span class=\"k\">import</span> dataclass", "", "<span class=\"k\">import</span> numpy <span class=\"k\">as</span> np", "<span class=\"k\">from</span> scipy <span class=\"k\">import</span> ndimage", "<span class=\"k\">from</span> skimage.measure <span class=\"k\">import</span> marching_cubes, mesh_surface_area", "", "LOG = logging.getLogger(<span class=\"s\">&quot;features&quot;</span>)", "", "<span class=\"c\"># Classification thresholds (prompt section 3). Kept as named constants so the rule is</span>", "<span class=\"c\"># visible in one place and quoted verbatim in docs/DATA.md.</span>", "CRACK_MAX_SPHERICITY = <span class=\"n\">0.5</span>", "CRACK_MIN_ELONGATION = <span class=\"n\">3.0</span>", "LACK_OF_FUSION_MAX_SPHERICITY = <span class=\"n\">0.75</span>", "", "<span class=\"c\"># Smoothing before marching cubes. A binary voxel mask has a staircase surface whose area</span>", "<span class=\"c\"># is ~1.5x the true area of the smooth object it samples (the &quot;Manhattan&quot; overestimate);</span>", "<span class=\"c\"># a light Gaussian blur turns the staircase into a smooth iso-surface at the 0.5 level.</span>", "SURFACE_SMOOTHING_SIGMA_VOXELS = <span class=\"n\">1.0</span>", "SURFACE_PAD_VOXELS = <span class=\"n\">3</span>", "", "", "@dataclass", "<span class=\"k\">class</span> DefectFeatures:", "    <span class=\"s\">&quot;&quot;</span><span class=\"s\">&quot;All per-defect values written to ``features.csv`` (units in field names).&quot;</span><span class=\"s\">&quot;&quot;</span>", "", "    id: <span class=\"k\">int</span>", "    voxel_count: <span class=\"k\">int</span>", "    volume_mm3: <span class=\"k\">float</span>", "    eq_diameter_mm: <span class=\"k\">float</span>", "    surface_mm2: <span class=\"k\">float</span>", "    sphericity: <span class=\"k\">float</span>", "    elongation: <span class=\"k\">float</span>", "    centroid_mm: tuple[<span class=\"k\">float</span>, <span class=\"k\">float</span>, <span class=\"k\">float</span>]  <span class=\"c\"># (x, y, z)</span>", "    depth_mm: <span class=\"k\">float</span>", "    bbox_min_mm: tuple[<span class=\"k\">float</span>, <span class=\"k\">float</span>, <span class=\"k\">float</span>]", "    bbox_max_mm: tuple[<span class=\"k\">float</span>, <span class=\"k\">float</span>, <span class=\"k\">float</span>]", "    mean_density_u8: <span class=\"k\">float</span>", "    cls: str = <span class=\"s\">&quot;&quot;</span>", "    material_bin: <span class=\"k\">int</span> = <span class=\"n\">0</span>  <span class=\"c\"># specimen B: attenuation bin the component was segmented from</span>", "    gt_status: str = <span class=\"s\">&quot;NA&quot;</span>", "", "", "<span class=\"k\">def</span> equivalent_diameter(volume_mm3: <span class=\"k\">float</span>) -&gt; <span class=\"k\">float</span>:", "    <span class=\"s\">&quot;&quot;</span><span class=\"s\">&quot;Diameter of the sphere with the same volume: d = (6V/\u03c0)^(1/3).&quot;</span><span class=\"s\">&quot;&quot;</span>", "    <span class=\"k\">return</span> (<span class=\"n\">6.0</span> * volume_mm3 / math.pi) ** (<span class=\"n\">1.0</span> / <span class=\"n\">3.0</span>)", "", "", "<span class=\"k\">def</span> sphericity(volume_mm3: <span class=\"k\">float</span>, surface_mm2: <span class=\"k\">float</span>) -&gt; <span class=\"k\">float</span>:", "    <span class=\"s\">&quot;&quot;</span><span class=\"s\">&quot;Wadell sphericity \u03c8 = \u03c0^(1/3) (6V)^(2/3) / A. Equals 1 for a perfect sphere.&quot;</span><span class=\"s\">&quot;&quot;</span>", "    <span class=\"k\">if</span> surface_mm2 &lt;= <span class=\"n\">0</span>:", "        <span class=\"k\">return</span> <span class=\"n\">0.0</span>", "    psi = math.pi ** (<span class=\"n\">1.0</span> / <span class=\"n\">3.0</span>) * (<span class=\"n\">6.0</span> * volume_mm3) ** (<span class=\"n\">2.0</span> / <span class=\"n\">3.0</span>) / surface_mm2", "    <span class=\"c\"># Discretisation can push tiny defects slightly above 1; \u03c8 &gt; 1 is not physical.</span>", "    <span class=\"k\">return</span> <span class=\"k\">float</span>(min(psi, <span class=\"n\">1.0</span>))", "", "", "<span class=\"k\">def</span> surface_area_mm2(mask: np.ndarray, spacing_zyx: tuple[<span class=\"k\">float</span>, <span class=\"k\">float</span>, <span class=\"k\">float</span>]) -&gt; <span class=\"k\">float</span>:", "    <span class=\"s\">&quot;&quot;</span><span class=\"s\">&quot;Surface area of a binary object via smoothed marching cubes (see module constants).&quot;</span><span class=\"s\">&quot;&quot;</span>", "    padded = np.pad(mask.astype(np.float32), SURFACE_PAD_VOXELS)", "    smooth = ndimage.gaussian_filter(padded, SURFACE_SMOOTHING_SIGMA_VOXELS)", "    <span class=\"k\">if</span> smooth.max() &lt; <span class=\"n\">0.5</span>:", "        <span class=\"c\"># Object is so thin the blur never reaches the iso-level; fall back to the raw mask.</span>", "        smooth = padded", "    verts, faces, _, _ = marching_cubes(smooth, level=<span class=\"n\">0.5</span>, spacing=spacing_zyx)", "    <span class=\"k\">return</span> <span class=\"k\">float</span>(mesh_surface_area(verts, faces))", "", "", "<span class=\"k\">def</span> elongation(coords_mm: np.ndarray, spacing_zyx: tuple[<span class=\"k\">float</span>, <span class=\"k\">float</span>, <span class=\"k\">float</span>]) -&gt; <span class=\"k\">float</span>:", "    <span class=\"s\">&quot;&quot;</span>&quot;sqrt(\u03bb_max / \u03bb_min) of the second-moment (inertia) tensor of the voxel cloud.", "", "    Why max/min <span class=\"k\">and</span> <span class=\"k\">not</span> max/mid: cracks are flat *discs* (two large axes, one tiny), so", "    max/mid \u2248 <span class=\"n\">1</span> would miss them; max/min <span class=\"k\">is</span> large <span class=\"k\">for</span> both needles <span class=\"k\">and</span> discs.", "    Each voxel <span class=\"k\">is</span> a cube, <span class=\"k\">not</span> a point, so we add its own variance s\u00b2/<span class=\"n\">12</span> per axis;", "    otherwise a one-voxel-thick plate would have \u03bb_min = <span class=\"n\">0</span> <span class=\"k\">and</span> infinite elongation.", "    <span class=\"s\">&quot;&quot;</span>&quot;", "    cov = np.cov(coords_mm, rowvar=<span class=\"k\">False</span>) <span class=\"k\">if</span> coords_mm.shape[<span class=\"n\">0</span>] &gt; <span class=\"n\">1</span> <span class=\"k\">else</span> np.zeros((<span class=\"n\">3</span>, <span class=\"n\">3</span>))", "    cov = cov + np.diag([s * s / <span class=\"n\">12.0</span> <span class=\"k\">for</span> s <span class=\"k\">in</span> spacing_zyx])", "    eig = np.linalg.eigvalsh(cov)", "    <span class=\"k\">return</span> <span class=\"k\">float</span>(math.sqrt(eig[-<span class=\"n\">1</span>] / eig[<span class=\"n\">0</span>]))", "", "", "<span class=\"k\">def</span> classify(sph: <span class=\"k\">float</span>, elong: <span class=\"k\">float</span>) -&gt; str:", "    <span class=\"s\">&quot;&quot;</span><span class=\"s\">&quot;Prompt rule: crack = \u03c8&lt;0.5 and elongation&gt;3; lack-of-fusion = \u03c8&lt;0.75; else gas pore.&quot;</span><span class=\"s\">&quot;&quot;</span>", "    <span class=\"k\">if</span> sph &lt; CRACK_MAX_SPHERICITY <span class=\"k\">and</span> elong &gt; CRACK_MIN_ELONGATION:", "        <span class=\"k\">return</span> <span class=\"s\">&quot;crack&quot;</span>", "    <span class=\"k\">if</span> sph &lt; LACK_OF_FUSION_MAX_SPHERICITY:", "        <span class=\"k\">return</span> <span class=\"s\">&quot;lack_of_fusion&quot;</span>", "    <span class=\"k\">return</span> <span class=\"s\">&quot;gas_pore&quot;</span>", "", "", "<span class=\"k\">def</span> depth_map_mm(object_mask: np.ndarray, spacing_zyx: tuple[<span class=\"k\">float</span>, <span class=\"k\">float</span>, <span class=\"k\">float</span>], factor: <span class=\"k\">int</span>) -&gt; np.ndarray:", "    <span class=\"s\">&quot;&quot;</span>&quot;Distance (mm) <span class=\"k\">from</span> each voxel to the outside of ``object_mask``, on a coarse grid.", "", "    The Euclidean distance transform at ~<span class=\"n\">900</span> M voxels needs ~<span class=\"n\">7</span> GB of float64, so it runs on", "    the mask decimated by ``factor``. The error <span class=\"k\">is</span> bounded by about one coarse voxel", "    (factor \u00d7 spacing), which <span class=\"k\">is</span> far below the depth range the chart shows.", "    <span class=\"s\">&quot;&quot;</span>&quot;", "    coarse = object_mask[::factor, ::factor, ::factor]", "    <span class=\"c\"># Pad with background so the scan border counts as &quot;outside&quot; for the distance.</span>", "    padded = np.pad(coarse, <span class=\"n\">1</span>, constant_values=<span class=\"k\">False</span>)", "    edt = ndimage.distance_transform_edt(padded, sampling=[s * factor <span class=\"k\">for</span> s <span class=\"k\">in</span> spacing_zyx])", "    <span class=\"k\">return</span> edt[<span class=\"n\">1</span>:-<span class=\"n\">1</span>, <span class=\"n\">1</span>:-<span class=\"n\">1</span>, <span class=\"n\">1</span>:-<span class=\"n\">1</span>].astype(np.float32)", "", "", "<span class=\"k\">def</span> compute_features(", "    labels: np.ndarray,", "    intensity_u8: np.ndarray,", "    spacing_zyx: tuple[<span class=\"k\">float</span>, <span class=\"k\">float</span>, <span class=\"k\">float</span>],", "    depth_coarse_mm: np.ndarray | <span class=\"k\">None</span>,", "    depth_factor: <span class=\"k\">int</span> = <span class=\"n\">1</span>,", ") -&gt; list[DefectFeatures]:", "    <span class=\"s\">&quot;&quot;</span><span class=\"s\">&quot;Compute :class:`DefectFeatures` for every label &gt; 0 in ``labels``.&quot;</span><span class=\"s\">&quot;&quot;</span>", "    sz, sy, sx = spacing_zyx", "    voxel_mm3 = sx * sy * sz", "    <span class=\"k\">out</span>: list[DefectFeatures] = []", "    <span class=\"k\">for</span> idx, sl <span class=\"k\">in</span> enumerate(ndimage.find_objects(labels), start=<span class=\"n\">1</span>):", "        <span class=\"k\">if</span> sl <span class=\"k\">is</span> <span class=\"k\">None</span>:", "            <span class=\"k\">continue</span>", "        mask = labels[sl] == idx", "        n = <span class=\"k\">int</span>(mask.sum())", "        <span class=\"k\">if</span> n == <span class=\"n\">0</span>:", "            <span class=\"k\">continue</span>", "        zz, yy, xx = np.nonzero(mask)", "        z0, y0, x0 = (s.start <span class=\"k\">for</span> s <span class=\"k\">in</span> sl)", "        coords_mm = np.column_stack(((zz + z0 + <span class=\"n\">0.5</span>) * sz, (yy + y0 + <span class=\"n\">0.5</span>) * sy, (xx + x0 + <span class=\"n\">0.5</span>) * sx))", "", "        vol = n * voxel_mm3", "        area = surface_area_mm2(mask, spacing_zyx)", "        sph = sphericity(vol, area)", "        elong = elongation(coords_mm, spacing_zyx)", "        cz, cy, cx = coords_mm.mean(axis=<span class=\"n\">0</span>)", "", "        <span class=\"k\">if</span> depth_coarse_mm <span class=\"k\">is</span> <span class=\"k\">not</span> <span class=\"k\">None</span>:", "            gz = np.minimum((zz + z0) // depth_factor, depth_coarse_mm.shape[0] - 1)", "            gy = np.minimum((yy + y0) // depth_factor, depth_coarse_mm.shape[1] - 1)", "            gx = np.minimum((xx + x0) // depth_factor, depth_coarse_mm.shape[2] - 1)", "            <span class=\"c\"># Closest approach to the surface: the most critical point of the defect.</span>", "            depth = <span class=\"k\">float</span>(depth_coarse_mm[gz, gy, gx].min())", "        <span class=\"k\">else</span>:", "            depth = <span class=\"k\">float</span>(<span class=\"s\">&quot;nan&quot;</span>)", "", "        <span class=\"k\">out</span>.append(DefectFeatures(", "            id=idx,", "            voxel_count=n,", "            volume_mm3=vol,", "            eq_diameter_mm=equivalent_diameter(vol),", "            surface_mm2=area,", "            sphericity=sph,", "            elongation=elong,", "            centroid_mm=(<span class=\"k\">float</span>(cx), <span class=\"k\">float</span>(cy), <span class=\"k\">float</span>(cz)),", "            depth_mm=depth,", "            bbox_min_mm=(x0 * sx, y0 * sy, z0 * sz),", "            bbox_max_mm=(sl[<span class=\"n\">2</span>].stop * sx, sl[<span class=\"n\">1</span>].stop * sy, sl[<span class=\"n\">0</span>].stop * sz),", "            mean_density_u8=<span class=\"k\">float</span>(intensity_u8[sl][mask].mean()),", "            cls=classify(sph, elong),", "        ))", "    LOG.info(<span class=\"s\">&quot;computed features for %d defects&quot;</span>, len(<span class=\"k\">out</span>))", "    <span class=\"k\">return</span> <span class=\"k\">out</span>", "", "", "@dataclass", "<span class=\"k\">class</span> GroundTruthResult:", "    <span class=\"s\">&quot;&quot;</span><span class=\"s\">&quot;Object- and voxel-level agreement between our pores and a reference segmentation.&quot;</span><span class=\"s\">&quot;&quot;</span>", "", "    precision: <span class=\"k\">float</span>", "    recall: <span class=\"k\">float</span>", "    iou: <span class=\"k\">float</span>", "    tp_pred_ids: <span class=\"k\">set</span>[<span class=\"k\">int</span>]", "    matched_gt_ids: <span class=\"k\">set</span>[<span class=\"k\">int</span>]", "    gt_count: <span class=\"k\">int</span>", "", "", "<span class=\"k\">def</span> compare_to_ground_truth(pred: np.ndarray, gt: np.ndarray, gt_count: <span class=\"k\">int</span>) -&gt; GroundTruthResult:", "    <span class=\"s\">&quot;&quot;</span>&quot;Compare predicted pore labels <span class=\"k\">with</span> reference pore labels.", "", "    * Object level: a predicted defect <span class=\"k\">is</span> a <span class=\"k\">true</span> positive <span class=\"k\">if</span> it overlaps any reference", "      defect by at least one voxel; a reference defect <span class=\"k\">with</span> no overlap <span class=\"k\">is</span> a <span class=\"k\">false</span> negative.", "      precision = TP_pred / N_pred, recall = matched_ref / N_ref.", "    * Voxel level: IoU = |P \u2229 G| / |P \u222a G| over all pore voxels.", "    <span class=\"s\">&quot;&quot;</span>&quot;", "    p = pred &gt; <span class=\"n\">0</span>", "    g = gt &gt; <span class=\"n\">0</span>", "    inter = p &amp; g", "    union = <span class=\"k\">int</span>((p | g).sum())", "    iou = <span class=\"k\">float</span>(inter.sum()) / union <span class=\"k\">if</span> union <span class=\"k\">else</span> <span class=\"n\">1.0</span>", "", "    <span class=\"c\"># Pairs (pred id, gt id) that share at least one voxel, via a combined 32-bit key.</span>", "    keys = np.unique(pred[inter].astype(np.uint32) &lt;&lt; <span class=\"n\">16</span> | gt[inter].astype(np.uint32))", "    tp_pred = {<span class=\"k\">int</span>(k &gt;&gt; <span class=\"n\">16</span>) <span class=\"k\">for</span> k <span class=\"k\">in</span> keys}", "    matched_gt = {<span class=\"k\">int</span>(k &amp; 0xFFFF) <span class=\"k\">for</span> k <span class=\"k\">in</span> keys}", "    n_pred = <span class=\"k\">int</span>(pred.max()) <span class=\"k\">if</span> pred.size <span class=\"k\">else</span> <span class=\"n\">0</span>", "    precision = len(tp_pred) / n_pred <span class=\"k\">if</span> n_pred <span class=\"k\">else</span> <span class=\"n\">0.0</span>", "    recall = len(matched_gt) / gt_count <span class=\"k\">if</span> gt_count <span class=\"k\">else</span> <span class=\"n\">0.0</span>", "    <span class=\"k\">return</span> GroundTruthResult(precision, recall, iou, tp_pred, matched_gt, gt_count)", "", "", "<span class=\"k\">def</span> features_to_rows(features: list[DefectFeatures]) -&gt; list[dict]:", "    <span class=\"s\">&quot;&quot;</span><span class=\"s\">&quot;Flatten features into dicts keyed by ``common.FEATURE_COLUMNS``.&quot;</span><span class=\"s\">&quot;&quot;</span>", "    rows = []", "    <span class=\"k\">for</span> f <span class=\"k\">in</span> features:", "        rows.append({", "            <span class=\"s\">&quot;id&quot;</span>: f.id, <span class=\"s\">&quot;class&quot;</span>: f.cls, <span class=\"s\">&quot;voxel_count&quot;</span>: f.voxel_count,", "            <span class=\"s\">&quot;volume_mm3&quot;</span>: f.volume_mm3, <span class=\"s\">&quot;log10_volume_mm3&quot;</span>: math.log10(f.volume_mm3),", "            <span class=\"s\">&quot;eq_diameter_mm&quot;</span>: f.eq_diameter_mm, <span class=\"s\">&quot;surface_mm2&quot;</span>: f.surface_mm2,", "            <span class=\"s\">&quot;sphericity&quot;</span>: f.sphericity, <span class=\"s\">&quot;elongation&quot;</span>: f.elongation,", "            <span class=\"s\">&quot;centroid_x_mm&quot;</span>: f.centroid_mm[<span class=\"n\">0</span>], <span class=\"s\">&quot;centroid_y_mm&quot;</span>: f.centroid_mm[<span class=\"n\">1</span>], <span class=\"s\">&quot;centroid_z_mm&quot;</span>: f.centroid_mm[<span class=\"n\">2</span>],", "            <span class=\"s\">&quot;depth_mm&quot;</span>: f.depth_mm,", "            <span class=\"s\">&quot;bbox_min_x_mm&quot;</span>: f.bbox_min_mm[<span class=\"n\">0</span>], <span class=\"s\">&quot;bbox_min_y_mm&quot;</span>: f.bbox_min_mm[<span class=\"n\">1</span>], <span class=\"s\">&quot;bbox_min_z_mm&quot;</span>: f.bbox_min_mm[<span class=\"n\">2</span>],", "            <span class=\"s\">&quot;bbox_max_x_mm&quot;</span>: f.bbox_max_mm[<span class=\"n\">0</span>], <span class=\"s\">&quot;bbox_max_y_mm&quot;</span>: f.bbox_max_mm[<span class=\"n\">1</span>], <span class=\"s\">&quot;bbox_max_z_mm&quot;</span>: f.bbox_max_mm[<span class=\"n\">2</span>],", "            <span class=\"s\">&quot;mean_density_u8&quot;</span>: f.mean_density_u8, <span class=\"s\">&quot;material_bin&quot;</span>: f.material_bin, <span class=\"s\">&quot;gt_status&quot;</span>: f.gt_status,", "        })", "    <span class=\"k\">return</span> rows"]}, {"group": "1 Data (Python)", "path": "tools/pipeline.py", "title": "The whole pipeline", "what": "Runs every step in order and writes the 4 files Unity loads: volume_u8.raw, labels_u16.raw, features.csv, meta.json.", "qs": ["Walk us through the pipeline step by step.", "Why measure at full resolution and only then shrink?"], "points": [{"line": 52, "label": "_write_specimen()", "text": "Writes the 4 output files.", "end": 61}, {"line": 88, "label": "nist_crop()", "text": "The central 640-voxel cube (1.57 mm): the full scan does not fit in 16 GB RAM with all masks.", "end": 98}, {"line": 101, "label": "build_nist()", "text": "Dataset A: crop, median filter, ISO50, pores, features, ground truth, downsample, write.", "end": 181}, {"line": 240, "label": "build_enigma()", "text": "Dataset B: DICOM, multi-threshold parts, features, write.", "end": 315}], "code": ["<span class=\"s\">&quot;&quot;</span>&quot;Build a processed specimen (volume, labels, features, meta) <span class=\"k\">from</span> raw CT data.", "", "Order of operations matters <span class=\"k\">and</span> <span class=\"k\">is</span> the same <span class=\"k\">for</span> both specimens:", "", "<span class=\"n\">1</span>. load at full resolution", "<span class=\"n\">2</span>. segment <span class=\"k\">and</span> measure at full resolution (small pores only exist here)", "<span class=\"n\">3</span>. crop to the object, window to <span class=\"n\">8</span> bit", "<span class=\"n\">4</span>. downsample intensities by area-mean <span class=\"k\">and</span> labels by max-pool to &lt;= <span class=\"n\">256</span> voxels per axis", "<span class=\"n\">5</span>. write ``volume_u8.raw``, ``labels_u16.raw``, ``features.csv``, ``meta.json``", "", "Usage::", "", "    python pipeline.py nist --sample set1sample4", "    python pipeline.py enigma", "<span class=\"s\">&quot;&quot;</span>&quot;", "<span class=\"k\">from</span> __future__ <span class=\"k\">import</span> annotations", "", "<span class=\"k\">import</span> argparse", "<span class=\"k\">import</span> csv", "<span class=\"k\">import</span> gc", "<span class=\"k\">import</span> logging", "<span class=\"k\">import</span> math", "<span class=\"k\">from</span> pathlib <span class=\"k\">import</span> Path", "", "<span class=\"k\">import</span> numpy <span class=\"k\">as</span> np", "<span class=\"k\">from</span> scipy <span class=\"k\">import</span> ndimage", "<span class=\"k\">from</span> skimage.filters <span class=\"k\">import</span> threshold_multiotsu", "", "<span class=\"k\">import</span> features <span class=\"k\">as</span> feat", "<span class=\"k\">import</span> preprocess <span class=\"k\">as</span> pre", "<span class=\"k\">import</span> segment <span class=\"k\">as</span> seg", "<span class=\"k\">from</span> common <span class=\"k\">import</span> (", "    CLASS_COLORS, DATA_RAW, FEATURE_COLUMNS, FEATURES_FILE, LABEL_FILE, META_FILE, META_SCHEMA_VERSION,", "    MIN_COMPONENT_VOXELS, SPECIMEN_OUT, TARGET_LONGEST_AXIS_VOXELS, VOLUME_FILE, write_meta, write_raw,", ")", "", "LOG = logging.getLogger(<span class=\"s\">&quot;pipeline&quot;</span>)", "", "DEPTH_MAP_FACTOR = <span class=\"n\">4</span>  <span class=\"c\"># EDT runs on a 4x decimated mask (see features.depth_map_mm)</span>", "<span class=\"c\"># Specimens are shown at a comfortable hand-held size; the label always shows the true</span>", "<span class=\"c\"># magnification relative to the physical object, so nothing about scale is hidden.</span>", "DEFAULT_DISPLAY_SIZE_M = <span class=\"n\">0.25</span>", "NIST_CROP_VOXELS = <span class=\"n\">640</span>", "NIST_MEDIAN_SIZE = <span class=\"n\">3</span>", "<span class=\"c\"># Field-of-view centre (x, y) in pixels, NIST README Table 3 &quot;X/Y coordinate&quot;.</span>", "NIST_FOV_CENTER_XY = {<span class=\"s\">&quot;set1sample2&quot;</span>: (<span class=\"n\">491</span>, <span class=\"n\">506</span>), <span class=\"s\">&quot;set1sample3&quot;</span>: (<span class=\"n\">496</span>, <span class=\"n\">507</span>), <span class=\"s\">&quot;set1sample4&quot;</span>: (<span class=\"n\">492</span>, <span class=\"n\">506</span>),", "                      <span class=\"s\">&quot;set1sample5&quot;</span>: (<span class=\"n\">494</span>, <span class=\"n\">506</span>), <span class=\"s\">&quot;set1sample6&quot;</span>: (<span class=\"n\">492</span>, <span class=\"n\">507</span>)}", "ENIGMA_MATERIAL_BINS = <span class=\"n\">4</span>  <span class=\"c\"># air + three attenuation bins (multi-Otsu)</span>", "ENIGMA_MIN_COMPONENT_VOXELS = <span class=\"n\">64</span>  <span class=\"c\"># ~0.38 mm\u00b3 at 0.181 mm; below that, parts are scan noise</span>", "", "", "<span class=\"k\">def</span> _write_specimen(out_dir: Path, vol_u8: np.ndarray, labels: np.ndarray, rows: list[dict], meta: dict) -&gt; <span class=\"k\">None</span>:", "    write_raw(out_dir / VOLUME_FILE, vol_u8)", "    write_raw(out_dir / LABEL_FILE, labels.astype(np.uint16))", "    <span class=\"k\">with</span> (out_dir / FEATURES_FILE).open(<span class=\"s\">&quot;w&quot;</span>, newline=<span class=\"s\">&quot;&quot;</span>, encoding=<span class=\"s\">&quot;utf-8&quot;</span>) <span class=\"k\">as</span> fh:", "        w = csv.DictWriter(fh, fieldnames=FEATURE_COLUMNS)", "        w.writeheader()", "        <span class=\"k\">for</span> r <span class=\"k\">in</span> rows:", "            w.writerow({k: (f<span class=\"s\">&quot;{v:.6g}&quot;</span> <span class=\"k\">if</span> isinstance(v, <span class=\"k\">float</span>) <span class=\"k\">else</span> v) <span class=\"k\">for</span> k, v <span class=\"k\">in</span> r.items()})", "    write_meta(out_dir / META_FILE, meta)", "    LOG.info(<span class=\"s\">&quot;wrote specimen to %s&quot;</span>, out_dir)", "", "", "<span class=\"k\">def</span> _display_block(dims_xyz: list[<span class=\"k\">int</span>], spacing_ds: list[<span class=\"k\">float</span>]) -&gt; dict:", "    extent_m = max(d * s <span class=\"k\">for</span> d, s <span class=\"k\">in</span> zip(dims_xyz, spacing_ds)) / <span class=\"n\">1000.0</span>", "    default_scale = DEFAULT_DISPLAY_SIZE_M / extent_m", "    <span class=\"k\">return</span> {", "        <span class=\"s\">&quot;physical_extent_m&quot;</span>: extent_m,", "        <span class=\"s\">&quot;default_scale&quot;</span>: default_scale,", "        <span class=\"c\"># Grab/scale gesture range: from half the default up to 20x the default.</span>", "        <span class=\"s\">&quot;min_scale&quot;</span>: max(<span class=\"n\">1.0</span>, default_scale * <span class=\"n\">0.5</span>),", "        <span class=\"s\">&quot;max_scale&quot;</span>: default_scale * <span class=\"n\">20.0</span>,", "    }", "", "", "<span class=\"k\">def</span> _crop_downsample(vol_u8, labels, filled, spacing_zyx):", "    bbox = pre.object_bbox(filled)", "    vol_u8, labels = vol_u8[bbox], labels[bbox]", "    f = pre.downsample_factor(vol_u8.shape, TARGET_LONGEST_AXIS_VOXELS)", "    vol_ds = pre.downsample_mean(vol_u8, f)", "    lab_ds = pre.downsample_max(labels, f)", "    offset_mm = [bbox[<span class=\"n\">2</span>].start * spacing_zyx[<span class=\"n\">2</span>], bbox[<span class=\"n\">1</span>].start * spacing_zyx[<span class=\"n\">1</span>], bbox[<span class=\"n\">0</span>].start * spacing_zyx[<span class=\"n\">0</span>]]", "    <span class=\"k\">return</span> vol_ds, lab_ds, f, offset_mm", "", "", "<span class=\"c\"># --------------------------------------------------------------------------- specimen A</span>", "", "<span class=\"k\">def</span> nist_crop(sample: str, n_slices: <span class=\"k\">int</span> = <span class=\"n\">900</span>) -&gt; tuple[slice, slice, slice]:", "    <span class=\"s\">&quot;&quot;</span>&quot;Central NIST_CROP_VOXELS\u00b3 cube around the field-of-view centre (README Table <span class=\"n\">3</span>).", "", "    Why a crop: the full ~<span class=\"n\">900</span> M-voxel stack plus masks <span class=\"k\">and</span> labels does <span class=\"k\">not</span> fit <span class=\"k\">in</span> <span class=\"n\">16</span> GB RAM", "    at full resolution, <span class=\"k\">and</span> the prompt requires segmenting at full resolution. The cube", "    lies entirely inside the circular FOV (inscribed square side = <span class=\"n\">964</span>/\u221a<span class=\"n\">2</span> \u2248 <span class=\"n\">681</span> px).", "    <span class=\"s\">&quot;&quot;</span>&quot;", "    cx, cy = NIST_FOV_CENTER_XY[sample]", "    h = NIST_CROP_VOXELS // 2", "    z0 = (n_slices - NIST_CROP_VOXELS) // 2", "    <span class=\"k\">return</span> slice(z0, z0 + NIST_CROP_VOXELS), slice(cy - h, cy + h), slice(cx - h, cx + h)", "", "", "<span class=\"k\">def</span> build_nist(sample: str) -&gt; Path:", "    raw_zip = DATA_RAW / <span class=\"s\">&quot;nist&quot;</span> / f<span class=\"s\">&quot;{sample}raw.zip&quot;</span>", "    gt_dir = DATA_RAW / <span class=\"s\">&quot;nist&quot;</span> / f<span class=\"s\">&quot;seg{sample[-1]}&quot;</span>", "    voxel_um = {<span class=\"s\">&quot;set1sample2&quot;</span>: <span class=\"n\">2.45</span>, <span class=\"s\">&quot;set1sample3&quot;</span>: <span class=\"n\">2.77</span>, <span class=\"s\">&quot;set1sample4&quot;</span>: <span class=\"n\">2.43</span>,", "                <span class=\"s\">&quot;set1sample5&quot;</span>: <span class=\"n\">2.52</span>, <span class=\"s\">&quot;set1sample6&quot;</span>: <span class=\"n\">2.77</span>}[sample]  <span class=\"c\"># NIST README, Table 1</span>", "    s = voxel_um / <span class=\"n\">1000.0</span>", "    spacing = (s, s, s)", "    n_slices = <span class=\"n\">750</span> <span class=\"k\">if</span> sample == <span class=\"s\">&quot;set1sample5&quot;</span> <span class=\"k\">else</span> <span class=\"n\">900</span>  <span class=\"c\"># NIST README, Table 1</span>", "    crop = nist_crop(sample, n_slices)", "    LOG.info(<span class=\"s\">&quot;full-resolution crop (z, y, x): %s&quot;</span>, crop)", "", "    vol = pre.load_tiff_stack_from_zip(raw_zip, crop=crop)", "    <span class=\"c\"># Raw XCT noise makes thresholding produce ~10^5 one-voxel &quot;pores&quot;. NIST&#x27;s own reference</span>", "    <span class=\"c\"># segmentation used a 3D median filter first (README); we do the same. A median keeps</span>", "    <span class=\"c\"># pore edges sharp, unlike a Gaussian, which would shrink small pores.</span>", "    vol = ndimage.median_filter(vol, size=NIST_MEDIAN_SIZE)", "    LOG.info(<span class=\"s\">&quot;applied %d^3 median filter&quot;</span>, NIST_MEDIAN_SIZE)", "    <span class=\"c\"># The reconstruction is only valid inside the circular field of view; outside it the</span>", "    <span class=\"c\"># values are zero. Thresholds and windows are computed on in-FOV voxels only.</span>", "    fov = vol &gt; <span class=\"n\">0</span>", "    thr, air_value, material_value = pre.iso50_threshold(vol)", "    LOG.info(<span class=\"s\">&quot;ISO50 threshold %.1f (air %.1f, material %.1f)&quot;</span>, thr, air_value, material_value)", "    material = vol &gt; thr", "    pores, filled = seg.enclosed_air(material)", "    del material", "    gc.collect()", "    low, high = pre.window_from_percentiles(vol, filled)", "    vol_u8 = pre.to_u8(vol, low, high)", "    del vol, fov", "    gc.collect()", "", "    labels, n_pred = seg.label_components(pores)", "    del pores", "    gc.collect()", "    depth = feat.depth_map_mm(filled, spacing, DEPTH_MAP_FACTOR)", "    defects = feat.compute_features(labels, vol_u8, spacing, depth, DEPTH_MAP_FACTOR)", "", "    <span class=\"c\"># Ground truth: NIST reference segmentation, pores defined exactly like ours.</span>", "    gt_material = pre.load_tiff_stack(gt_dir, dtype=np.uint8, crop=crop) == <span class=\"n\">255</span>", "    gt_pores, _ = seg.enclosed_air(gt_material)", "    del gt_material", "    gc.collect()", "    gt_labels, n_gt = seg.label_components(gt_pores)", "    del gt_pores", "    gc.collect()", "    gt = feat.compare_to_ground_truth(labels, gt_labels, n_gt)", "    <span class=\"k\">for</span> d <span class=\"k\">in</span> defects:", "        d.gt_status = <span class=\"s\">&quot;TP&quot;</span> <span class=\"k\">if</span> d.id <span class=\"k\">in</span> gt.tp_pred_ids <span class=\"k\">else</span> <span class=\"s\">&quot;FP&quot;</span>", "", "    <span class=\"c\"># Missed reference pores become extra labels so the shader can show them in GT mode.</span>", "    missed = [i <span class=\"k\">for</span> i <span class=\"k\">in</span> range(<span class=\"n\">1</span>, n_gt + <span class=\"n\">1</span>) <span class=\"k\">if</span> i <span class=\"k\">not</span> <span class=\"k\">in</span> gt.matched_gt_ids]", "    <span class=\"k\">if</span> missed:", "        lut = np.zeros(n_gt + <span class=\"n\">1</span>, dtype=np.uint16)", "        lut[missed] = np.arange(n_pred + <span class=\"n\">1</span>, n_pred + <span class=\"n\">1</span> + len(missed), dtype=np.uint16)", "        fn_labels = lut[gt_labels]", "        free = (labels == <span class=\"n\">0</span>) &amp; (fn_labels &gt; <span class=\"n\">0</span>)", "        fn_only = np.zeros_like(labels)", "        fn_only[free] = fn_labels[free]", "        labels[free] = fn_labels[free]", "        fn_feats = feat.compute_features(fn_only, vol_u8, spacing, depth, DEPTH_MAP_FACTOR)", "        <span class=\"k\">for</span> d <span class=\"k\">in</span> fn_feats:", "            d.gt_status = <span class=\"s\">&quot;FN&quot;</span>", "        defects.extend(fn_feats)", "        del fn_labels, fn_only, free", "    del gt_labels, depth", "    gc.collect()", "", "    vol_ds, lab_ds, f, offset_mm = _crop_downsample(vol_u8, labels, filled, spacing)", "    <span class=\"k\">for</span> d <span class=\"k\">in</span> defects:  <span class=\"c\"># express positions relative to the cropped volume origin</span>", "        d.centroid_mm = tuple(c - o <span class=\"k\">for</span> c, o <span class=\"k\">in</span> zip(d.centroid_mm, offset_mm))", "        d.bbox_min_mm = tuple(c - o <span class=\"k\">for</span> c, o <span class=\"k\">in</span> zip(d.bbox_min_mm, offset_mm))", "        d.bbox_max_mm = tuple(c - o <span class=\"k\">for</span> c, o <span class=\"k\">in</span> zip(d.bbox_max_mm, offset_mm))", "    dims = [vol_ds.shape[<span class=\"n\">2</span>], vol_ds.shape[<span class=\"n\">1</span>], vol_ds.shape[<span class=\"n\">0</span>]]", "    spacing_ds = [s * f] * <span class=\"n\">3</span>", "    thr_u8 = <span class=\"k\">int</span>(np.clip((thr - low) * <span class=\"n\">255.0</span> / (high - low), <span class=\"n\">0</span>, <span class=\"n\">255</span>))", "", "    meta = {", "        <span class=\"s\">&quot;schema_version&quot;</span>: META_SCHEMA_VERSION,", "        <span class=\"s\">&quot;id&quot;</span>: f<span class=\"s\">&quot;nist_{sample}&quot;</span>,", "        <span class=\"s\">&quot;name&quot;</span>: f<span class=\"s\">&quot;CoCr L-PBF sample, central {NIST_CROP_VOXELS * s:.2f} mm cube ({sample}, NIST)&quot;</span>,", "        <span class=\"s\">&quot;dims&quot;</span>: dims,", "        <span class=\"s\">&quot;spacing_mm&quot;</span>: spacing_ds,", "        <span class=\"s\">&quot;volume_file&quot;</span>: VOLUME_FILE, <span class=\"s\">&quot;label_file&quot;</span>: LABEL_FILE, <span class=\"s\">&quot;features_file&quot;</span>: FEATURES_FILE,", "        <span class=\"s\">&quot;value_range&quot;</span>: {<span class=\"s\">&quot;raw_low&quot;</span>: low, <span class=\"s\">&quot;raw_high&quot;</span>: high, <span class=\"s\">&quot;unit&quot;</span>: <span class=\"s\">&quot;XCT grey value (16-bit, uncalibrated)&quot;</span>},", "        <span class=\"s\">&quot;window&quot;</span>: {<span class=\"s\">&quot;level&quot;</span>: <span class=\"n\">0.5</span>, <span class=\"s\">&quot;width&quot;</span>: <span class=\"n\">1.0</span>},", "        <span class=\"s\">&quot;materials&quot;</span>: [", "            {<span class=\"s\">&quot;name&quot;</span>: <span class=\"s\">&quot;air / pore&quot;</span>, <span class=\"s\">&quot;u8_min&quot;</span>: <span class=\"n\">0</span>, <span class=\"s\">&quot;u8_max&quot;</span>: thr_u8, <span class=\"s\">&quot;color&quot;</span>: <span class=\"s\">&quot;#1A2230&quot;</span>},", "            {<span class=\"s\">&quot;name&quot;</span>: <span class=\"s\">&quot;CoCr alloy&quot;</span>, <span class=\"s\">&quot;u8_min&quot;</span>: thr_u8 + <span class=\"n\">1</span>, <span class=\"s\">&quot;u8_max&quot;</span>: <span class=\"n\">255</span>, <span class=\"s\">&quot;color&quot;</span>: <span class=\"s\">&quot;#B8C4CF&quot;</span>},", "        ],", "        <span class=\"s\">&quot;defect_count&quot;</span>: len(defects),", "        <span class=\"s\">&quot;defect_classes&quot;</span>: CLASS_COLORS,", "        <span class=\"s\">&quot;chart_axes&quot;</span>: [", "            {<span class=\"s\">&quot;column&quot;</span>: <span class=\"s\">&quot;log10_volume_mm3&quot;</span>, <span class=\"s\">&quot;label&quot;</span>: <span class=\"s\">&quot;log10 pore volume (mm\u00b3)&quot;</span>},", "            {<span class=\"s\">&quot;column&quot;</span>: <span class=\"s\">&quot;sphericity&quot;</span>, <span class=\"s\">&quot;label&quot;</span>: <span class=\"s\">&quot;sphericity&quot;</span>},", "            <span class=\"c\"># Interior scan: there is no outer part surface in the data, so &quot;depth below</span>", "            <span class=\"c\"># surface&quot; is undefined. Build height (z = build direction, NIST README) is the</span>", "            <span class=\"c\"># physically meaningful third axis for L-PBF defects (layer-dependent porosity).</span>", "            {<span class=\"s\">&quot;column&quot;</span>: <span class=\"s\">&quot;centroid_z_mm&quot;</span>, <span class=\"s\">&quot;label&quot;</span>: <span class=\"s\">&quot;build height in crop (mm)&quot;</span>},", "        ],", "        <span class=\"s\">&quot;ground_truth&quot;</span>: {", "            <span class=\"s\">&quot;precision&quot;</span>: gt.precision, <span class=\"s\">&quot;recall&quot;</span>: gt.recall, <span class=\"s\">&quot;iou&quot;</span>: gt.iou,", "            <span class=\"s\">&quot;reference_count&quot;</span>: n_gt, <span class=\"s\">&quot;predicted_count&quot;</span>: n_pred, <span class=\"s\">&quot;missed_count&quot;</span>: len(missed),", "            <span class=\"s\">&quot;match_rule&quot;</span>: <span class=\"s\">&quot;object TP if it shares &gt;= 1 voxel with a reference pore; IoU over all pore voxels&quot;</span>,", "        },", "        <span class=\"s\">&quot;display&quot;</span>: _display_block(dims, spacing_ds),", "        <span class=\"s\">&quot;source&quot;</span>: {", "            <span class=\"s\">&quot;title&quot;</span>: <span class=\"s\">&quot;High-Resolution X-ray computed tomography (XCT) image data set of additively manufactured &quot;</span>", "                     <span class=\"s\">&quot;cobalt chrome samples produced with varying laser powder bed fusion processing parameters&quot;</span>,", " e_rule&quot;</span>: <span class=\"s\">&quot;air enclosed by material (3D hole filling), 26-connected&quot;</span>,", "            <span class=\"s\">&quot;min_component_voxels&quot;</span>: MIN_COMPONENT_VOXELS,", "            <span class=\"s\">&quot;downsample_factor&quot;</span>: f,", "            <span class=\"s\">&quot;intensity_downsample&quot;</span>: <span class=\"s\">&quot;area mean&quot;</span>, <span class=\"s\">&quot;label_downsample&quot;</span>: <span class=\"s\">&quot;max pool&quot;</span>,", "            <span class=\"s\">&quot;depth_note&quot;</span>: <span class=\"s\">&quot;interior (local) tomography + central crop: depth_mm is distance to the crop &quot;</span>", "                          <span class=\"s\">&quot;boundary, not to the part surface, so it is not charted&quot;</span>,", "            <span class=\"s\">&quot;cut_pores&quot;</span>: <span class=\"s\">&quot;pores touching the crop boundary are not enclosed and are excluded&quot;</span>,", "        },", "    }", "    <span class=\"k\">out</span> = SPECIMEN_OUT / meta[<span class=\"s\">&quot;id&quot;</span>]", "    _write_specimen(<span class=\"k\">out</span>, vol_ds, lab_ds, feat.features_to_rows(defects), meta)", "    <span class=\"k\">return</span> <span class=\"k\">out</span>", "", "", "<span class=\"c\"># --------------------------------------------------------------------------- specimen B</span>", "", "<span class=\"k\">def</span> build_enigma() -&gt; Path:", "    vol, (sx, sy, sz) = pre.load_dicom(DATA_RAW / <span class=\"s\">&quot;enigma&quot;</span> / <span class=\"s\">&quot;rotors&quot;</span>)", "    spacing = (sz, sy, sx)", "    thr_air = pre.otsu_threshold(vol)", "    filled = vol &gt; thr_air", "    low, high = pre.window_from_percentiles(vol, filled)", "    vol_u8 = pre.to_u8(vol, low, high)", "    del vol", "    gc.collect()", "", "    sample = vol_u8[::<span class=\"n\">2</span>, ::<span class=\"n\">2</span>, ::<span class=\"n\">2</span>]", "    thresholds = [<span class= </span>, <span class=\"s\">&quot;#B8C4CF&quot;</span>, <span class=\"s\">&quot;#E0A64A&quot;</span>]", "", "    meta = {", "        <span class=\"s\">&quot;schema_version&quot;</span>: META_SCHEMA_VERSION,", "        <span class=\"s\">&quot;id&quot;</span>: <span class=\"s\">&quot;enigma_1993_522_rotors&quot;</span>,", "        <span class=\"s\">&quot;name&quot;</span>: <span class=\"s\">&quot;Enigma I rotors (Deutsches Museum Inv. 1993-522)&quot;</span>,", "        <span class=\"s\">&quot;dims&quot;</span>: dims,", "        <span class=\"s\">&quot;spacing_mm&quot;</span>: spacing_ds,", "        <span class=\"s\">&quot;volume_file&quot;</span>: VOLUME_FILE, <span class=\"s\">&quot;label_file&quot;</span>: LABEL_FILE, <span class=\"s\">&quot;features_file&quot;</span>: FEATURES_FILE,", "        <span class=\"s\">&quot;value_range&quot;</span>: {<span class=\"s\">&quot;raw_low&quot;</span>: low, <span class=\"s\">&quot;raw_high&quot;</span>: high, <span class=\"s\">&quot;unit&quot;</span>: <span class=\"s\">&quot;CT grey value (16-bit, uncalibrated)&quot;</span>},", "        <span class=\"s\">&quot;window&quot;</span>: {<span class=\"s\">&quot;level&quot;</span>: <span class=\"n\">0.5</span>, <span class=\"s\">&quot;width&quot;</span>: <span class=\"n\">1.0</span>},", "        <span class=\"c\"># Bins are named by attenuation, not by material: we cannot verify which alloy or</span>", "        <span class=\"c\"># polymer each part is made of from grey values alone.</span>", "        <span class=\"s\">&quot;materials&quot;</span>: [", "            {<span class=\"s\">&quot;name&quot;</span>: bin_names[i], <span class=\"s\">&quot;u8_min&quot;</span>: edges[i] + (<span class=\"n\">1</span> <span class=\"k\">if</span> i <span class=\"k\">else</span> <span class=\"n\">0</span>), <span class=\"s\">&quot;u8_max&quot;</span>: edges[i + <span class=\"n\">1</span>], <span class=\"s\">&quot;color&quot;</span>: bin_colors[i]}", "            <span class=\"k\">for</span> i <span clas
