ummary&gt;Folder inside StreamingAssets that holds all specimens.&lt;/summary&gt;</span>", "        <span class=\"k\">public</span> <span class=\"k\">const</span> <span class=\"k\">string</span> SpecimensFolder = <span class=\"s\">&quot;Specimens&quot;</span>;", "", "        <span class=\"c\">/// &lt;summary&gt;URL-or-path of a file inside a specimen folder.&lt;/summary&gt;</span>", "        <span class=\"k\">public</span> <span class=\"k\">static</span> <span class=\"k\">string</span> SpecimenFilePath(<span class=\"k\">string</span> specimenId, <span class=\"k\">string</span> fileName) =&gt;", "            Path.Combine(Application.streamingAssetsPath, SpecimensFolder, specimenId, fileName).Replace(&#x27;\\\\&#x27;, &#x27;/&#x27;);", "", "        <span class=\"c\">/// &lt;summary&gt;</span>", "        <span class=\"c\">/// Coroutine: loads meta, features, volume and labels, then creates the GPU textures.</span>", "        <span class=\"c\">/// Calls exactly one of &lt;paramref name=&quot;onLoaded&quot;/&gt; or &lt;paramref name=&quot;onError&quot;/&gt;.</span>", "        <span class=\"c\">/// &lt;/summary&gt;</span>", "        <span class=\"k\">public</span> <span class=\"k\">static</span> IEnumerator Load(<span class=\"k\">string</span> specimenId, Action&lt;VolumeDataset&gt; onLoaded, Action&lt;<span class=\"k\">string</span>&gt; onError)", "        {", "            <span class=\"k\">string</span> metaText = <span class=\"k\">null</span>, csvText = <span class=\"k\">null</span>;", "            byte[] volume = <span class=\"k\">null</span>, labelBytes = <span class=\"k\">null</span>;", "            <span class=\"k\">string</span> error = <span class=\"k\">null</span>;", "", "            <span class=\"k\">yield</span> <span class=\"k\">return</span> Fetch(SpecimenFilePath(specimenId, <span class=\"s\">&quot;meta.json&quot;</span>), r =&gt; metaText = r.downloadHandler.text, e =&gt; error = e);", "            <span class=\"k\">if</span> (error != <span class=\"k\">null</span>) { onError(error); <span class=\"k\">yield</span> <span class=\"k\">break</span>; }", "", "            SpecimenMeta meta;", "            <span class=\"k\">try</span> { meta = SpecimenMeta.Parse(metaText); }", "            <span class=\"k\">catch</span> (FormatException ex) { onError($<span class=\"s\">&quot;{specimenId}: {ex.Message}&quot;</span>); <span class=\"k\">yield</span> <span class=\"k\">break</span>; }", "", "            <span class=\"k\">yield</span> <span class=\"k\">return</span> Fetch(SpecimenFilePath(specimenId, meta.features_file), r =&gt; csvText = r.downloadHandler.text, e =&gt; error = e);", "            <span class=\"k\">if</span> (error == <span class=\"k\">null</span>) <span class=\"k\">yield</span> <span class=\"k\">return</span> Fetch(SpecimenFilePath(specimenId, meta.volume_file), r =&gt; volume = r.downloadHandler.data, e =&gt; error = e);", "            <span class=\"k\">if</span> (error == <span class=\"k\">null</span>) <span class=\"k\">yield</span> <span class=\"k\">return</span> Fetch(SpecimenFilePath(specimenId, meta.label_file), r =&gt; labelBytes = r.downloadHandler.data, e =&gt; error = e);", "            <span class=\"k\">if</span> (error != <span class=\"k\">null</span>) { onError(error); <span class=\"k\">yield</span> <span class=\"k\">break</span>; }", "", "            VolumeDataset dataset;", "            <span class=\"k\">try</span>", "            {", "                FeatureCatalog catalog = FeatureCatalog.Parse(csvText);", "                dataset = <span class=\"k\">new</span> VolumeDataset(meta, catalog, volume, DecodeLabels(labelBytes));", "                dataset.CreateTextures();", "            }", "            <span class=\"k\">catch</span> (Exception ex) when (ex <span class=\"k\">is</span> FormatException || ex <span class=\"k\">is</span> ArgumentException)", "            {", "                onError($<span class=\"s\">&quot;{specimenId}: {ex.Message}&quot;</span>);", "                <span class=\"k\">yield</span> <span class=\"k\">break</span>;", "            }", "            onLoaded(dataset);", "        }", "", "        <span class=\"c\">/// &lt;summary&gt;Little-endian uint16 bytes \u2192 ushort array.&lt;/summary&gt;</span>", "        <span class=\"k\">public</span> <span class=\"k\">static</span> ushort[] DecodeLabels(byte[] bytes)", "        {", "            <span class=\"k\">if</span> (bytes.Length % <span class=\"n\">2</span> != <span class=\"n\">0</span>) <span class=\"k\">throw</span> <span class=\"k\">new</span> FormatException(<span class=\"s\">&quot;label file has an odd byte count&quot;</span>);", "            <span class=\"k\">var</span> labels = <span class=\"k\">new</span> ushort[bytes.Length / <span class=\"n\">2</span>];", "            Buffer.BlockCopy(bytes, <span class=\"n\">0</span>, labels, <span class=\"n\">0</span>, bytes.Length); <span class=\"c\">// all Unity targets are little-endian</span>", "            <span class=\"k\">return</span> labels;", "        }", "", "        <span class=\"k\">private</span> <span class=\"k\">static</span> IEnumerator Fetch(<span class=\"k\">string</span> path, Action&lt;UnityWebRequest&gt; onOk, Action&lt;<span class=\"k\">string</span>&gt; onError)", "        {", "            <span class=\"c\">// In the editor and on PC the path is a plain file path; UnityWebRequest needs a URI.</span>", "            <span class=\"k\">string</span> uri = path.Contains(<span class=\"s\">&quot;://&quot;</span>) ? path : <span class=\"k\">new</span> Uri(path).AbsoluteUri;", "            <span class=\"k\">using</span> (UnityWebRequest req = UnityWebRequest.Get(uri))", "            {", "                <span class=\"k\">yield</span> <span class=\"k\">return</span> req.SendWebRequest();", "                <span class=\"k\">if</span> (req.result != UnityWebRequest.Result.Success) onError($<span class=\"s\">&quot;could not load {path}: {req.error}&quot;</span>);", "                <span class=\"k\">else</span> onOk(req);", "            }", "        }", "    }", "}"]}, {"group": "2 Loading & rendering", "path": "Assets/XRayHands/Rendering/Shaders/XRayVolume.shader", "title": "The volume shader (ray marching)", "what": "Draws the CT scan as a see-through 3D object. All the visual tools (cut, peel, lens, pore colours) happen here on the GPU.", "qs": ["Explain ray marching.", "How did you make it fast enough for a mobile GPU?", "How does the cut show a real slice?"], "points": [{"line": 121, "label": "IntersectBox()", "text": "Where the eye ray enters and leaves the cube.", "end": 129}, {"line": 166, "label": "Peel rim term", "text": "When peeled, metal is ~2 % opaque, but edges stay visible: (1-|n.v|)^3. That is why it looks like glass.", "end": 171}, {"line": 173, "label": "Frag(): one pixel", "text": "The main function, run for every pixel.", "end": 253}, {"line": 192, "label": "Cut plane", "text": "The ray starts where it crosses the plane. If the first sample is metal, we show the real grey value: the CT slice.", "end": 206}, {"line": 230, "label": "X-ray lens", "text": "If this pixel's ray goes through the finger ring, use the lens peel for the whole ray.", "end": 239}, {"line": 243, "label": "Jitter + opacity correction", "text": "Each ray starts at a slightly different offset (removes stripes). Opacity is corrected for the step count, so quality tiers look alike.", "end": 245}, {"line": 275, "label": "Empty-space skipping", "text": "8x8x8 bricks store min/max. If nothing in a brick can be visible, jump straight over it.", "end": 287}, {"line": 310, "label": "Early ray termination", "text": "Stop at 97 % opacity: nothing behind can be seen.", "end": 312}], "code": ["<span class=\"c\">// X-Ray Hands volume ray marcher (URP, single-pass-instanced stereo safe).</span>", "<span class=\"c\">//</span>", "<span class=\"c\">// Geometry: a unit cube [-0.5, 0.5]^3 in object space, drawn with front faces culled so the</span>", "<span class=\"c\">// volume still renders when the camera is inside it. For each pixel we build the ray from the</span>", "<span class=\"c\">// eye (per eye, in object space), intersect it with the box, the clip plane and the opaque</span>", "<span class=\"c\">// scene depth, then composite front to back.</span>", "<span class=\"c\">//</span>", "<span class=\"c\">// Texture layout (see VolumeDataset):</span>", "<span class=\"c\">//   _DensityTex  RGBA8: rgb = gradient packed to [0,1], a = density      (trilinear)</span>", "<span class=\"c\">//   _LabelTex    RG8:   label id = r + 256 g                              (point)</span>", "<span class=\"c\">//   _BrickTex    RG8:   min / max density per 8^3 brick                   (point)</span>", "<span class=\"c\">//   _TransferTex 256x1: rgba transfer function by density</span>", "<span class=\"c\">//   _IdLut       256xN: per-id display colour (rgb) and opacity (a), computed on the CPU</span>", "<span class=\"c\">//                       from class / ground truth / selection, so all mode logic is C#.</span>", "Shader <span class=\"s\">&quot;XRayHands/XRayVolume&quot;</span>", "{", "    Properties", "    {", "        _DensityTex (<span class=\"s\">&quot;Density + gradient&quot;</span>, 3D) = <span class=\"s\">&quot;&quot;</span> {}", "        _LabelTex (<span class=\"s\">&quot;Labels&quot;</span>, 3D) = <span class=\"s\">&quot;&quot;</span> {}", "        _BrickTex (<span class=\"s\">&quot;Brick min/max&quot;</span>, 3D) = <span class=\"s\">&quot;&quot;</span> {}", "        _TransferTex (<span class=\"s\">&quot;Transfer function&quot;</span>, 2D) = <span class=\"s\">&quot;white&quot;</span> {}", "        _IdLut (<span class=\"s\">&quot;Per-id colours&quot;</span>, 2D) = <span class=\"s\">&quot;black&quot;</span> {}", "        _StepCount (<span class=\"s\">&quot;Max steps along the diagonal&quot;</span>, Range(<span class=\"n\">16</span>, <span class=\"n\">512</span>)) = <span class=\"n\">160</span>", "        _Peel (<span class=\"s\">&quot;Peel threshold (0..1 density)&quot;</span>, Range(<span class=\"n\">0</span>, <span class=\"n\">1</span>)) = <span class=\"n\">0</span>", "        _SilhouetteStrength (<span class=\"s\">&quot;Glass silhouette strength&quot;</span>, Range(<span class=\"n\">0</span>, <span class=\"n\">4</span>)) = <span class=\"n\">1.5</span>", "        _GradientWeight (<span class=\"s\">&quot;Gradient-magnitude weighting&quot;</span>, Range(<span class=\"n\">0</span>, <span class=\"n\">1</span>)) = <span class=\"n\">0.6</span>", "        _WindowLevel (<span class=\"s\">&quot;Slice window level&quot;</span>, Range(<span class=\"n\">0</span>, <span class=\"n\">1</span>)) = <span class=\"n\">0.5</span>", "        _WindowWidth (<span class=\"s\">&quot;Slice window width&quot;</span>, Range(<span class=\"n\">0.01</span>, <span class=\"n\">1</span>)) = <span class=\"n\">1</span>", "        _DefectGlow (<span class=\"s\">&quot;Defect glow&quot;</span>, Range(<span class=\"n\">0</span>, <span class=\"n\">4</span>)) = <span class=\"n\">1.5</span>", "        _ClipPlane (<span class=\"s\">&quot;Clip plane (object space n.xyz, d)&quot;</span>, Vector) = (<span class=\"n\">0</span>, <span class=\"n\">0</span>, <span class=\"n\">1</span>, <span class=\"n\">10</span>)", "        _ClipEnabled (<span class=\"s\">&quot;Clip enabled&quot;</span>, Float) = <span class=\"n\">0</span>", "        _LensCentreWS (<span class=\"s\">&quot;Lens centre (world)&quot;</span>, Vector) = (<span class=\"n\">0</span>, <span class=\"n\">0</span>, <span class=\"n\">0</span>, <span class=\"n\">0</span>)", "        _LensNormalWS (<span class=\"s\">&quot;Lens normal (world)&quot;</span>, Vector) = (<span class=\"n\">0</span>, <span class=\"n\">0</span>, <span class=\"n\">1</span>, <span class=\"n\">0</span>)", "        _LensRadius (<span class=\"s\">&quot;Lens radius (m)&quot;</span>, Float) = <span class=\"n\">0</span>", "        _LensPeel (<span class=\"s\">&quot;Peel inside the lens&quot;</span>, Range(<span class=\"n\">0</span>, <span class=\"n\">1</span>)) = <span class=\"n\">0.6</span>", "        _IdLutSize (<span class=\"s\">&quot;Id LUT size (w, h, 1/w, 1/h)&quot;</span>, Vector) = (<span class=\"n\">256</span>, <span class=\"n\">1</span>, <span class=\"n\">0.00390625</span>, <span class=\"n\">1</span>)", "        _BrickGrid (<span class=\"s\">&quot;Brick grid dims (x, y, z, brick voxels)&quot;</span>, Vector) = (<span class=\"n\">32</span>, <span class=\"n\">32</span>, <span class=\"n\">32</span>, <span class=\"n\">8</span>)", "        _VolumeDims (<span class=\"s\">&quot;Volume dims (x, y, z, 0)&quot;</span>, Vector) = (<span class=\"n\">256</span>, <span class=\"n\">256</span>, <span class=\"n\">256</span>, <span class=\"n\">0</span>)", "        _DebugMode (<span class=\"s\">&quot;Debug: 0 off, 1 box hit, 2 ignore scene depth&quot;</span>, Float) = <span class=\"n\">0</span>", "    }", "", "    SubShader", "    {", "        Tags { <span class=\"s\">&quot;RenderPipeline&quot;</span> = <span class=\"s\">&quot;UniversalPipeline&quot;</span> <span class=\"s\">&quot;Queue&quot;</span> = <span class=\"s\">&quot;Transparent&quot;</span> <span class=\"s\">&quot;RenderType&quot;</span> = <span class=\"s\">&quot;Transparent&quot;</span> }", "", "        Pass", "        {", "            Name <span class=\"s\">&quot;VolumeRaymarch&quot;</span>", "            Cull Front", "            ZWrite Off", "            ZTest Always   <span class=\"c\">// we clip against scene depth ourselves, per sample</span>", "            Blend One OneMinusSrcAlpha <span class=\"c\">// premultiplied alpha output</span>", "", "            HLSLPROGRAM", "            #pragma vertex Vert", "            #pragma fragment Frag", "            #pragma target <span class=\"n\">3.5</span>", "            #pragma multi_compile_instancing", "            #pragma multi_compile _ STEREO_INSTANCING_ON STEREO_MULTIVIEW_ON", "", "            #include <span class=\"s\">&quot;Packages/com.unity.render-pipelines.universal/ShaderLibrary/Core.hlsl&quot;</span>", "            #include <span class=\"s\">&quot;Packages/com.unity.render-pipelines.universal/ShaderLibrary/DeclareDepthTexture.hlsl&quot;</span>", "", "            TEXTURE3D(_DensityTex);", "            TEXTURE3D(_LabelTex);", "            TEXTURE3D(_BrickTex);", "            TEXTURE2D(_TransferTex);", "            TEXTURE2D(_IdLut);", "            <span class=\"c\">// Inline sampler states: Unity derives filter/wrap from the names.</span>", "            SAMPLER(my_linear_clamp_sampler);", "            SAMPLER(my_point_clamp_sampler);", "", "            CBUFFER_START(UnityPerMaterial)", "                <span class=\"k\">float</span> _StepCount;", "                <span class=\"k\">float</span> _Peel;", "                <span class=\"k\">float</span> _SilhouetteStrength;", "                <span class=\"k\">float</span> _GradientWeight;", "                <span class=\"k\">float</span> _WindowLevel;", "                <span class=\"k\">float</span> _WindowWidth;", "                <span class=\"k\">float</span> _DefectGlow;", "                <span class=\"k\">float4</span> _ClipPlane;", "                <span class=\"k\">float</span> _ClipEnabled;", "                <span class=\"k\">float4</span> _LensCentreWS;", "                <span class=\"k\">float4</span> _LensNormalWS;", "                <span class=\"k\">float</span> _LensRadius;", "                <span class=\"k\">float</span> _LensPeel;", "                <span class=\"k\">float4</span> _IdLutSize;", "                <span class=\"k\">float4</span> _BrickGrid;", "                <span class=\"k\">float4</span> _VolumeDims;", "                <span class=\"k\">float</span> _DebugMode;", "            CBUFFER_END", "", "            <span class=\"k\">static</span> <span class=\"k\">const</span> <span class=\"k\">float</span> kOpaqueAlpha = <span class=\"n\">0.97</span>;   <span class=\"c\">// early ray termination</span>", "            <span class=\"k\">static</span> <span class=\"k\">const</span> <span class=\"k\">float</span> kReferenceSteps = <span class=\"n\">160</span>; <span class=\"c\">// opacity is authored for this step count</span>", "", "            <span class=\"k\">struct</span> Attributes", "            {", "                <span class=\"k\">float4</span> positionOS : POSITION;", "                UNITY_VERTEX_INPUT_INSTANCE_ID", "            };", "", "            <span class=\"k\">struct</span> Varyings", "            {", "                <span class=\"k\">float4</span> positionCS : SV_POSITION;", "                <span class=\"k\">float3</span> positionOS : TEXCOORD0;", "                UNITY_VERTEX_OUTPUT_STEREO", "            };", "", "            Varyings Vert(Attributes v)", "            {", "                Varyings o;", "                UNITY_SETUP_INSTANCE_ID(v);", "                UNITY_INITIALIZE_VERTEX_OUTPUT_STEREO(o);", "                o.positionCS = TransformObjectToHClip(v.positionOS.xyz);", "                o.positionOS = v.positionOS.xyz;", "                <span class=\"k\">return</span> o;", "            }", "", "            <span class=\"c\">// Slab test against the unit box; returns (tNear, tFar).</span>", "            <span class=\"k\">float2</span> IntersectBox(<span class=\"k\">float3</span> origin, <span class=\"k\">float3</span> dir)", "            {", "                <span class=\"k\">float3</span> inv = <span class=\"n\">1.0</span> / dir;", "                <span class=\"k\">float3</span> t0 = (-<span class=\"n\">0.5</span> - origin) * inv;", "                <span class=\"k\">float3</span> t1 = (<span class=\"n\">0.5</span> - origin) * inv;", "                <span class=\"k\">float3</span> tMin = min(t0, t1);", "                <span class=\"k\">float3</span> tMax = max(t0, t1);", "                <span class=\"k\">return</span> <span class=\"k\">float2</span>(max(max(tMin.x, tMin.y), tMin.z), min(min(tMax.x, tMax.y), tMax.z));", "            }", "", "            <span class=\"c\">// Interleaved gradient noise (Jimenez 2014): cheap, texture-free, low-discrepancy</span>", "            <span class=\"c\">// per-pixel jitter. Offsetting each ray&#x27;s start by a fraction of a step turns</span>", "            <span class=\"c\">// wood-grain banding into fine noise that the eye ignores.</span>", "            <span class=\"k\">float</span> InterleavedGradientNoise(<span class=\"k\">float2</span> pixel)", "            {", "                <span class=\"k\">return</span> frac(<span class=\"n\">52.9829189</span> * frac(dot(pixel, <span class=\"k\">float2</span>(<span class=\"n\">0.06711056</span>, <span class=\"n\">0.00583715</span>))));", "            }", "", "            <span class=\"k\">int</span> LabelAt(<span class=\"k\">float3</span> uvw)", "            {", "                <span class=\"k\">float2</span> rg = SAMPLE_TEXTURE3D_LOD(_LabelTex, my_point_clamp_sampler, uvw, <span class=\"n\">0</span>).rg;", "                <span class=\"k\">return</span> (<span class=\"k\">int</span>)round(rg.r * <span class=\"n\">255.0</span>) + <span class=\"n\">256</span> * (<span class=\"k\">int</span>)round(rg.g * <span class=\"n\">255.0</span>);", "            }", "", "            <span class=\"c\">// Unsigned integer divide/modulus: signed ones compile to slow multi-instruction</span>", "            <span class=\"c\">// sequences on mobile GPUs, and this runs for every defect sample.</span>", "            <span class=\"k\">float4</span> IdColour(<span class=\"k\">int</span> id)", "            {", "                uint uid = (uint)id;", "                uint width = (uint)_IdLutSize.x;", "                <span class=\"k\">float2</span> uv = <span class=\"k\">float2</span>((uid % width) + <span class=\"n\">0.5</span>, (uid / width) + <span class=\"n\">0.5</span>) * _IdLutSize.zw;", "                <span class=\"k\">return</span> SAMPLE_TEXTURE2D_LOD(_IdLut, my_point_clamp_sampler, uv, <span class=\"n\">0</span>);", "            }", "", "            <span class=\"c\">// Transfer function with peel: material below the peel threshold fades to glass,</span>", "            <span class=\"c\">// keeping only a view-dependent silhouette so the outer shape stays readable.</span>", "            <span class=\"k\">float4</span> Classify(<span class=\"k\">float</span> density, <span class=\"k\">float3</span> gradient, <span class=\"k\">float3</span> viewDirOS, <span class=\"k\">float</span> peel)", "            {", "                <span class=\"k\">float4</span> tf = SAMPLE_TEXTURE2D_LOD(_TransferTex, my_linear_clamp_sampler, <span class=\"k\">float2</span>(density, <span class=\"n\">0.5</span>), <span class=\"n\">0</span>);", "                <span class=\"k\">float</span> gradMag = saturate(length(gradient));", "                <span class=\"c\">// Gradient-magnitude weighting: boundaries opaque, homogeneous interiors lighter.</span>", "                tf.a *= lerp(<span class=\"n\">1.0</span>, saturate(gradMag * <span class=\"n\">4.0</span>), _GradientWeight);", "                <span class=\"k\">if</span> (density &lt; peel)", "                {", "                    <span class=\"k\">float3</span> n = gradMag &gt; 1e-<span class=\"n\">4</span> ? gradient / gradMag : <span class=\"k\">float3</span>(<span class=\"n\">0</span>, <span class=\"n\">0</span>, <span class=\"n\">1</span>);", "                    <span class=\"k\">float</span> rim = pow(<span class=\"n\">1.0</span> - abs(dot(n, viewDirOS)), <span class=\"n\">3.0</span>);", "                    tf.a *= <span class=\"n\">0.02</span> + _SilhouetteStrength * rim * gradMag;", "                    tf.rgb = lerp(tf.rgb, <span class=\"k\">float3</span>(<span class=\"n\">0.75</span>, <span class=\"n\">0.85</span>, <span class=\"n\">1.0</span>), <span class=\"n\">0.6</span>); <span class=\"c\">// cool glass tint</span>", "                }", "                <span class=\"k\">return</span> tf;", "            }", "", "            <span class=\"k\">half4</span> Frag(Varyings i) : SV_Target", "            {", "                UNITY_SETUP_STEREO_EYE_INDEX_POST_VERTEX(i);", "", "                <span class=\"c\">// Per-eye camera position in object space (GetCameraPositionWS is stereo-aware).</span>", "                <span class=\"k\">float3</span> camWS = GetCameraPositionWS();", "                <span class=\"k\">float3</span> camOS = TransformWorldToObject(camWS);", "                <span class=\"k\">float3</span> dirOS = normalize(i.positionOS - camOS);", "", "                <span class=\"k\">float2</span> hit = IntersectBox(camOS, dirOS);", "                <span class=\"k\">float</span> tNear = max(hit.x, <span class=\"n\">0.0</span>);", "                <span class=\"k\">float</span> tFar = hit.y;", "                <span class=\"k\">if</span> (tFar &lt;= tNear) discard;", "                <span class=\"k\">if</span> (_DebugMode &gt; <span class=\"n\">0.5</span> &amp;&amp; _DebugMode &lt; <span class=\"n\">1.5</span>) <span class=\"k\">return</span> <span class=\"k\">half4</span>(<span class=\"n\">0.3</span> + <span class=\"n\">0.7</span> * frac((camOS + dirOS * tNear) + <span class=\"n\">0.5</span>), <span class=\"n\">1</span>);", "", "                <span class=\"c\">// Clip plane: keep n.p + d &gt;= 0. Track whether the ray enters through the plane.</span>", "                <span class=\"k\">bool</span> enteredThroughPlane = <span class=\"k\">false</span>;", "                <span class=\"k\">if</span> (_ClipEnabled &gt; <span class=\"n\">0.5</span>)", "                {", "                    <span class=\"k\">float</span> denom = dot(_ClipPlane.xyz, dirOS);", "                    <span class=\"k\">float</span> side = dot(_ClipPlane.xyz, camOS + dirOS * tNear) + _ClipPlane.w;", "                    <span class=\"k\">float</span> tPlane = -(dot(_ClipPlane.xyz, camOS) + _ClipPlane.w) / denom;", "                    <span class=\"k\">if</span> (abs(denom) &lt; 1e-<span class=\"n\">6</span>)", "                    {", "                        <span class=\"k\">if</span> (side &lt; <span class=\"n\">0.0</span>) discard;", "                    }", "                    <span class=\"k\">else</span> <span class=\"k\">if</span> (denom &gt; <span class=\"n\">0.0</span>)", "                    {", "                        <span class=\"k\">if</span> (tPlane &gt; tNear) { tNear = tPlane; enteredThroughPlane = <span class=\"k\">true</span>; }", "                    }", "                    <span class=\"k\">else</span>", "                    {", "                        tFar = min(tFar, tPlane);", "                    }", "                    <span class=\"k\">if</span> (tFar &lt;= tNear) discard;", "                }", "", "                <span class=\"c\">// Stop at opaque scene geometry (hands, table, chart) so it occludes the volume.</span>", "                <span class=\"k\">float2</span> screenUV = i.positionCS.xy / _ScaledScreenParams.xy;", "                <span class=\"k\">float</span> sceneDepth = LinearEyeDepth(SampleSceneDepth(screenUV), _ZBufferParams);", "                <span class=\"k\">float3</span> viewForwardWS = -UNITY_MATRIX_V[<span class=\"n\">2</span>].xyz;", "                <span class=\"k\">float3</span> dirWS = normalize(TransformObjectToWorldDir(dirOS));", "                <span class=\"k\">float3</span> entryWS = TransformObjectToWorld(camOS + dirOS * tNear);", "                <span class=\"k\">float3</span> exitWS = TransformObjectToWorld(camOS + dirOS * tFar);", "                <span class=\"k\">float</span> depthEntry = dot(entryWS - camWS, viewForwardWS);", "                <span class=\"k\">float</span> depthExit = dot(exitWS - camWS, viewForwardWS);", "                <span class=\"k\">if</span> (_DebugMode &gt; <span class=\"n\">2.5</span>) <span class=\"k\">return</span> <span class=\"k\">half4</span>(saturate(sceneDepth / <span class=\"n\">2.0</span>), saturate(depthEntry / <span class=\"n\">2.0</span>), saturate(SampleSceneDepth(screenUV) * <span class=\"n\">10.0</span>), <span class=\"n\">1</span>);", "                <span class=\"k\">if</span> (_DebugMode &gt; <span class=\"n\">1.5</span>) sceneDepth = 1e6;", "                <span class=\"k\">if</span> (sceneDepth &lt; depthEntry) discard;", "                <span class=\"k\">if</span> (sceneDepth &lt; depthExit)", "                {", "                    tFar = lerp(tNear, tFar, saturate((sceneDepth - depthEntry) / max(depthExit - depthEntry, 1e-<span class=\"n\">5</span>)));", "                }", "", "                <span class=\"c\">// Magic lens: if this pixel&#x27;s view ray passes through the lens disc, the whole</span>", "                <span class=\"c\">// ray uses the lens peel (focus + context).</span>", "                <span class=\"k\">float</span> peel = _Peel;", "                <span class=\"k\">if</span> (_LensRadius &gt; <span class=\"n\">0.0</span>)", "                {", "                    <span class=\"k\">float</span> d = dot(dirWS, _LensNormalWS.xyz);", "                    <span class=\"k\">if</span> (abs(d) &gt; 1e-<span class=\"n\">4</span>)", "                    {", "                        <span class=\"k\">float</span> t = dot(_LensCentreWS.xyz - camWS, _LensNormalWS.xyz) / d;", "                        <span class=\"k\">float3</span> p = camWS + dirWS * t;", "                        <span class=\"k\">if</span> (t &gt; <span class=\"n\">0.0</span> &amp;&amp; length(p - _LensCentreWS.xyz) &lt; _LensRadius) peel = max(peel, _LensPeel);", "                    }", "                }", "", "                <span class=\"c\">// Step size: the unit cube diagonal (sqrt 3) is divided into _StepCount steps.</span>", "                <span class=\"k\">float</span> dt = <span class=\"n\">1.7320508</span> / _StepCount;", "                <span class=\"k\">float</span> jitter = InterleavedGradientNoise(i.positionCS.xy);", "                <span class=\"k\">float</span> t = tNear + jitter * dt;", "                <span class=\"k\">float</span> opacityScale = kReferenceSteps / _StepCount; <span class=\"c\">// opacity correction for step size</span>", "", "                <span class=\"k\">float4</span> acc = <span class=\"n\">0</span>;", "", "                <span class=\"c\">// Cut face: real CT slice look. If the first sample behind the plane is material</span>", "                <span class=\"c\">// or a defect, show the windowed grey value opaquely (with defect tint).</span>", "                <span class=\"k\">if</span> (enteredThroughPlane)", "                {", "                    <span class=\"k\">float3</span> uvw = camOS + dirOS * (tNear + 1e-<span class=\"n\">4</span>) + <span class=\"n\">0.5</span>;", "                    <span class=\"k\">float</span> density = SAMPLE_TEXTURE3D_LOD(_DensityTex, my_linear_clamp_sampler, uvw, <span class=\"n\">0</span>).a;", "                    <span class=\"k\">int</span> id = LabelAt(uvw);", "                    <span class=\"k\">float4</span> idc = id &gt; <span class=\"n\">0</span> ? IdColour(id) : <span class=\"n\">0</span>;", "                    <span class=\"k\">float</span> lo = _WindowLevel - <span class=\"n\">0.5</span> * _WindowWidth;", "                    <span class=\"k\">float</span> grey = saturate((density - lo) / _WindowWidth);", "                    <span class=\"k\">float4</span> tf = SAMPLE_TEXTURE2D_LOD(_TransferTex, my_linear_clamp_sampler, <span class=\"k\">float2</span>(density, <span class=\"n\">0.5</span>), <span class=\"n\">0</span>);", "                    <span class=\"k\">if</span> (tf.a &gt; <span class=\"n\">0.01</span> || idc.a &gt; <span class=\"n\">0.01</span>)", "                    {", "                        <span class=\"k\">float3</span> rgb = lerp(grey.xxx, idc.rgb, idc.a &gt; <span class=\"n\">0.01</span> ? <span class=\"n\">0.75</span> : <span class=\"n\">0.0</span>);", "                        <span class=\"k\">return</span> <span class=\"k\">half4</span>(rgb, <span class=\"n\">1.0</span>);", "                    }", "                }", "", "                <span class=\"k\">fl      _material.SetFloat(WindowWidthId, Window.y);", "        }", "", "        <span class=\"c\">/// &lt;summary&gt;</span>", "        <span class=\"c\">/// Clips the volume with a world-space plane. The half-space the normal points into is</span>", "        <span class=\"c\">/// kept; the tool orients the normal away from the user, so the near part is removed.</span>", "        <span class=\"c\">/// &lt;/summary&gt;</span>", "        <span class=\"k\">public</span> <span class=\"k\">void</span> SetClipPlaneWorld(Vector3 pointWS, Vector3 normalWS)", "        {", "            <span class=\"c\">// Planes transform with the transpose of the point transform: for p_ws = M p_os,</span>", "            <span class=\"c\">// (n, d)\u00b7(M p_os) = (M\u1d40 (n, d))\u00b7p_os.</span>", "            <span class=\"k\">var</span> planeWS = <span class=\"k\">new</span> Vector4(normalWS.x, normalWS.y, normalWS.z, -Vector3.Dot(normalWS, pointWS));", "            Vector4 planeOS = _proxy.localToWorldMatrix.transpose * planeWS;", "            <span class=\"k\">float</span> len = <span class=\"k\">new</span> Vector3(planeOS.x, planeOS.y, planeOS.z).magnitude;", "            _material.SetVector(ClipPlaneId, planeOS / Mathf.Max(len, 1e-<span class=\"n\">8f</span>));", "            _material.SetFloat(ClipEnabledId, <span class=\"n\">1f</span>);", "            ClipEnabled = <span class=\"k\">true</span>;", "        }", "", "        <span class=\"c\">/// &lt;summary&gt;Removes the clip plane.&lt;/summary&gt;</span>", "        <span class=\"k\">public</span> <span class=\"k\">void</span> DisableClip()", "        {", "            _material.SetFloat(ClipEnabledId, <span class=\"n\">0f</span>);", "            ClipEnabled = <span class=\"k\">false</span>;", "        }", "", "        <span class=\"c\">/// &lt;summary&gt;Activates the magic lens: a disc in world space through which the volume is peeled.&lt;/summary&gt;</span>", "        <span class=\"k\">public</span> <span class=\"k\">void</span> SetLens(Vector3 centreWS, Vector3 normalWS, <span class=\"k\">float</span> radiusMeters)", "        {", "            <span class=\"c\">// Inside the lens, peel as far as the strongest peel gesture does. A fixed 0.6 was</span>", "            <span class=\"c\">// below the density of the CoCr metal, so the lens showed nothing on specimen A.</span>", "            _material.SetFloat(LensPeelId, LensPeelThreshold);", "            _material.SetVector(LensCentreId, centreWS);", "            _material.SetVector(LensNormalId, normalWS.normalized);", "            _material.SetFloat(LensRadiusId, radiusMeters);", "        }", "", "        <span class=\"c\">/// &lt;summary&gt;Turns the lens off.&lt;/summary&gt;</span>", "        <span class=\"k\">public</span> <span class=\"k\">void</span> DisableLens() =&gt; _material.SetFloat(LensRadiusId, <span class=\"n\">0f</span>);", "", "        <span class=\"c\">/// &lt;summary&gt;Defect emission strength.&lt;/summary&gt;</span>", "        <span class=\"k\">public</span> <span class=\"k\">void</span> SetDefectGlow(<span class=\"k\">float</span> glow) =&gt; _material.SetFloat(DefectGlowId, glow);", "", "        <span class=\"c\">/// &lt;summary&gt;Selects the ray-marching step count.&lt;/summary&gt;</span>", "        <span class=\"k\">public</span> <span class=\"k\">void</span> SetQuality(QualityTier tier)", "        {", "            _quality = tier;", "            <span class=\"k\">if</span> (_material != <span class=\"k\">null</span>) _material.SetFloat(StepCountId, (<span class=\"k\">int</span>)tier);", "        }", "", "        <span class=\"c\">/// &lt;summary&gt;World position \u2192 texture coordinates [0,1]^3 (outside values mean outside the volume).&lt;/summary&gt;</span>", "        <span class=\"k\">public</span> Vector3 WorldToTexture(Vector3 worldPos) =&gt;", "            PhysicalUnits.ObjectToTexture(_proxy.InverseTransformPoint(worldPos));", "", "        <span class=\"c\">/// &lt;summary&gt;Volume-space millimetres \u2192 world position.&lt;/summary&gt;</span>", "        <span class=\"k\">public</span> Vector3 MmToWorld(Vector3 mm) =&gt;", "            _proxy.TransformPoint(PhysicalUnits.MmToObject(mm, Dataset.ExtentMm));", "", "        <span class=\"c\">/// &lt;summary&gt;True if &lt;paramref name=&quot;uvw&quot;/&gt; lies inside the volume.&lt;/summary&gt;</span>", "        <span class=\"k\">public</span> <span class=\"k\">static</span> <span class=\"k\">bool</span> InsideVolume(Vector3 uvw) =&gt;", "            uvw.x &gt;= <span class=\"n\">0f</span> &amp;&amp; uvw.y &gt;= <span class=\"n\">0f</span> &amp;&amp; uvw.z &gt;= <span class=\"n\">0f</span> &amp;&amp; uvw.x &lt;= <span class=\"n\">1f</span> &amp;&amp; uvw.y &lt;= <span class=\"n\">1f</span> &amp;&amp; uvw.z &lt;= <span class=\"n\">1f</span>;", "", "        <span class=\"k\">private</span> <span class=\"k\">static</span> Mesh CreateUnitCube()", "        {", "            <span class=\"c\">// Build our own cube: the built-in one has 24 vertices with UVs/normals we do not need.</span>", "            <span class=\"k\">var</span> mesh = <span class=\"k\">new</span> Mesh { name = <span class=\"s\">&quot;VolumeProxyCube&quot;</span> };", "            <span class=\"k\">var</span> v = <span class=\"k\">new</span> Vector3[<span class=\"n\">8</span>];", "            <span class=\"k\">for</span> (<span class=\"k\">int</span> i = <span class=\"n\">0</span>; i &lt; <span class=\"n\">8</span>; i++) v[i] = <span class=\"k\">new</span> Vector3((i &amp; <span class=\"n\">1</span>) - <span class=\"n\">0.5f</span>, ((i &gt;&gt; <span class=\"n\">1</span>) &amp; <span class=\"n\">1</span>) - <span class=\"n\">0.5f</span>, ((i &gt;&gt; <span class=\"n\">2</span>) &amp; <span class=\"n\">1</span>) - <span class=\"n\">0.5f</span>);", "            mesh.vertices = v;", "            mesh.triangles = <span class=\"k\">new</span>[]", "            {", "                <span class=\"n\">0</span>, <span class=\"n\">2</span>, <span class=\"n\">1</span>, <span class=\"n\">1</span>, <span class=\"n\">2</span>, <span class=\"n\">3</span>,  <span class=\"c\">// -z</span>", "                <span class=\"n\">4</span>, <span class=\"n\">5</span>, <span class=\"n\">6</span>, <span class=\"n\">5</span>, <span class=\"n\">7</span>, <span class=\"n\">6</span>,  <span class=\"c\">// +z</span>", "                <span class=\"n\">0</span>, <span class=\"n\">1</span>, <span class=\"n\">4</span>, <span class=\"n\">1</span>, <span class=\"n\">5</span>, <span class=\"n\">4</span>,  <span class=\"c\">// -y</span>", "                <span class=\"n\">2</span>, <span class=\"n\">6</span>, <span class=\"n\">3</span>, <span class=\"n\">3</span>, <span class=\"n\">6</span>, <span class=\"n\">7</span>,  <span class=\"c\">// +y</span>", "                <span class=\"n\">0</span>, <span class=\"n\">4</span>, <span class=\"n\">2</span>, <span class=\"n\">2</span>, <span class=\"n\">4</span>, <span class=\"n\">6</span>,  <span class=\"c\">// -x</span>", "                <span class=\"n\">1</span>, <span class=\"n\">3</span>, <span class=\"n\">5</span>, <span class=\"n\">3</span>, <span class=\"n\">7</span>, <span class=\"n\">5</span>,  <span class=\"c\">// +x</span>", "            };", "            mesh.RecalculateBounds();", "            <span class=\"k\">return</span> mesh;", "        }", "    }", "}"]}, {"group": "3 Hands & gestures", "path": "Assets/XRayHands/Input/HandFrame.cs", "title": "The hand model", "what": "One hand per frame: 26 joint positions (OpenXR order) plus derived values the gestures use.", "qs": ["How do you compute the palm normal?", "What is finger curl?"], "points": [{"line": 85, "label": "ComputeDerived()", "text": "Computes finger curls, palm position, palm normal and pinch distance from the joints.", "end": 116}, {"line": 101, "label": "Palm normal", "text": "Cross product of 'along the hand' and 'across the knuckles'. The order flips for left vs right hand, otherwise one normal points out of the back of the hand.", "end": 103}, {"line": 122, "label": "ChainCurl()", "text": "Finger curl = sum of bend angles along the finger, normalised to 0 (straight) .. 1 (fist).", "end": 134}], "code": ["<span class=\"k\">using</span> UnityEngine;", "", "namespace XRayHands.Input", "{", "    <span class=\"c\">/// &lt;summary&gt;</span>", "    <span class=\"c\">/// One hand&#x27;s pose for one frame: 26 joint positions/rotations in world space, plus values</span>", "    <span class=\"c\">/// derived from them that every gesture detector needs (finger curls, palm pose, pinch gap).</span>", "    <span class=\"c\">/// &lt;/summary&gt;</span>", "    <span class=\"c\">/// &lt;remarks&gt;</span>", "    <span class=\"c\">/// Why a reusable class instead of a struct: a struct holding 26-element arrays would still</span>", "    <span class=\"c\">/// share those arrays when copied, which invites aliasing bugs, and allocating fresh arrays</span>", "    <span class=\"c\">/// per frame would create garbage on Quest. Each &lt;see cref=&quot;IHandSource&quot;/&gt; owns two</span>", "    <span class=\"c\">/// instances and refills them in place every frame (zero allocations in Update).</span>", "    <span class=\"c\">/// &lt;/remarks&gt;</span>", "    <span class=\"k\">public</span> <span class=\"k\">sealed</span> <span class=\"k\">class</span> HandFrame", "    {", "        <span class=\"c\">/// &lt;summary&gt;Number of joints (OpenXR hand model).&lt;/summary&gt;</span>", "        <span class=\"k\">public</span> <span class=\"k\">const</span> <span class=\"k\">int</span> JointCount = <span class=\"n\">26</span>;", "", "        <span class=\"c\">// A fully curled finger bends roughly 90\u00b0 at each of its three joints; we normalise the</span>", "        <span class=\"c\">// summed bend to 0..1 against slightly less than that so a firm fist reads as ~1.</span>", "        <span class=\"k\">private</span> <span class=\"k\">const</span> <span class=\"k\">float</span> FingerFullCurlDegrees = <span class=\"n\">230f</span>;", "        <span class=\"c\">// The thumb has only two bending joints and a smaller range.</span>", "        <span class=\"k\">private</span> <span class=\"k\">const</span> <span class=\"k\">float</span> ThumbFullCurlDegrees = <span class=\"n\">110f</span>;", "", "        <span class=\"c\">/// &lt;summary&gt;Joint positions in world space (metres), indexed by &lt;see cref=&quot;HandJoint&quot;/&gt;.&lt;/summary&gt;</span>", "        <span class=\"k\">public</span> <span class=\"k\">readonly</span> Vector3[] Positions = <span class=\"k\">new</span> Vector3[JointCount];", "", "        <span class=\"c\">/// &lt;summary&gt;Joint rotations in world space, indexed by &lt;see cref=&quot;HandJoint&quot;/&gt;.&lt;/summary&gt;</span>", "        <span class=\"k\">public</span> <span class=\"k\">readonly</span> Quaternion[] Rotations = <span class=\"k\">new</span> Quaternion[JointCount];", "", "        <span class=\"c\">/// &lt;summary&gt;Finger curl 0 (straight) .. 1 (fully curled), indexed by &lt;see cref=&quot;Finger&quot;/&gt;.&lt;/summary&gt;</span>", "        <span class=\"k\">public</span> <span class=\"k\">readonly</span> <span class=\"k\">float</span>[] Curl = <span class=\"k\">new</span> <span class=\"k\">float</span>[<span class=\"n\">5</span>];", "", "        <span class=\"c\">/// &lt;summary&gt;Which hand this frame belongs to.&lt;/summary&gt;</span>", "        <span class=\"k\">public</span> Handedness Handedness { <span class=\"k\">get</span>; }", "", "        <span class=\"c\">/// &lt;summary&gt;True if the tracker currently sees this hand. All other values are stale when false.&lt;/summary&gt;</span>", "        <span class=\"k\">public</span> <span class=\"k\">bool</span> IsTracked { <span class=\"k\">get</span>; <span class=\"k\">set</span>; }", "", "        <span class=\"c\">/// &lt;summary&gt;Palm centre in world space.&lt;/summary&gt;</span>", "        <span class=\"k\">public</span> Vector3 PalmPosition { <span class=\"k\">get</span>; <span class=\"k\">private</span> <span class=\"k\">set</span>; }", "", "        <span class=\"c\">/// &lt;summary&gt;Unit vector pointing out of the palm (the side you would push with).&lt;/summary&gt;</span>", "        <span class=\"k\">public</span> Vector3 PalmNormal { <span class=\"k\">get</span>; <span class=\"k\">private</span> <span class=\"k\">set</span>; }", "", "        <span class=\"c\">/// &lt;summary&gt;Unit vector from wrist towards the middle finger.&lt;/summary&gt;</span>", "        <span class=\"k\">public</span> Vector3 PalmForward { <span class=\"k\">get</span>; <span class=\"k\">private</span> <span class=\"k\">set</span>; }", "", "        <span class=\"c\">/// &lt;summary&gt;Distance between thumb tip and index tip in metres.&lt;/summary&gt;</span>", "        <span class=\"k\">public</span> <span class=\"k\">float</span> PinchDistance { <span class=\"k\">get</span>; <span class=\"k\">private</span> <span class=\"k\">set</span>; }", "", "        <span class=\"c\">/// &lt;summary&gt;Midpoint between thumb tip and index tip: where a pinch &quot;holds&quot; things.&lt;/summary&gt;</span>", "        <span class=\"k\">public</span> Vector3 PinchPoint { <span class=\"k\">get</span>; <span class=\"k\">private</span> <span class=\"k\">set</span>; }", "", "        <span class=\"c\">/// &lt;summary&gt;Mean curl of index, middle, ring and little finger.&lt;/summary&gt;</span>", "        <span class=\"k\">public</span> <span class=\"k\">float</span> MeanFingerCurl { <span class=\"k\">get</span>; <span class=\"k\">private</span> <span class=\"k\">set</span>; }", "", "        <span class=\"c\">/// &lt;summary&gt;Creates an empty, untracked frame for &lt;paramref name=&quot;handedness&quot;/&gt;.&lt;/summary&gt;</span>", "        <span class=\"k\">public</span> HandFrame(Handedness handedness)", "        {", "            Handedness = handedness;", "            <span class=\"k\">for</span> (<span class=\"k\">int</span> i = <span class=\"n\">0</span>; i &lt; JointCount; i++) Rotations[i] = Quaternion.identity;", "        }", "", "        <span class=\"c\">/// &lt;summary&gt;Position of one joint.&lt;/summary&gt;</span>", "        <span class=\"k\">public</span> Vector3 Joint(HandJoint j) =&gt; Positions[(<span class=\"k\">int</span>)j];", "", "        <span class=\"c\">/// &lt;summary&gt;Curl of one finger.&lt;/summary&gt;</span>", "        <span class=\"k\">public</span> <span class=\"k\">float</span> FingerCurl(Finger f) =&gt; Curl[(<span class=\"k\">int</span>)f];", "", "        <span class=\"c\">/// &lt;summary&gt;Copies all joint data from &lt;paramref name=&quot;other&quot;/&gt; (no allocation).&lt;/summary&gt;</span>", "        <span class=\"k\">public</span> <span class=\"k\">void</span> CopyFrom(HandFrame other)", "        {", "            System.Array.Copy(other.Positions, Positions, JointCount);", "            System.Array.Copy(other.Rotations, Rotations, JointCount);", "            IsTracked = other.IsTracked;", "            ComputeDerived();", "        }", "", "        <span class=\"c\">/// &lt;summary&gt;</span>", "        <span class=\"c\">/// Recomputes curls, palm pose and pinch values from the joint arrays. Call after the</span>", "        <span class=\"c\">/// joints have been written for this frame.</span>", "        <span class=\"c\">/// &lt;/summary&gt;</span>", "        <span class=\"k\">public</span> <span class=\"k\">void</span> ComputeDerived()", "        {", "            Vector3 wrist = Joint(HandJoint.Wrist);", "            Vector3 indexBase = Joint(HandJoint.IndexProximal);", "            Vector3 littleBase = Joint(HandJoint.LittleProximal);", "            Vector3 middleBase = Joint(HandJoint.MiddleProximal);", "", "            PalmPosition = Joint(HandJoint.Palm);", "            PalmForward = SafeNormalize(middleBase - wrist, Vector3.forward);", "", "            <span class=\"c\">// The palm normal is the cross product of &quot;across the knuckles&quot; and &quot;along the hand&quot;.</span>", "            <span class=\"c\">// The order flips between hands so the normal always points out of the palm.</span>", "            <span class=\"c\">// Check (right hand flat, palm down, fingers +Z, thumb side -X):</span>", "            <span class=\"c\">// across = (-1,0,0), forward = (0,0,1), forward \u00d7 across = (0,-1,0) = down. \u2713</span>", "            Vector3 across = indexBase - littleBase;", "            Vector3 n = Handedness == Handedness.Right", "                ? Vector3.Cross(PalmForward, across)", "                : Vector3.Cross(across, PalmForward);", "            PalmNormal = SafeNormalize(n, Vector3.down);", "", "            Curl[(<span class=\"k\">int</span>)Finger.Thumb] = ChainCurl(HandJoint.ThumbMetacarpal, <span class=\"n\">4</span>, ThumbFullCurlDegrees);", "            Curl[(<span class=\"k\">int</span>)Finger.Index] = ChainCurl(HandJoint.IndexMetacarpal, <span class=\"n\">5</span>, FingerFullCurlDegrees);", "            Curl[(<span class=\"k\">int</span>)Finger.Middle] = ChainCurl(HandJoint.MiddleMetacarpal, <span class=\"n\">5</span>, FingerFullCurlDegrees);", "            Curl[(<span class=\"k\">int</span>)Finger.Ring] = ChainCurl(HandJoint.RingMetacarpal, <span class=\"n\">5</span>, FingerFullCurlDegrees);", "            Curl[(<span class=\"k\">int</span>)Finger.Little] = ChainCurl(HandJoint.LittleMetacarpal, <span class=\"n\">5</span>, FingerFullCurlDegrees);", "            MeanFingerCurl = <span class=\"n\">0.25f</span> * (Curl[<span class=\"n\">1</span>] + Curl[<span class=\"n\">2</span>] + Curl[<span class=\"n\">3</span>] + Curl[<span class=\"n\">4</span>]);", "", "            Vector3 thumbTip = Joint(HandJoint.ThumbTip);", "            Vector3 indexTip = Joint(HandJoint.IndexTip);", "            PinchDistance = Vector3.Distance(thumbTip, indexTip);", "            PinchPoint = <span class=\"n\">0.5f</span> * (thumbTip + indexTip);", "        }", "", "        <span class=\"c\">/// &lt;summary&gt;</span>", "        <span class=\"c\">/// Sum of bend angles between consecutive bones of a finger chain, normalised to 0..1.</span>", "        <span class=\"c\">/// Uses only positions, so it works identically for real tracking and simulated hands.</span>", "        <span class=\"c\">/// &lt;/summary&gt;</span>", "        <span class=\"k\">private</span> <span class=\"k\">float</span> ChainCurl(HandJoint first, <span class=\"k\">int</span> jointsInChain, <span class=\"k\">float</span> fullCurlDegrees)", "        {", "            <span class=\"k\">int</span> start = (<span class=\"k\">int</span>)first;", "            <span class=\"k\">float</span> sum = <span class=\"n\">0f</span>;", "            <span class=\"k\">for</span> (<span class=\"k\">int</span> i = <span class=\"n\">0</span>; i &lt; jointsInChain - <span class=\"n\">2</span>; i++)", "            {", "                Vector3 a = Positions[start + i + <span class=\"n\">1</span>] - Positions[start + i];", "                Vector3 b = Positions[start + i + <span class=\"n\">2</span>] - Positions[start + i + <span class=\"n\">1</span>];", "                <span class=\"k\">if</span> (a.sqrMagnitude &lt; 1e-<span class=\"n\">10f</span> || b.sqrMagnitude &lt; 1e-<span class=\"n\">10f</span>) <span class=\"k\">continue</span>;", "                sum += Vector3.Angle(a, b);", "            }", "            <span class=\"k\">return</span> Mathf.Clamp01(sum / fullCurlDegrees);", "        }", "", "        <span class=\"k\">private</span> <span class=\"k\">static</span> Vector3 SafeNormalize(Vector3 v, Vector3 fallback)", "        {", "            <span class=\"k\">float</span> m = v.magnitude;", "            <span class=\"k\">return</span> m &gt; 1e-<span class=\"n\">6f</span> ? v / m : fallback;", "        }", "    }", "}"]}, {"group": "3 Hands & gestures", "path": "Assets/XRayHands/Input/SimulatedHandSource.cs", "title": "Simulated hands (no headset)", "what": "Keyboard + mouse build full 26-joint hands, so the same gesture code runs in the editor as on the Q           {", "                TickScripted(_left, Handedness.Left);", "                TickScripted(_right, Handedness.Right);", "                <span class=\"k\">return</span>;", "            }", "            Keyboard kb = Keyboard.current;", "            Mouse mouse = Mouse.current;", "            <span class=\"k\">if</span> (kb == <span class=\"k\">null</span> || mouse == <span class=\"k\">null</span> || Cam == <span class=\"k\">null</span>)", "            {", "                _left.IsTracked = _right.IsTracked = <span class=\"k\">false</span>;", "                <span class=\"k\">return</span>;", "            }", "", "            <span class=\"k\">bool</span> shift = kb.leftShiftKey.isPressed || kb.rightShiftKey.isPressed;", "            <span class=\"k\">bool</span> lmb = mouse.leftButton.isPressed;", "            <span class=\"k\">float</span> wheel = mouse.scroll.ReadValue().y / WheelNotch;", "", "            <span class=\"k\">bool</span> twoHandMode = kb.pKey.isPressed || (shift &amp;&amp; lmb);", "            <span class=\"k\">if</span> (twoHandMode) _pairDistanceMeters = Mathf.Clamp(_pairDistanceMeters + wheel * _wheelDepthStepMeters, MinPairDistanceMeters, MaxPairDistanceMeters);", "            <span class=\"k\">else</span> _depthMeters = Mathf.Clamp(_depthMeters + wheel * _wheelDepthStepMeters, MinDepthMeters, MaxDepthMeters);", "", "            <span class=\"k\">if</span> (kb.cKey.isPressed)", "            {", "                <span class=\"k\">if</span> (kb.qKey.isPressed) _twistDegrees -= _twistDegreesPerSecond * deltaTime;", "                <span class=\"k\">if</span> (kb.eKey.isPressed) _twistDegrees += _twistDegreesPerSecond * deltaTime;", "            }", "            <span class=\"k\">else</span>", "            {", "                _twistDegrees = <span class=\"n\">0f</span>;", "            }", "", "            Transform cam = Cam.transform;", "            Ray ray = Cam.ScreenPointToRay(mouse.position.ReadValue());", "            Vector3 handPoint = ray.origin + ray.direction * _depthMeters;", "            <span class=\"k\">float</span> blend = <span class=\"n\">1f</span> - Mathf.Exp(-_blendSpeed * deltaTime);", "", "            <span class=\"c\">// Default orientation: fingers along the view ray, palm down.</span>", "            Quaternion along = Quaternion.LookRotation(ray.direction, cam.up);", "            Pose rightWrist;", "            HandShape rightTarget;", "            <span class=\"k\">bool</span> leftTracked = <span class=\"k\">false</span>;", "            Pose leftWrist = <span class=\"k\">default</span>;", "            HandShape leftTarget = HandShape.Open;", "", "            <span class=\"k\">if</span> (kb.pKey.isPressed)", "            {", "                <span class=\"c\">// Peel: palms vertical and facing each other across the specimen.</span>", "                Vector3 centre = _specimen != <span class=\"k\">null</span> ? _specimen.position : handPoint;", "                Vector3 side = cam.right * (<span class=\"n\">0.5f</span> * _pairDistanceMeters);", "                Quaternion fingersForward = Quaternion.LookRotation(cam.forward, cam.up);", "                rightWrist = <span class=\"k\">new</span> Pose(centre + side - cam.forward * <span class=\"n\">0.06f</span>, fingersForward * Quaternion.AngleAxis(-<span class=\"n\">90f</span>, Vector3.forward));", "                leftWrist = <span class=\"k\">new</span> Pose(centre - side - cam.forward * <span class=\"n\">0.06f</span>, fingersForward * Quaternion.AngleAxis(<span class=\"n\">90f</span>, Vector3.forward));", "                rightTarget = HandShape.Open;", "                leftTarget = HandShape.Open;", "                leftTracked = <span class=\"k\">true</span>;", "            }", "            <span class=\"k\">else</span> <span class=\"k\">if</span> (shift &amp;&amp; lmb)", "            {", "                <span class=\"c\">// Two-hand pinch: hands mirrored around the mouse point; wheel spreads them.</span>", " ndShape.Fist;", "            }", "            <span class=\"k\">else</span> <span class=\"k\">if</span> (kb.fKey.isPressed)", "            {", "                rightWrist = <span class=\"k\">new</span> Pose(handPoint - ray.direction * <span class=\"n\">0.17f</span>, along); <span class=\"c\">// index tip at the mouse point</span>", "                rightTarget = HandShape.Point;", "            }", "            <span class=\"k\">else</span> <span class=\"k\">if</span> (kb.gKey.isPressed &amp;&amp; lmb)", "            {", "                rightWrist = <span class=\"k\">new</span> Pose(handPoint - ray.direction * <span class=\"n\">0.05f</span>, along);", "                rightTarget = HandShape.Fist;", "            }", "            <span class=\"k\">else</span>", "            {", "                rightWrist = <span class=\"k\">new</span> Pose(handPoint - ray.direction * <span class=\"n\">0.1f</span>, along);", "                rightTarget = lmb ? HandShape.Pinching : HandShape.Open;", "            }", "", "            _rightShape = HandShape.Lerp(_rightShape, rightTarget, blend);", "            HandPoseBuilder.Build(_right, rightWrist, _rightShape);", "", "            <span class=\"k\">if</span> (leftTracked)", "            {", "                _leftShape = HandShape.Lerp(_leftShape, leftTarget, blend);", "                HandPoseBuilder.Build(_left, leftWrist, _leftShape);", "            }", "            <span class=\"k\">else</span>", "            {", "                _left.IsTracked = <span class=\"k\">false</span>;", "            }", "        }", "", "        <span class=\"k\">private</span> <span class=\"k\">void</span> TickScripted(HandFrame frame, Handedness hand)", "        {", "            <span class=\"k\">int</span> i = (<span class=\"k\">int</span>)hand;", "            <span class=\"k\">if</span> (!_scriptedTracked[i]) { frame.IsTracked = <span class=\"k\">false</span>; <span class=\"k\">return</span>; }", "            HandPoseBuilder.Build(frame, _scriptedWrist[i], _scriptedShape[i]);", "        }", "    }", "}"]}, {"group": "3 Hands & gestures", "path": "Assets/XRayHands/Gestures/Ramp.cs", "title": "Soft thresholds", "what": "Instead of a hard yes/no, each rule gives a value 0..1 on a linear ramp. A gesture takes the minimum of its rules (fuzzy AND).", "qs": ["Why soft thresholds instead of if/else?"], "points": [{"line": 13, "label": "Below()", "text": "1 when the value is clearly below the limit, 0 when clearly above, linear in between.", "end": 13}, {"line": 16, "label": "Above()", "text": "The mirror case.", "end": 16}], "code": ["<span class=\"k\">using</span> UnityEngine;", "", "namespace XRayHands.Gestures", "{", "    <span class=\"c\">/// &lt;summary&gt;</span>", "    <span class=\"c\">/// Soft thresholds. Every gesture criterion is a linear ramp from 0 (clearly not met) to 1</span>", "    <span class=\"c\">/// (clearly met); a gesture&#x27;s confidence is the minimum of its criteria (fuzzy AND), so the</span>", "    <span class=\"c\">/// weakest criterion decides, exactly like a strict AND but continuous.</span>", "    <span class=\"c\">/// &lt;/summary&gt;</span>", "    <span class=\"k\">public</span> <span class=\"k\">static</span> <span class=\"k\">class</span> Ramp", "    {", "        <span class=\"c\">/// &lt;summary&gt;1 when &lt;paramref name=&quot;value&quot;/&gt; \u2264 &lt;paramref name=&quot;full&quot;/&gt;, 0 when \u2265 &lt;paramref name=&quot;zero&quot;/&gt; (full &amp;lt; zero).&lt;/summary&gt;</span>", "        <span class=\"k\">public</span> <span class=\"k\">static</span> <span class=\"k\">float</span> Below(<span class=\"k\">float</span> value, <span class=\"k\">float</span> full, <span class=\"k\">float</span> zero) =&gt; Mathf.Clamp01((zero - value) / (zero - full));", "", "        <span class=\"c\">/// &lt;summary&gt;1 when &lt;paramref name=&quot;value&quot;/&gt; \u2265 &lt;paramref name=&quot;full&quot;/&gt;, 0 when \u2264 &lt;paramref name=&quot;zero&quot;/&gt; (zero &amp;lt; full).&lt;/summary&gt;</span>", "        <span class=\"k\">public</span> <span class=\"k\">static</span> <span class=\"k\">float</span> Above(<span class=\"k\">float</span> value, <span class=\"k\">float</span> full, <span class=\"k\">float</span> zero) =&gt; Mathf.Clamp01((value - zero) / (full - zero));", "    }", "}"]}, {"group": "3 Hands & gestures", "path": "Assets/XRayHands/Gestures/Detectors.cs", "title": "Gesture detectors", "what": "One small class per gesture. Each turns hand data into a confidence 0..1, using geometric rules. No machine learning.", "qs": ["Why rules and not machine learning?", "Pick one gesture and explain its rules."], "points": [{"line": 44, "label": "PinchDetector", "text": "Thumb tip close to index tip (enter < 2 cm).", "end": 52}, {"line": 58, "label": "FlatPalmDetector", "text": "All four finger curls below 0.25 and palm inside the part (+5 cm). Starts the cut.", "end": 80}, {"line": 86, "label": "PeelDetector", "text": "Both palms flat and facing each other (dot of normals < -0.7), within 40 cm.", "end": 115}, {"line": 118, "label": "PointDetector", "text": "Index straight, other fingers curled: the probe.", "end": 132}, {"line": 138, "label": "GrabDetector", "text": "Mean curl > 0.7 near the part. Fixed bug: a precision pinch used to count as a grab.", "end": 166}, {"line": 171, "label": "LensDetector", "text": "Thumb and index tips touching to make an 'O', facing your eye, held 250 ms.", "end": 209}, {"line": 212, "label": "ResetDetector", "text": "Palm up, then close to a fist and hold.", "end": 224}, {"line": 230, "label": "TwistTracker", "text": "Measures wrist roll for the contrast dial.", "end": 256}], "code": ["<span class=\"k\">using</span> UnityEngine;", "<span class=\"k\">using</span> XRayHands.Input;", "", "namespace XRayHands.Gestures", "{", "    <span class=\"c\">/// &lt;summary&gt;</span>", "    <span class=\"c\">/// A pure function from one frame of hand data to a confidence 0..1. Detectors hold no</span>", "    <span class=\"c\">/// timing state; &lt;see cref=&quot;GestureState&quot;/&gt; adds hysteresis and hold times on top.</span>", "    <span class=\"c\">/// &lt;/summary&gt;</span>", "    <span class=\"k\">public</span> <span class=\"k\">interface</span> IGestureDetector", "    {", "        <span class=\"c\">/// &lt;summary&gt;Confidence that the gesture is being performed this frame.&lt;/summary&gt;</span>", "        <span class=\"k\">float</span> Evaluate(<span class=\"k\">in</span> GestureContext ctx);", "    }", "", "    <span class=\"c\">/// &lt;summary&gt;Base for single-hand detectors: returns 0 whenever that hand is not tracked.&lt;/summary&gt;</span>", "    <span class=\"k\">public</span> <span class=\"k\">abstract</span> <span class=\"k\">class</span> HandDetector : IGestureDetector", "    {", "        <span class=\"c\">/// &lt;summary&gt;Shared thresholds.&lt;/summary&gt;</span>", "        <span class=\"k\">protected</span> <span class=\"k\">readonly</span> GestureTuning Tuning;", "", "        <span class=\"c\">/// &lt;summary&gt;Which hand this detector watches.&lt;/summary&gt;</span>", "        <span class=\"k\">public</span> Handedness Hand { <span class=\"k\">get</span>; }", "", "        <span class=\"c\">/// &lt;summary&gt;Creates a detector for one hand.&lt;/summary&gt;</span>", "        <span class=\"k\">protected</span> HandDetector(GestureTuning tuning, Handedness hand)", "        {", "            Tuning = tuning;", "            Hand = hand;", "        }", "", "        <span class=\"c\">/// &lt;inheritdoc/&gt;</span>", "        <span class=\"k\">public</span> <span class=\"k\">float</span> Evaluate(<span class=\"k\">in</span> GestureContext ctx)", "        {", "            HandFrame f = ctx.Hand(Hand);", "            <span class=\"k\">return</span> f != <span class=\"k\">null</span> &amp;&amp; f.IsTracked ? EvaluateHand(f, ctx) : <span class=\"n\">0f</span>;", "        }", "", "        <span class=\"c\">/// &lt;summary&gt;Confidence for a tracked hand.&lt;/summary&gt;</span>", "        <span class=\"k\">protected</span> <span class=\"k\">abstract</span> <span class=\"k\">float</span> EvaluateHand(HandFrame f, <span class=\"k\">in</span> GestureContext ctx);", "    }", "", "    <span class=\"c\">/// &lt;summary&gt;Thumb tip to index tip under 2.0 cm enters, over 3.5 cm releases.&lt;/summary&gt;</span>", "    <span class=\"k\">public</span> <span class=\"k\">sealed</span> <span class=\"k\">class</span> PinchDetector : HandDetector", "    {", "        <span class=\"c\">/// &lt;summary&gt;Creates a pinch detector.&lt;/summary&gt;</span>", "        <span class=\"k\">public</span> PinchDetector(GestureTuning t, Handedness h) : <span class=\"k\">base</span>(t, h) { }", "", "        <span class=\"c\">/// &lt;inheritdoc/&gt;</span>", "        <span class=\"k\">protected</span> <span class=\"k\">override</span> <span class=\"k\">float</span> EvaluateHand(HandFrame f, <span class=\"k\">in</span> GestureContext ctx) =&gt;", "            Ramp.Below(f.PinchDistance, Tuning.PinchEnterDistanceMeters, Tuning.PinchExitDistanceMeters);", "    }", "", "    <span class=\"c\">/// &lt;summary&gt;</span>", "    <span class=\"c\">/// Flat palm inside the specimen (bounds + 5 cm): all four finger curls under 0.25.</span>", "    <span class=\"c\">/// This is the cutting-plane gesture.</span>", "    <span class=\"c\">/// &lt;/summary&gt;</span>", "    <span class=\"k\">public</span> <span class=\"k\">sealed</span> <span class=\"k\">class</span> FlatPalmDetector : HandDetector", "    {", "        <span class=\"c\">/// &lt;summary&gt;Creates a flat-palm detector.&lt;/summary&gt;</span>", "        <span class=\"k\">public</span> FlatPalmDetector(GestureTuning t, Handedness h) : <span class=\"k\">base</span>(t, h) { }", "", "        <span class=\"c\">/// &lt;inheritdoc/&gt;</span>", "        <span class=\"k\">protected</span> <span class=\"k\">override</span> <span class=\"k\">float</span> EvaluateHand(HandFrame f, <span class=\"k\">in</span> GestureContext ctx)", "        {", "            <span class=\"k\">float</span> flat = FlatConfidence(f, Tuning);", "            <span class=\"k\">float</span> margin = Tuning.FlatPalmBoundsMarginMeters;", "            <span class=\"k\">float</span> inside = Ramp.Below(ctx.DistanceToSpecimen(f.PalmPosition), margin,", "                margin + Tuning.DistanceRampWidthMeters);", "            <span class=\"k\">return</span> Mathf.Min(flat, inside);", "        }", "", "        <span class=\"c\">/// &lt;summary&gt;Flatness alone (shared with the peel detector): the most curled finger decides.&lt;/summary&gt;</span>", "        <span class=\"k\">public</span> <span class=\"k\">static</span> <span class=\"k\">float</span> FlatConfidence(HandFrame f, GestureTuning t)", "        {", "            <span class=\"k\">float</span> maxCurl = Mathf.Max(Mathf.Max(f.FingerCurl(Finger.Index), f.FingerCurl(Finger.Middle)),", "                Mathf.Max(f.FingerCurl(Finger.Ring), f.FingerCurl(Finger.Little)));", "            <span class=\"k\">return</span> Ramp.Below(maxCurl, t.FlatPalmMaxCurl, t.FlatPalmExitCurl);", "        }", "    }", "", "    <span class=\"c\">/// &lt;summary&gt;</span>", "    <span class=\"c\">/// Two flat palms facing each other (normal dot &amp;lt; -0.7), both within 40 cm of the</span>", "    <span class=\"c\">/// specimen. The palm distance itself is read by the peel tool, not here.</span>", "    <span class=\"c\">/// &lt;/summary&gt;</span>", "    <span class=\"k\">public</span> <span class=\"k\">sealed</span> <span class=\"k\">class</span> PeelDetector : IGestureDetector", "    {", "        <span class=\"k\">private</span> <span class=\"k\">readonly</span> GestureTuning _t;", "", "        <span class=\"c\">/// &lt;summary&gt;Creates a peel detector.&lt;/summary&gt;</span>", "        <span class=\"k\">public</span> PeelDetector(GestureTuning tuning) { _t = tuning; }", "", "        <span class=\"c\">/// &lt;inheritdoc/&gt;</span>", "        <span class=\"k\">public</span> <span class=\"k\">float</span> Evaluate(<span class=\"k\">in</span> GestureContext ctx)", "        {", "            HandFrame l = ctx.Left, r = ctx.Right;", "            <span class=\"k\">if</span> (l == <span class=\"k\">null</span> || r == <span class=\"k\">null</span> || !l.IsTracked || !r.IsTracked) <span class=\"k\">return</span> <span class=\"n\">0f</span>;", "", "            <span class=\"k\">float</span> flat = Mathf.Min(FlatPalmDetector.FlatConfidence(l, _t), FlatPalmDetector.FlatConfidence(r, _t));", "            <span class=\"k\">float</span> facing = Ramp.Below(Vector3.Dot(l.PalmNormal, r.PalmNormal), _t.PeelMaxNormalDot, _t.PeelExitNormalDot);", "            <span class=\"c\">// Normals must also point *towards* each other, not away (back-to-back hands also give dot \u2248 -1).</span>", "            Vector3 lToR = r.PalmPosition - l.PalmPosition;", "            <span class=\"k\">float</span> towards = Vector3.Dot(l.PalmNormal, lToR) &gt; <span class=\"n\">0f</span> &amp;&amp; Vector3.Dot(r.PalmNormal, -lToR) &gt; <span class=\"n\">0f</span> ? <span class=\"n\">1f</span> : <span class=\"n\">0f</span>;", "            <span class=\"k\">float</span> maxD = _t.PeelMaxSpecimenDistanceMeters;", "            <span class=\"k\">float</span> near = Mathf.Min(", "                Ramp.Below(ctx.DistanceToSpecimen(l.PalmPosition), maxD, maxD + _t.DistanceRampWidthMeters),", "                Ramp.Below(ctx.DistanceToSpecimen(r.PalmPosition), maxD, maxD + _t.DistanceRampWidthMeters));", "            <span class=\"k\">return</span> Mathf.Min(Mathf.Min(flat, facing), Mathf.Min(towards, near));", "        }", "", "        <span class=\"c\">/// &lt;summary&gt;Maps palm distance to peel amount 0..1 (0 = nothing peeled).&lt;/summary&gt;</span>", "        <span class=\"k\">public</span> <span class=\"k\">static</span> <span class=\"k\">float</span> PeelAmount(HandFrame l, HandFrame r, GestureTuning t) =&gt;", "            Mathf.InverseLerp(t.PeelMinPalmDistanceMeters, t.PeelMaxPalmDistanceMeters,", "                Vector3.Distance(l.PalmPosition, r.PalmPosition));", "    }", "", "    <span class=\"c\">/// &lt;summary&gt;Index extended (curl &amp;lt; 0.2), middle/ring/little curled (&amp;gt; 0.6): the probe.&lt;/summary&gt;</span>", "    <span class=\"k\">public</span> <span class=\"k\">sealed</span> <span class=\"k\">class</span> PointDetector : HandDetector", "    {", "        <span class=\"c\">/// &lt;summary&gt;Creates a point detector.&lt;/summary&gt;</span>", "        <span class=\"k\">public</span> PointDetector(GestureTuning t, Handedness h) : <span class=\"k\">base</span>(t, h) { }", "", "        <span class=\"c\">/// &lt;inheritdoc/&gt;</span>", "        <span class=\"k\">protected</span> <span class=\"k\">override</span> <span class=\"k\">float</span> EvaluateHand(HandFrame f, <span class=\"k\">in</span> GestureContext ctx)", "        {", "            <span class=\"k\">float</span> w = Tuning.CurlRampWidth;", "            <span class=\"k\">float</span> index = Ramp.Below(f.FingerCurl(Finger.Index), Tuning.PointMaxIndexCurl, Tuning.PointMaxIndexCurl + w);", "            <span class=\"k\">float</span> minOther = Mathf.Min(f.FingerCurl(Finger.Middle), Mathf.Min(f.FingerCurl(Finger.Ring), f.FingerCurl(Finger.Little)));", "            <span class=\"k\">float</span> others = Ramp.Above(minOther, Tuning.PointMinOtherCurl, Tuning.PointMinOtherCurl - w);", "            <span class=\"k\">return</span> Mathf.Min(index, others);", "        }", "    }", "", "    <span class=\"c\">/// &lt;summary&gt;</span>", "    <span class=\"c\">/// Fist (mean curl &amp;gt; 0.7) or all-finger pinch, with the palm within 8 cm of the specimen</span>", "    <span class=\"c\">/// surface. Moves and rotates the specimen.</span>", "    <span class=\"c\">/// &lt;/summary&gt;</span>", "    <span class=\"k\">public</span> <span class=\"k\">sealed</span> <span class=\"k\">class</span> GrabDetector : HandDetector", "    {", "        <span class=\"c\">/// &lt;summary&gt;Minimum mean finger curl for the all-finger-pinch variant of grab.&lt;/summary&gt;</span>", "        <span class=\"k\">public</span> <span class=\"k\">const</span> <span class=\"k\">float</span> AllPinchMinMeanCurl = <span class=\"n\">0.5f</span>;", "", "        <span class=\"c\">/// &lt;summary&gt;Creates a grab detector.&lt;/summary&gt;</span>", "        <span class=\"k\">public</span> GrabDetector(GestureTuning t, Handedness h) : <span class=\"k\">base</span>(t, h) { }", "", "        <span class=\"c\">/// &lt;inheritdoc/&gt;</span>", "        <span class=\"k\">protected</span> <span class=\"k\">override</span> <span class=\"k\">float</span> EvaluateHand(HandFrame f, <span class=\"k\">in</span> GestureContext ctx)", "        {", "            <span class=\"k\">float</span> fist = Ramp.Above(f.MeanFingerCurl, Tuning.GrabMinMeanCurl, Tuning.GrabMinMeanCurl - Tuning.CurlRampWidth);", "            <span class=\"c\">// &quot;All-finger pinch&quot;: thumb tip close to the index, middle AND ring tips (a cupped</span>", "            <span class=\"c\">// grab). Checking ring too matters: in an ordinary precision pinch the middle tip</span>", "            <span class=\"c\">// also sits within a few cm of the thumb, and with only index+middle checked a pinch</span>", "            <span class=\"c\">// on a defect was classified as Grab, which outranks Extract (found by the figure harness).</span>", "            Vector3 thumb = f.Joint(HandJoint.ThumbTip);", "            <span class=\"k\">float</span> enter = Tuning.PinchEnterDistanceMeters * <span class=\"n\">1.5f</span>, exit = Tuning.PinchExitDistanceMeters * <span class=\"n\">1.5f</span>;", "            <span class=\"c\">// A cupped grab also curls the fingers; a precision pinch keeps them fairly straight.</span>", "            <span class=\"k\">float</span> cupped = Ramp.Above(f.MeanFingerCurl, AllPinchMinMeanCurl, AllPinchMinMeanCurl - Tuning.CurlRampWidth);", "            <span class=\"k\">float</span> allPinch = Mathf.Min(Mathf.Min(cupped, Ramp.Below(f.PinchDistance, enter, exit)),", "                Mathf.Min(Ramp.Below(Vector3.Distance(thumb, f.Joint(HandJoint.MiddleTip)), enter, exit),", "                          Ramp.Below(Vector3.Distance(thumb, f.Joint(HandJoint.RingTip)), enter, exit)));", "            <span class=\"k\">float</span> shape = Mathf.Max(fist, allPinch);", "            <span class=\"k\">float</span> maxD = Tuning.GrabMaxSurfaceDistanceMeters;", "            <span class=\"k\">float</span> near = Ramp.Below(ctx.DistanceToSpecimen(f.PalmPosition), maxD, maxD + Tuning.DistanceRampWidthMeters);", "            <span class=\"k\">return</span> Mathf.Min(shape, near);", "        }", "    }", "", "    <span class=\"c\">/// &lt;summary&gt;</span>", "    <span class=\"c\">/// &quot;O&quot; ring held up: thumb-index tips touching, other fingers extended, ring facing the eye.</span>", "    <span class=\"c\">/// &lt;/summary&gt;</span>", "    <span class=\"k\">public</span> <span class=\"k\">sealed</span> <span class=\"k\">class</span> LensDetector : HandDetector", "    {", "        <span class=\"c\">/// &lt;summary&gt;Creates a lens detector.&lt;/summary&gt;</span>", "        <span class=\"k\">public</span> LensDetector(GestureTuning t, Handedness h) : <span class=\"k\">base</span>(t, h) { }", "", "        <span class=\"c\">/// &lt;inheritdoc/&gt;</span>", "        <span class=\"k\">protected</span> <span class=\"k\">override</span> <span class=\"k\">float</span> EvaluateHand(HandFrame f, <span class=\"k\">in</span> GestureContext ctx)", "        {", "            <span class=\"k\">float</span> tips = Ramp.Below(f.PinchDistance, Tuning.LensMaxTipDistanceMeters, Tuning.LensMaxTipDistanceMeters + <span class=\"n\">0.015f</span>);", "            <span class=\"k\">float</span> maxOther = Mathf.Max(f.FingerCurl(Finger.Middle), Mathf.Max(f.FingerCurl(Finger.Ring), f.FingerCurl(Finger.Little)));", "            <span class=\"k\">float</span> extended = Ramp.Below(maxOther, Tuning.LensMaxOtherCurl, Tuning.LensMaxOtherCurl + Tuning.CurlRampWidth);", "", "            RingGeometry(f, <span class=\"k\">out</span> Vector3 centre, <span class=\"k\">out</span> Vector3 normal, <span class=\"k\">out</span> _);", "            Vector3 toEye = ctx.Head.position - centre;", "            <span class=\"k\">float</span> angle = Vector3.Angle(normal, toEye);", "            angle = Mathf.Min(angle, <span class=\"n\">180f</span> - angle); <span class=\"c\">// the ring has no front or back</span>", "            <span class=\"k\">float</span> facing = Ramp.Below(angle, Tuning.LensMaxFacingAngleDegrees, Tuning.LensMaxFacingAngleDegrees + <span class=\"n\">15f</span>);", "            <span class=\"k\">return</span> Mathf.Min(tips, Mathf.Min(extended, facing));", "        }", "", "        <span class=\"c\">/// &lt;summary&gt;</span>", "        <span class=\"c\">/// Centre, plane normal and radius of the circle formed by thumb and index.</span>", "        <span class=\"c\">/// Uses the knuckle, the index mid joints and the thumb joints so the estimate is</span>", "        <span class=\"c\">/// stable even though the fingertips themselves touch.</span>", "        <span class=\"c\">/// &lt;/summary&gt;</span>", "        <span class=\"k\">public</span> <span class=\"k\">static</span> <span class=\"k\">void</span> RingGeometry(HandFrame f, <span class=\"k\">out</span> Vector3 centre, <span class=\"k\">out</span> Vector3 normal, <span class=\"k\">out</span> <span class=\"k\">float</span> radius)", "        {", "            Vector3 a = f.Joint(HandJoint.IndexProximal);", "            Vector3 b = f.Joint(HandJoint.IndexIntermediate);", "            Vector3 c = f.Joint(HandJoint.IndexDistal);", "            Vector3 d = f.PinchPoint;", "            Vector3 e = f.Joint(HandJoint.ThumbDistal);", "            Vector3 g = f.Joint(HandJoint.ThumbProximal);", "            centre = (a + b + c + d + e + g) / <span class=\"n\">6f</span>;", "            Vector3 n = Vector3.Cross(b - g, d - a);", "            normal = n.sqrMagnitude &gt; 1e-<span class=\"n\">12f</span> ? n.normalized : f.PalmForward;", "            radius = <span class=\"n\">0.25f</span> * (Vector3.Distance(a, d) + Vector3.Distance(b, e));", "        }", "    }", "", "    <span class=\"c\">/// &lt;summary&gt;Palm up and fist: the reset gesture (held 0.6 s via its GestureState).&lt;/summary&gt;</span>", "    <span class=\"k\">public</span> <span class=\"k\">sealed</span> <span class=\"k\">class</span> ResetDetector : HandDetector", "    {", "        <span class=\"c\">/// &lt;summary&gt;Creates a reset detector.&lt;/summary&gt;</span>", "        <span class=\"k\">public</span> ResetDetector(GestureTuning t, Handedness h) : <span class=\"k\">base</span>(t, h) { }", "", "        <span class=\"c\">/// &lt;inheritdoc/&gt;</span>", "        <span class=\"k\">protected</span> <span class=\"k\">override</span> <span class=\"k\">float</span> EvaluateHand(HandFrame f, <span class=\"k\">in</span> GestureContext ctx)", "        {", "            <span class=\"k\">float</span> up = Ramp.Above(Vector3.Dot(f.PalmNormal, Vector3.up), Tuning.ResetMinPalmUpDot, Tuning.ResetMinPalmUpDot - <span class=\"n\">0.2f</span>);", "            <span class=\"k\">float</span> fist = Ramp.Above(f.MeanFingerCurl, Tuning.GrabMinMeanCurl, Tuning.GrabMinMeanCurl - Tuning.CurlRampWidth);", "            <span class=\"k\">return</span> Mathf.Min(up, fist);", "        }", "    }", "", "    <span class=\"c\">/// &lt;summary&gt;</span>", "    <span class=\"c\">/// Wrist roll relative to a reference, for the contrast dial during a palm cut. Not a</span>", "    <span class=\"c\">/// recognizer: it measures a continuous angle once the cut is active.</span>", "    <span class=\"c\">/// &lt;/summary&gt;</span>", "    <span class=\"k\">public</span> <span class=\"k\">sealed</span> <span class=\"k\">class</span> TwistTracker", "    {", "        <span class=\"k\">private</span> Vector3 _referenceAcross;", "", "        <spa
