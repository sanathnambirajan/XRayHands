"k\">float</span> radius);", "", "        <span class=\"c\">/// &lt;summary&gt;Draws a dashed line between two points (peel palms, chart links); key identifies it.&lt;/summary&gt;</span>", "        <span class=\"k\">void</span> ShowDashedLine(<span class=\"k\">string</span> key, Vector3 a, Vector3 b);", "", "        <span class=\"c\">/// &lt;summary&gt;Hides a dashed line.&lt;/summary&gt;</span>", "        <span class=\"k\">void</span> HideDashedLine(<span class=\"k\">string</span> key);", "", "        <span class=\"c\">/// &lt;summary&gt;Visual ring pulse at a point (probe click, reset confirmation).&lt;/summary&gt;</span>", "        <span class=\"k\">void</span> Pulse(Vector3 position, <span class=\"k\">float</span> radius);", "    }", "", "    <span class=\"c\">/// &lt;summary&gt;Everything a tool receives each frame.&lt;/summary&gt;</span>", "    <span class=\"k\">public</span> <span class=\"k\">readonly</span> <span class=\"k\">struct</span> ToolFrame", "    {", "        <span class=\"c\">/// &lt;summary&gt;Hands, head and specimen for this frame.&lt;/summary&gt;</span>", "        <span class=\"k\">public</span> <span class=\"k\">readonly</span> GestureContext Context;", "", "        <span class=\"c\">/// &lt;summary&gt;Gesture states.&lt;/summary&gt;</span>", "        <span class=\"k\">public</span> <span class=\"k\">readonly</span> GestureRecognizer Gestures;", "", "        <span class=\"c\">/// &lt;summary&gt;Thresholds.&lt;/summary&gt;</span>", "        <span class=\"k\">public</span> <span class=\"k\">readonly</span> GestureTuning Tuning;", "", "        <span class=\"c\">/// &lt;summary&gt;Frame time in seconds.&lt;/summary&gt;</span>", "        <span class=\"k\">public</span> <span class=\"k\">readonly</span> <span class=\"k\">float</span> DeltaTime;", "", "        <span class=\"c\">/// &lt;summary&gt;Creates a frame.&lt;/summary&gt;</span>", "        <span class=\"k\">public</span> ToolFrame(GestureContext context, GestureRecognizer gestures, <span class=\"k\">float</span> deltaTime)", "        {", "            Context = context;", "            Gestures = gestures;", "            Tuning = gestures.Tuning;", "            DeltaTime = deltaTime;", "        }", "", "        <span class=\"c\">/// &lt;summary&gt;Is a per-hand gesture active on &lt;paramref name=&quot;hand&quot;/&gt;?&lt;/summary&gt;</span>", "        <span class=\"k\">public</span> <span class=\"k\">bool</span> Active(GestureId leftVariant, Handedness hand) =&gt;", "            Gestures.IsActive(GestureRecognizer.ForHand(leftVariant, hand));", "    }", "", "    <span class=\"c\">/// &lt;summary&gt;</span>", "    <span class=\"c\">/// An interaction tool: a small state machine that starts on a gesture, runs while the</span>", "    <span class=\"c\">/// gesture holds, and ends. Only one primary tool runs at a time (see</span>", "    <span class=\"c\">/// &lt;see cref=&quot;InteractionModeController&quot;/&gt;), which keeps gestures from fighting.</span>", "    <span class=\"c\">/// &lt;/summary&gt;</span>", "    <span class=\"k\">public</span> <span class=\"k\">interface</span> ITool", "    {", "        <span class=\"c\">/// &lt;summary&gt;Name for logs and tests.&lt;/summary&gt;</span>", "        <span class=\"k\">string</span> Name { <span class=\"k\">get</span>; }", "", "        <span class=\"c\">/// &lt;summary&gt;Hands this tool occupies while running (for concurrency decisions).&lt;/summary&gt;</span>", "        HandUsage Usage { <span class=\"k\">get</span>; }", "", "        <span class=\"c\">/// &lt;summary&gt;True if the tool&#x27;s start gesture is present this frame.&lt;/summary&gt;</span>", "        <span class=\"k\">bool</span> CanStart(<span class=\"k\">in</span> ToolFrame f);", "", "        <span class=\"c\">/// &lt;summary&gt;Called once when the tool becomes active.&lt;/summary&gt;</span>", "        <span class=\"k\">void</span> Begin(<span class=\"k\">in</span> ToolFrame f);", "", "        <span class=\"c\">/// &lt;summary&gt;Called every eTool", "text": "Scales around the midpoint between the hands, within allowed limits.", "end": 122}, {"line": 130, "label": "SliceTool (cut)", "text": "Palm plane = cut plane, normal pointing away from your head, so the near half is removed.", "end": 205}, {"line": 133, "label": "Contrast dial", "text": "Each 45 degrees of wrist roll doubles or halves the contrast window.", "end": 134}, {"line": 212, "label": "PeelTool", "text": "Distance between palms 8-45 cm -> peel 0-100 %.", "end": 258}, {"line": 265, "label": "LensTool", "text": "Runs alongside the main tool on the free hand.", "end": 291}, {"line": 294, "label": "ResetTool", "text": "Puts everything back.", "end": 320}], "code": ["<span class=\"k\">using</span> UnityEngine;", "<span class=\"k\">using</span> XRayHands.Core;", "<span class=\"k\">using</span> XRayHands.Gestures;", "<span class=\"k\">using</span> XRayHands.Input;", "", "namespace XRayHands.Interaction", "{", "    <span class=\"c\">/// &lt;summary&gt;</span>", "    <span class=\"c\">/// One-hand grab (fist or all-finger pinch near the specimen): the specimen follows the</span>", "    <span class=\"c\">/// hand rigidly. The offset between hand and specimen is captured at grab time, so the</span>", "    <span class=\"c\">/// specimen never jumps to the hand.</span>", "    <span class=\"c\">/// &lt;/summary&gt;</span>", "    <span class=\"k\">public</span> <span class=\"k\">sealed</span> <span class=\"k\">class</span> GrabTool : ITool", "    {", "        <span class=\"k\">private</span> <span class=\"k\">readonly</span> ISpecimenHost _host;", "        <span class=\"k\">private</span> <span class=\"k\">readonly</span> IFeedbackSink _fx;", "        <span class=\"k\">private</span> Handedness _hand;", "        <span class=\"k\">private</span> Vector3 _localPos;", "        <span class=\"k\">private</span> Quaternion _localRot;", "", "        <span class=\"c\">/// &lt;summary&gt;Creates the tool.&lt;/summary&gt;</span>", "        <span class=\"k\">public</span> GrabTool(ISpecimenHost host, IFeedbackSink fx) { _host = host; _fx = fx; }", "", "        <span class=\"c\">/// &lt;inheritdoc/&gt;</span>", "        <span class=\"k\">public</span> <span class=\"k\">string</span> Name =&gt; <span class=\"s\">&quot;Grab&quot;</span>;", "", "        <span class=\"c\">/// &lt;inheritdoc/&gt;</span>", "        <span class=\"k\">public</span> HandUsage Usage =&gt; HandPoses.Of(_hand);", "", "        <span class=\"c\">/// &lt;inheritdoc/&gt;</span>", "        <span class=\"k\">public</span> <span class=\"k\">bool</span> CanStart(<span class=\"k\">in</span> ToolFrame f) =&gt; f.Active(GestureId.GrabLeft, Handedness.Right) || f.Active(GestureId.GrabLeft, Handedness.Left);", "", "        <span class=\"c\">/// &lt;inheritdoc/&gt;</span>", "        <span class=\"k\">public</span> <span class=\"k\">void</span> Begin(<span class=\"k\">in</span> ToolFrame f)", "        {", "            _hand = f.Active(GestureId.GrabLeft, Handedness.Right) ? Handedness.Right : Handedness.Left;", "            HandFrame h = f.Context.Hand(_hand);", "            Quaternion handRot = HandPoses.Rotation(h);", "            Transform root = _host.SpecimenRoot;", "            _localRot = Quaternion.Inverse(handRot) * root.rotation;", "            _localPos = Quaternion.Inverse(handRot) * (root.position - h.PalmPosition);", "            _fx.PlayRecognised(h.PalmPosition);", "        }", "", "        <span class=\"c\">/// &lt;inheritdoc/&gt;</span>", "        <span class=\"k\">public</span> <span class=\"k\">bool</span> Tick(<span class=\"k\">in</span> ToolFrame f)", "        {", "            HandFrame h = f.Context.Hand(_hand);", "            <span class=\"k\">if</span> (!f.Active(GestureId.GrabLeft, _hand) || !h.IsTracked) <span class=\"k\">return</span> <span class=\"k\">false</span>;", "            Quaternion handRot = HandPoses.Rotation(h);", "            _host.SpecimenRoot.SetPositionAndRotation(h.PalmPosition + handRot * _localPos, handRot * _localRot);", "            <span class=\"k\">return</span> <span class=\"k\">true</span>;", "        }", "", "        <span class=\"c\">/// &lt;inheritdoc/&gt;</span>", "        <span class=\"k\">public</span> <span class=\"k\">void</span> End() { }", "    }", "", "    <span class=\"c\">/// &lt;summary&gt;</span>", "    <span class=\"c\">/// Two-hand pinch: scale about the midpoint between the hands. The magnification label</span>", "    <span class=\"c\">/// (&quot;\u00d78.0&quot;) floats between the hands.</span>", "    <span class=\"c\">/// &lt;/summary&gt;</span>", "    <span class=\"k\">public</span> <span class=\"k\">sealed</span> <span class=\"k\">class</span> ScaleTool : ITool", "    {", "        <span class=\"c\">/// &lt;summary&gt;Pinch midpoint must be within this distance of the specimen to start, metres.&lt;/summary&gt;</span>", "        <span class=\"k\">public</span> <span class=\"k\">const</span> <span class=\"k\">float</span> MaxStartDistanceMeters = <span class=\"n\">0.25f</span>;", "        <span class=\"k\">private</span> <span class=\"k\">const</span> <span class=\"k\">float</span> MinHandDistanceMeters = <span class=\"n\">0.02f</span>;", "        <span class=\"k\">private</span> <span class=\"k\">const</span> <span class=\"k\">string</span> LabelKey = <span class=\"s\">&quot;scale&quot;</span>;", "", "        <span class=\"k\">private</span> <span class=\"k\">readonly</span> ISpecimenHost _host;", "        <span class=\"k\">private</span> <span class=\"k\">readonly</span> IFeedbackSink _fx;", "        <span class=\"k\">private</span> <span class=\"k\">float</span> _startDistance;", "        <span class=\"k\">private</span> <span class=\"k\">float</span> _startScale;", "", "        <span class=\"c\">/// &lt;summary&gt;Creates the tool.&lt;/summary&gt;</span>", "        <span class=\"k\">public</span> ScaleTool(ISpecimenHost host, IFeedbackSink fx) { _host = host; _fx = fx; }", "", "        <span class=\"c\">/// &lt;inheritdoc/&gt;</span>", "        <span class=\"k\">public</span> <span class=\"k\">string</span> Name =&gt; <span class=\"s\">&quot;Scale&quot;</span>;", "", "        <span class=\"c\">/// &lt;inheritdoc/&gt;</span>", "        <span class=\"k\">public</span> HandUsage Usage =&gt; HandUsage.Both;", "", "        <span class=\"c\">/// &lt;inheritdoc/&gt;</span>", "        <span class=\"k\">public</span> <span class=\"k\">bool</span> CanStart(<span class=\"k\">in</span> ToolFrame f)", "        {", "            <span class=\"k\">if</span> (!f.Gestures.IsActive(GestureId.PinchLeft) || !f.Gestures.IsActive(GestureId.PinchRight)) <span class=\"k\">return</span> <span class=\"k\">false</span>;", "            Vector3 mid = <span class=\"n\">0.5f</span> * (f.Context.Left.PinchPoint + f.Context.Right.PinchPoint);", "            <span class=\"k\">return</span> f.Context.DistanceToSpecimen(mid) &lt;= MaxStartDistanceMeters;", "        }", "", "        <span class=\"c\">/// &lt;inheritdoc/&gt;</span>", "        <span class=\"k\">public</span> <span class=\"k\">void</span> Begin(<span class=\"k\">in</span> ToolFrame f)", "        {", "            _startDistance = Mathf.Max(Vector3.Distance(f.Context.Left.PinchPoint, f.Context.Right.PinchPoint), MinHandDistanceMeters);", "            _startScale = _host.DisplayScale;", "            _fx.PlayRecognised(<span class=\"n\">0.5f</span> * (f.Context.Left.PinchPoint + f.Context.Right.PinchPoint));", "        }", "", "        <span class=\"c\">/// &lt;inheritdoc/&gt;</span>", "        <span class=\"k\">public</span> <span class=\"k\">bool</span> Tick(<span class=\"k\">in</span> ToolFrame f)", "        {", "            <span class=\"k\">if</span> (!f.Gestures.IsActive(GestureId.PinchLeft) || !f.Gestures.IsActive(GestureId.PinchRight)) <span class=\"k\">return</span> <span class=\"k\">false</span>;", "            Vector3 a = f.Context.Left.PinchPoint, b = f.Context.Right.PinchPoint;", "            Vector3 mid = <span class=\"n\">0.5f</span> * (a + b);", "            <span class=\"k\">float</span> distance = Mathf.Max(Vector3.Distance(a, b), MinHandDistanceMeters);", "", "            <span class=\"k\">float</span> before = _host.DisplayScale;", "            _host.SetDisplayScale(_startScale * distance / _startDistance);", "            <span class=\"k\">float</span> ratio = _host.DisplayScale / before;", "            <span class=\"c\">// Scale about the hands&#x27; midpoint, not the specimen centre: the point between the</span>", "            <span class=\"c\">// fingers stays put, which is what a stretch gesture should feel like.</span>", "            Transform root = _host.SpecimenRoot;", "            root.position = mid + (root.position - mid) * ratio;", "", "            _fx.ShowLabel(LabelKey, mid + Vector3.up * <span class=\"n\">0.03f</span>, PhysicalUnits.FormatScale(_host.DisplayScale));", "            <span class=\"k\">return</span> <span class=\"k\">true</span>;", "        }", "", "        <span class=\"c\">/// &lt;inheritdoc/&gt;</span>", "        <span class=\"k\">public</span> <span class=\"k\">void</span> End() =&gt; _fx.HideLabel(LabelKey);", "    }", "", "    <span class=\"c\">/// &lt;summary&gt;</span>", "    <span class=\"c\">/// Flat palm through the specimen = cutting plane. The near side (between plane and user)</span>", "    <span class=\"c\">/// is removed and the cut face shows the real CT slice. A wrist twist while cutting</span>", "    <span class=\"c\">/// changes the slice window width (contrast dial). The last cut stays when the hand leaves,</span>", "    <span class=\"c\">/// so the face can be inspected and probed; reset removes it.</span>", "    <span class=\"c\">/// &lt;/summary&gt;</span>", "    <span class=\"k\">public</span> <span class=\"k\">sealed</span> <span class=\"k\">class</span> SliceTool : ITool", "    {", "        <span class=\"c\">/// &lt;summary&gt;Wrist roll for a doubling/halving of window width, degrees.&lt;/summary&gt;</span>", "        <span class=\"k\">public</span> <span class=\"k\">const</span> <s because their gestures contain one-hand gestures (two pinches are also one pinch).&lt;/item&gt;</span>", "    <span class=\"c\">/// &lt;item&gt;Lens and Reset run alongside on whichever hand is free.&lt;/item&gt;</span>", "    <span class=\"c\">/// &lt;/list&gt;</span>", "    <span class=\"c\">/// &lt;/summary&gt;</span>", "    <span class=\"k\">public</span> <span class=\"k\">sealed</span> <span class=\"k\">class</span> InteractionModeController", "    {", "        <span class=\"k\">private</span> <span class=\"k\">readonly</span> ITool[] _tools;", "        <span class=\"k\">private</span> <span class=\"k\">readonly</span> LensTool _lens;", "        <span class=\"k\">private</span> <span class=\"k\">readonly</span> ResetTool _reset;", "", "        <span class=\"c\">/// &lt;summary&gt;The running primary tool, or null.&lt;/summary&gt;</span>", "        <span class=\"k\">public</span> ITool Active { <span class=\"k\">get</span>; <span class=\"k\">private</span> <span class=\"k\">set</span>; }", "", "        <span class=\"c\">/// &lt;summary&gt;Raised when the active tool changes (old, new).&lt;/summary&gt;</span>", "        <span class=\"k\">public</span> <span class=\"k\">event</span> System.Action&lt;ITool, ITool&gt; ToolChanged;", "", "        <span class=\"c\">/// &lt;summary&gt;Creates a controller with tools in priority order.&lt;/summary&gt;</span>", "        <span class=\"k\">public</span> InteractionModeController(ITool[] toolsByPriority, LensTool lens, ResetTool reset)", "        {", "            _tools = toolsByPriority;", "            _lens = lens;", "            _reset = reset;", "        }", "", "        <span class=\"c\">/// &lt;summary&gt;Runs one frame of interaction.&lt;/summary&gt;</span>", "        <span class=\"k\">public</span> <span class=\"k\">void</span> Tick(<span class=\"k\">in</span> ToolFrame f)", "        {", "            <span class=\"c\">// Exception to &quot;no stealing&quot;: a two-hand gesture that starts while a one-hand tool</span ss=\"k\">void</span> Begin(<span class=\"k\">in</span> ToolFrame f)", "        {", "            _hand = f.Active(GestureId.PointLeft, Handedness.Right) ? Handedness.Right : Handedness.Left;", "        }", "", "        <span class=\"c\">/// &lt;inheritdoc/&gt;</span>", "        <span class=\"k\">public</span> <span class=\"k\">bool</span> Tick(<span class=\"k\">in</span> ToolFrame f)", "        {", "            HandFrame h = f.Context.Hand(_hand);", "            <span class=\"k\">if</span> (!f.Active(GestureId.PointLeft, _hand) || !h.IsTracked || _host.Dataset == <span class=\"k\">null</span>)", "            {", "                _reading.Inside = <span class=\"k\">false</span>;", "                <span class=\"k\">return</span> <span class=\"k\">false</span>;", "            }", "            Vector3 tip = h.Joint(HandJoint.IndexTip);", "            _reading = Measure(_host.Volume, _host.Dataset, tip);", "            <span class=\"k\">if</span> (_reading.Inside)", "            {", "                <span class=\"k\">string</span> defect = _reading.DefectId &gt; <span class=\"n\">0</span> &amp;&amp; _host.Dataset.Catalog.TryGet(_reading.DefectId, <span class=\"k\">out</span> DefectRecord r)", "                    ? $<span class=\"s\">&quot;\\n#{r.Id} {ClassName(r.Class)}  \u00d8{r.EqDiameterMm * 1000f:0} \u00b5m&quot;</span>", "                    : $<span class=\"s\">&quot;\\nnearest defect {_reading.NearestDefectMm * 1000f:0} \u00b5m&quot;</span>;", "                _fx.ShowLabel(LabelKey, tip + Vector3.up * <span class=\"n\">0.035f</span>,", "                    $<span class=\"s\">&quot;{_reading.Material}  {_reading.RawValue:0} gv{defect}&quot;</span>);", "            }", "            <span class=\"k\">else</span>", "            {", "                _fx.HideLabel(LabelKey);", "            }", "            <span class=\"k\">return</span> <span class=\"k\">true</span>;", "        }", "", "        <span class=\"c\">/// &lt;inheritdoc/&gt;</span>", "        <span class=\"k\">public</span> <span class=\"k\">void</span> End()", "        {", "            _reading.Inside = <span class=\"k\">false</span>;", "            _fx.HideLabel(LabelKey);", "        }", "", "        <span class=\"c\">/// &lt;summary&gt;</span>", "        <span class=\"c\">/// Measures the volume at a world position. Static and side-effect free so tests can</span>", "        <span class=\"c\">/// call it directly with a known dataset.</span>", "        <span class=\"c\">/// &lt;/summary&gt;</span>", "        <span class=\"k\">public</span> <span class=\"k\">static</span> ProbeReading Measure(VolumeRenderer volume, VolumeDataset data, Vector3 worldPos)", "        {", "            <span class=\"k\">var</span> reading = <span class=\"k\">new</span> ProbeReading { WorldPosition = worldPos };", "            Vector3 uvw = volume.WorldToTexture(worldPos);", "            <span class=\"k\">if</span> (!VolumeRenderer.InsideVolume(uvw)) <span class=\"k\">return</span> reading;", "", "            reading.Inside = <span class=\"k\">true</span>;", "            <span class=\"k\">int</span> u8 = data.DensityAt(uvw);", "            reading.Density01 = u8 / <span class=\"n\">255f</span>;", "            reading.RawValue = data.Meta.RawValue(u8);", "            reading.Material = data.Meta.MaterialAt(u8);", "            reading.DefectId = data.LabelAt(uvw);", "", "            <span class=\"c\">// Nearest defect surface, approximated as centroid distance minus equivalent radius.</span>", "            <span class=\"c\">// A linear scan over a few thousand defects is ~microseconds and allocation-free;</span>", "            <span class=\"c\">// a spatial index would only pay off at 10^5+ defects.</span>", "            Vector3 mm = PhysicalUnits.TextureToMm(uvw, data.ExtentMm);", "            <span class=\"k\">float</span> best = <span class=\"k\">float</span>.MaxValue;", "            <span class=\"k\">int</span> bestId = <span class=\"n\">0</span>;", "            <span class=\"k\">foreach</span> (DefectRecord r <span class=\"k\">in</span> data.Catalog.Records)", "            {", "                <span class=\"k\">if</span> (r.GroundTruth == GroundTruthStatus.FalseNegative) <span class=\"k\">continue</span>; <span class=\"c\">// not our detection</span>", "                <span class=\"k\">float</span> d = Vector3.Distance(mm, r.CentroidMm) - <span class=\"n\">0.5f</span> * r.EqDiameterMm;", "                <span class=\"k\">if</span> (d &lt; best) { best = d; bestId = r.Id; }", "            }", "            reading.NearestDefectMm = reading.DefectId &gt; <span class=\"n\">0</span> ? <span class=\"n\">0f</span> : Mathf.Max(best, <span class=\"n\">0f</span>);", "            reading.NearestDefectId = reading.DefectId &gt; <span class=\"n\">0</span> ? reading.DefectId : bestId;", "            <span class=\"k\">return</span> reading;", "        }", "", "        <span class=\"c\">/// &lt;summary&gt;Human-readable class name for labels.&lt;/summary&gt;</span>", "        <span class=\"k\">public</span> <span class=\"k\">static</span> <span class=\"k\">string</span> ClassName(DefectClass c)", "        {", "            <span class=\"k\">switch</span> (c)", "            {", "                <span class=\"k\">case</span> DefectClass.Crack: <span class=\"k\">return</span> <span class=\"s\">&quot;crack&quot;</span>;", "                <span class=\"k\">case</span> DefectClass.LackOfFusion: <span class=\"k\">return</span> <span class=\"s\">&quot;lack of fusion&quot;</span>;", "                <span class=\"k\">case</span> DefectClass.GasPore: <span class=\"k\">return</span> <span class=\"s\">&quot;gas pore&quot;</span>;", "                <span class=\"k\">default</span>: <span class=\"k\">return</span> <span class=\"s\">&quot;part&quot;</span>;", "            }", "        }", "    }", "}"]}, {"group": "4 Tools", "path": "Assets/XRayHands/Audio/ProbeSonifier.cs", "title": "Sound for the probe", "what": "Generates the sound live, at the fingertip, so it comes from where the finger is.", "qs": ["Why sound? (Multisensory; every click also has a visual ring.)"], "points": [{"line": 81, "label": "ClickRate()", "text": "Clicks speed up exponentially as the nearest pore gets closer (like a Geiger counter).", "end": 85}, {"line": 93, "label": "OnAudioFilterRead()", "text": "Unity's audio callback: we write every sample ourselves. Pitch follows density over 2 octaves, glided to avoid clicks.", "end": 120}], "code": ["<span class=\"k\">using</span> System;", "<span class=\"k\">using</span> UnityEngine;", "<span class=\"k\">using</span> XRayHands.Interaction;", "", "namespace XRayHands.Audio", "{", "    <span class=\"c\">/// &lt;summary&gt;</span>", "    <span class=\"c\">/// Spatial sonification of the probe (multisensory analytics):</span>", "    <span class=\"c\">/// &lt;list type=&quot;bullet&quot;&gt;</span>", "    <span class=\"c\">/// &lt;item&gt;a continuous tone whose pitch rises with density (two octaves, 220\u2013880 Hz);&lt;/item&gt;</span>", "    <span class=\"c\">/// &lt;item&gt;Geiger-style clicks whose rate rises as the nearest defect gets closer.&lt;/item&gt;</span>", "    <span class=\"c\">/// &lt;/list&gt;</span>", "    <span class=\"c\">/// The sound is synthesised sample by sample in &lt;see cref=&quot;OnAudioFilterRead&quot;/&gt; on an</span>", "    <span class=\"c\">/// AudioSource that sits on the fingertip, so Unity&#x27;s 3D panning makes it come from the</span>", "    <span class=\"c\">/// finger. Every click is also reported back (&lt;see cref=&quot;Clicked&quot;/&gt;) so the app can draw a</span>", "    <span class=\"c\">/// ring pulse: the information stays readable without sound.</span>", "    <span class=\"c\">/// &lt;/summary&gt;</span>", "    [RequireComponent(typeof(AudioSource))]", "    <span class=\"k\">public</span> <span class=\"k\">sealed</span> <span class=\"k\">class</span> ProbeSonifier : MonoBehaviour", "    {", "        <span class=\"c\">/// &lt;summary&gt;Tone frequency at density 0, Hz.&lt;/summary&gt;</span>", "        <span class=\"k\">public</span> <span class=\"k\">const</span> <span class=\"k\">float</span> BaseFrequencyHz = <span class=\"n\">220f</span>;", "        <span class=\"c\">/// &lt;summary&gt;Pitch range in octaves across the density range.&lt;/summary&gt;</span>", "        <span class=\"k\">public</span> <span class=\"k\">const</span> <span class=\"k\">float</span> OctaveRange = <span class=\"n\">2f</span>;", "        <span class=\"c\">/// &lt;summary&gt;Click rate far from any defect, Hz.&lt;/summary&gt;</span>", "        <span class=\"k\">public</span> <span class=\"k\">const</span> <span class=\"k\">float</span> MinClickRateHz = <span class=\"n\">1.5f</span>;", "        <span class=\"c\">/// &lt;summary&gt;Click rate at a defect surface, Hz.&lt;/summary&gt;</span>", "        <span class=\"k\">public</span> <span class=\"k\">const</span> <span class=\"k\">float</span> MaxClickRateHz = <span class=\"n\">40f</span>;", "        <span class=\"c\">/// &lt;summary&gt;Distance (fraction of specimen size) over which the click rate falls by e.&lt;/summary&gt;</span>", "        <span class=\"k\">public</span> <span class=\"k\">const</span> <span class=\"k\">float</span> ClickFalloffFraction = <span class=\"n\">0.03f</span>;", "", "        <span class=\"k\">private</span> <span class=\"k\">const</span> <span class=\"k\">float</span> ToneGain = <span class=\"n\">0.06f</span>;", "        <span class=\"k\">private</span> <span class=\"k\">const</span> <span class=\"k\">float</span> ClickGain = <span class=\"n\">0.5f</span>;", "        <span class=\"k\">private</span> <span class=\"k\">const</span> <span class=\"k\">float</span> ClickSeconds = <span class=\"n\">0.004f</span>;", "        <span class=\"k\">private</span> <span class=\"k\">const</span> <span class=\"k\">float</span> GlideSeconds = <span class=\"n\">0.05f</span>; <span class=\"c\">// smooth pitch changes, no zipper noise</span>", "", "        <span class=\"c\">// Written on the main thread, read on the audio thread. Single floats are atomic on</span>", "        <span class=\"c\">// all our targets; a torn read would only cause one slightly wrong sample.</span>", "        <span class=\"k\">private</span> volatile <span class=\"k\">bool</span> _active;", "        <span class=\"k\">private</span> <span class=\"k\">float</span> _targetFrequency = BaseFrequencyHz;", "        <span class=\"k\">private</span> <span class=\"k\">float</span> _clickRate = MinClickRateHz;", "        <span class=\"k\">private</span> <span class=\"k\">int</span> _pendingClicks;", "", "        <span class=\"k\">private</span> <span class=\"k\">float</span> _frequency = BaseFrequencyHz;", "        <span class=\"k\">private</span> <span class=\"k\">double</span> _phase;", "        <span class=\"k\">private</span> <span class=\"k\">double</span> _clickClock;", "        <span class=\"k\">private</span> <span class=\"k\">float</span> _clickRemaining;", "        <span class=\"k\">private</span> <span class=\"k\">int</span> _sampleRate;", "        <span class=\"k\">private</span> uint _noise = <span class=\"n\">22222</span>;", "", "        <span class=\"c\">/// &lt;summary&gt;Raised on the main thread once per click (for the visual ring pulse).&lt;/summary&gt;</span>", "        <span class=\"k\">public</span> <span class=\"k\">event</span> Action&lt;Vector3&gt; Clicked;", "", "        <span class=\"c\">/// &lt;summary&gt;Current click rate (tests).&lt;/summary&gt;</span>", "        <span class=\"k\">public</span> <span class=\"k\">float</span> ClickRateHz =&gt; _clickRate;", "", "        <span class=\"k\">private</span> <span class=\"k\">void</span> Awake()", "        {", "            _sampleRate = AudioSettings.outputSampleRate;", "            AudioSource src = GetComponent&lt;AudioSource&gt;();", "            src.spatialBlend = <span class=\"n\">1f</span>;", "            src.loop = <span class=\"k\">true</span>;", "            src.playOnAwake = <span class=\"k\">true</span>;", "            src.minDistance = <span class=\"n\">0.3f</span>;", "            <span class=\"c\">// OnAudioFilterRead only runs on a playing source; a silent looping clip keeps it alive.</span>", "            src.clip = AudioClip.Create(<span class=\"s\">&quot;Silence&quot;</span>, _sampleRate, <span class=\"n\">1</span>, _sampleRate, <span class=\"k\">false</span>);", "            src.Play();", "        }", "", "        <span class=\"c\">/// &lt;summary&gt;Feeds this frame&#x27;s probe reading. Specimen size normalises the click distance.&lt;/summary&gt;</span>", "        <span class=\"k\">public</span> <span class=\"k\">void</span> UpdateReading(<span class=\"k\">in</span> ProbeReading r, <span class=\"k\">float</span> specimenSizeMm)", "        {", "            _active = r.Inside;", "            <span class=\"k\">if</span> (!r.Inside) <span class=\"k\">return</span>;", "            transform.position = r.WorldPosition;", "            _targetFrequency = BaseFrequencyHz * Mathf.Pow(<span class=\"n\">2f</span>, OctaveRange * r.Density01);", "            _clickRate = ClickRate(r.NearestDefectMm, specimenSizeMm);", "        }", "", "        <span class=\"c\">/// &lt;summary&gt;Click rate for a distance; exponential so rate changes are felt evenly near and far.&lt;/summary&gt;</span>", "        <span class=\"k\">public</span> <span class=\"k\">static</span> <span class=\"k\">float</span> ClickRate(<span class=\"k\">float</span> nearestDefectMm, <span class=\"k\">float</span> specimenSizeMm)", "        {", "            <span class=\"k\">float</span> d = nearestDefectMm / Mathf.Max(specimenSizeMm, 1e-<span class=\"n\">6f</span>);", "            <span class=\"k\">return</span> Mathf.Lerp(MinClickRateHz, MaxClickRateHz, Mathf.Exp(-d / ClickFalloffFraction));", "        }", "", "        <span class=\"k\">private</span> <span class=\"k\">void</span> Update()", "        {", "            <span class=\"k\">int</span> clicks = System.Threading.Interlocked.Exchange(<span class=\"k\">ref</span> _pendingClicks, <span class=\"n\">0</span>);", "            <span class=\"k\">for</span> (<span class=\"k\">int</span> i = <span class=\"n\">0</span>; i &lt; clicks &amp;&amp; i &lt; <span class=\"n\">4</span>; i++) Clicked?.Invoke(transform.position);", "        }", "", "        <span class=\"k\">private</span> <span class=\"k\">void</span> OnAudioFilterRead(<span class=\"k\">float</span>[] data, <span class=\"k\">int</span> channels)", "        {", "            <span class=\"k\">if</span> (!_active) <span class=\"k\">return</span>;", "            <span class=\"k\">double</span> dt = <span class=\"n\">1.0</span> / _sampleRate;", "            <span class=\"k\">float</span> glide = (<span class=\"k\">float</span>)(dt / GlideSeconds);", "            <span class=\"k\">for</span> (<span class=\"k\">int</span> i = <span class=\"n\">0</span>; i &lt; data.Length; i += channels)", "            {", "                _frequency += (_targetFrequency - _frequency) * glide;", "                _phase += <span class=\"n\">2.0</span> * Math.PI * _frequency * dt;", "                <span class=\"k\">if</span> (_phase &gt; <span class=\"n\">2.0</span> * Math.PI) _phase -= <span class=\"n\">2.0</span> * Math.PI;", "                <span class=\"k\">float</span> s = ToneGain * (<span class=\"k\">float</span>)Math.Sin(_phase);", "", "                _clickClock += dt * _clickRate;", "                <span class=\"k\">if</span> (_clickClock &gt;= <span class=\"n\">1.0</span>)", "                {", "                    _clickClock -= <span class=\"n\">1.0</span>;", "                    _clickRemaining = ClickSeconds;", "                    System.Threading.Interlocked.Increment(<span class=\"k\">ref</span> _pendingClicks);", "                }", "                <span class=\"k\">if</span> (_clickRemaining &gt; <span class=\"n\">0f</span>)", "                {", "                    _clickRemaining -= (<span class=\"k\">float</span>)dt;", "                    _noise ^= _noise &lt;&lt; <span class=\"n\">13</span>; _noise ^= _noise &gt;&gt; <span class=\"n\">17</span>; _noise ^= _noise &lt;&lt; <span class=\"n\">5</span>; <span class=\"c\">// xorshift white noise</span>", "                    s += ClickGain * ((_noise &amp; 0xFFFF) / <span class=\"n\">32768f</span> - <span class=\"n\">1f</span>);", "                }", "                <span class=\"k\">for</span> (<span class=\"k\">int</span> c = <span class=\"n\">0</span>; c &lt; channels; c++) data[i + c] += s;", "            }", "        }", "    }", "}"]}, {"group": "5 Analytics & app", "path": "Assets/XRayHands/Analytics/SelectionModel.cs", "title": "Linked selection", "what": "The single source of truth for what is selected. The part, chart, link line and tooltip all listen to it, so linking works both ways.", "qs": ["How does linked selection work in both directions?"], "points": [{"line": 29, "label": "Focus()", "text": "Select one pore (from the part or the chart).", "end": 35}, {"line": 38, "label": "SetBrush()", "text": "Select a group from the brush.", "end": 45}, {"line": 48, "label": "IsSelected()", "text": "Asked by everyone who draws something.", "end": 48}], "code": ["<span class=\"k\">using</span> System;", "<span class=\"k\">using</span> System.Collections.Generic;", "", "namespace XRayHands.Analytics", "{", "    <span class=\"c\">/// &lt;summary&gt;</span>", "    <span class=\"c\">/// The single source of truth for linked selection between the specimen and the chart.</span>", "    <span class=\"c\">/// Views never talk to each other: the specimen, the chart, the probe and the link lines</span>", "    <span class=\"c\">/// all read this model and listen to &lt;see cref=&quot;Changed&quot;/&gt;. That is what makes the</span>", "    <span class=\"c\">/// brushing-and-linking bidirectional without circular updates.</span>", "    <span class=\"c\">/// &lt;/summary&gt;</span>", "    <span class=\"k\">public</span> <span class=\"k\">sealed</span> <span class=\"k\">class</span> SelectionModel", "    {", "        <span class=\"k\">private</span> <span class=\"k\">readonly</span> HashSet&lt;<span class=\"k\">int</span>&gt; _brushed = <span class=\"k\">new</span> HashSet&lt;<span class=\"k\">int</span>&gt;();", "", "        <span class=\"c\">/// &lt;summary&gt;Currently focused defect id (0 = none). Set by pinching a dot or a defect.&lt;/summary&gt;</span>", "        <span class=\"k\">public</span> <span class=\"k\">int</span> FocusedId { <span class=\"k\">get</span>; <span class=\"k\">private</span> <span class=\"k\">set</span>; }", "", "        <span class=\"c\">/// &lt;summary&gt;Defects inside the current chart brush (empty = no brush).&lt;/summary&gt;</span>", "        <span class=\"k\">public</span> IReadOnlyCollection&lt;<span class=\"k\">int</span>&gt; Brushed =&gt; _brushed;", "", "        <span class=\"c\">/// &lt;summary&gt;True when a brush is active.&lt;/summary&gt;</span>", "        <span class=\"k\">public</span> <span class=\"k\">bool</span> HasBrush =&gt; _brushed.Count &gt; <span class=\"n\">0</span>;", "", "        <span class=\"c\">/// &lt;summary&gt;Raised once after any change (focus or brush).&lt;/summary&gt;</span>", "        <span class=\"k\">public</span> <span class=\"k\">event</span> Action Changed;", "", "        <span class=\"c\">/// &lt;summary&gt;Focus one defect (0 clears). No event if unchanged.&lt;/summary&gt;</span>", "        <span class=\"k\">public</span> <span class=\"k\">void</span> Focus(<span class=\"k\">int</span> id)", "        {", "            <span class=\"k\">if</span> (id &lt; <span class=\"n\">0</span>) <span class=\"k\">throw</span> <span class=\"k\">new</span> ArgumentOutOfRangeException(nameof(id));", "            <span class=\"k\">if</span> (id == FocusedId) <span class=\"k\">return</span>;", "            FocusedId = id;", "            Changed?.Invoke();", "        }", "", "        <span class=\"c\">/// &lt;summary&gt;Replace the brushed set. No event if the set is unchanged.&lt;/summary&gt;</span>", "        <span class=\"k\">public</span> <span class=\"k\">void</span> SetBrush(IEnumerable&lt;<span class=\"k\">int</span>&gt; ids)", "        {", "            <span class=\"k\">var</span> next = <span class=\"k\">new</span> HashSet&lt;<span class=\"k\">int</span>&gt;(ids);", "            <span class=\"k\">if</span> (next.SetEquals(_brushed)) <span class=\"k\">return</span>;", "            _brushed.Clear();", "            _brushed.UnionWith(next);", "            Changed?.Invoke();", "        }", "", "        <span class=\"c\">/// &lt;summary&gt;True if &lt;paramref name=&quot;id&quot;/&gt; is focused or brushed.&lt;/summary&gt;</span>", "        <span class=\"k\">public</span> <span class=\"k\">bool</span> IsSelected(<span class=\"k\">int</span> id) =&gt; id != <span class=\"n\">0</span> &amp;&amp; (id == FocusedId || _brushed.Contains(id));", "", "        <span class=\"c\">/// &lt;summary&gt;True if anything is selected at all.&lt;/summary&gt;</span>", "        <span class=\"k\">public</span> <span class=\"k\">bool</span> HasSelection =&gt; FocusedId != <span class=\"n\">0</span> || _brushed.Count &gt; <span class=\"n\">0</span>;", "", "        <span class=\"c\">/// &lt;summary&gt;Clears focus and brush (one event).&lt;/summary&gt;</span>", "        <span class=\"k\">public</span> <span class=\"k\">void</span> Clear()", "        {", "            <span class=\"k\">if</span> (!HasSelection) <span class=\"k\">return</span>;", "            FocusedId = <span class=\"n\">0</span>;", "            _brushed.Clear();", "            Changed?.Invoke();", "        }", "    }", "}"]}, {"group": "5 Analytics & app", "path": "Assets/XRayHands/Analytics/DefectChart3D.cs", "title": "The 3D scatter plot", "what": "All pores as dots: x = log volume, y = sphericity, z = build height. One mesh for all dots = one draw call.", "qs": ["What do the axes mean?", "Why one mesh?"], "points": [{"line": 69, "label": "Build()", "text": "Creates the dot mesh and the axes.", "end": 110}, {"line": 134, "label": "Extract()", "text": "Starts the fly-out animation from each pore's position.", "end": 150}, {"line": 255, "label": "Arc animation", "text": "Each dot travels on a quadratic Bezier arc, staggered by distance so the eye can follow.", "end": 257}, {"line": 185, "label": "NearestDot()", "text": "Which dot the pinch is closest to.", "end": 197}, {"line": 209, "label": "IdsInBox()", "text": "Dots inside the brush box.", "end": 221}], "code": ["<span class=\"k\">using</span> System;", "<span class=\"k\">using</span> System.Collections.Generic;", "<span class=\"k\">using</span> TMPro;", "<span class=\"k\">using</span> UnityEngine;", "<span class=\"k\">using</span> XRayHands.Core;", "", "namespace XRayHands.Analytics", "{", "    <span class=\"c\">/// &lt;summary&gt;</span>", "    <span class=\"c\">/// 3D scatter plot of all defects (axes from meta.json, e.g. log10 volume \u00d7 sphericity \u00d7</span>", "    <span class=\"c\">/// build height). Point size encodes volume, colour encodes class (or TP/FP/FN).</span>", "    <span class=\"c\">/// &lt;para&gt;The extraction animation is the SciVis \u2192 InfoVis moment: every defect flies out of</span>", "    <span class=\"c\">/// the specimen along an arc into its chart position, staggered by distance so the eye can</span>", "    <span class=\"c\">/// follow the flow instead of seeing everything teleport.&lt;/para&gt;</span>", "    <span class=\"c\">/// &lt;/summary&gt;</span>", "    <span class=\"c\">/// &lt;remarks&gt;</span>", "    <span class=\"c\">/// All dots are one mesh (an octahedron per dot, vertex-coloured): thousands of dots cost</span>", "    <span class=\"c\">/// one draw call, which matters on Quest. Chart local space is the unit cube [0,1]^3,</span>", "    <span class=\"c\">/// scaled by &lt;see cref=&quot;SizeMeters&quot;/&gt;.</span>", "    <span class=\"c\">/// &lt;/remarks&gt;</span>", "    <span class=\"k\">public</span> <span class=\"k\">sealed</span> <span class=\"k\">class</span> DefectChart3D : MonoBehaviour", "    {", "        <span class=\"c\">/// &lt;summary&gt;Edge length of the chart cube in metres.&lt;/summary&gt;</span>", "        <span class=\"k\">public</span> <span class=\"k\">const</span> <span class=\"k\">float</span> SizeMeters = <span class=\"n\">0.3f</span>;", "        <span class=\"c\">/// &lt;summary&gt;Smallest / largest dot radius in metres.&lt;/summary&gt;</span>", "        <span class=\"k\">public</span> <span class=\"k\">const</span> <span class=\"k\">float</span> MinDotRadius = <span class=\"n\">0.0025f</span>, MaxDotRadius = <span class=\"n\">0.009f</span>;", "        <span class=\"c\">/// &lt;summary&gt;Flight time of one dot, seconds.&lt;/summary&gt;</span>", "        <span class=\"k\">public</span> <span class=\"k\">const</span> <span class=\"k\">float</span> FlightSeconds = <span class=\"n\">0.9f</span>;", "        <span class=\"c\">/// &lt;summary&gt;Spread of start times across all dots, seconds.&lt;/summary&gt;</span>", "        <span class=\"k\">public</span> <span class=\"k\">const</span> <span class=\"k\">float</span> StaggerSeconds = <span class=\"n\">0.9f</span>;", "        <span class=\"c\">/// &lt;summary&gt;Arc apex height above the straight path, metres.&lt;/summary&gt;</span>", "        <span class=\"k\">public</span> <span class=\"k\">const</span> <span class=\"k\">float</span> ArcHeightMeters = <span class=\"n\">0.12f</span>;", "", "        <span class=\"k\">private</span> <span class=\"k\">const</span> <span class=\"k\">int</span> VertsPerDot = <span class=\"n\">6</span>;", "        <span class=\"k\">private</span> <span class=\"k\">const</span> <span class=\"k\">int</span> IndicesPerDot = <span class=\"n\">24</span>;", "        <span class=\"k\">private</span> <span class=\"k\">static</span> <span class=\"k\">readonly</span> Vector3[] Octa =", "        {", "            Vector3.right, Vector3.left, Vector3.up, Vector3.down, Vector3.forward, Vector3.back,", "        };", "        <span class=\"k\">private</span> <span class=\"k\">static</span> <span class=\"k\">readonly</span> <span class=\"k\">int</span>[] OctaTris =", "        {", "            <span class=\"n\">0</span>, <span class=\"n\">2</span>, <span class=\"n\">4</span>, <span class=\"n\">4</span>, <span class=\"n\">2</span>, <span class=\"n\">1</span>, <span class=\"n\">1</span>, <span class=\"n\">2</span>, <span class=\"n\">5</span>, <span class=\"n\">5</span>, <span class=\"n\">2</span>, <span class=\"n\">0</span>, <span class=\"n\">4</span>, <span class=\"n\">3</span>, <span class=\"n\">0</span>, <span class=\"n\">1</span>, <span class=\"n\">3</span>, <span class=\"n\">4</span>, <span class=\"n\">5</span>, <span class=\"n\">3</span>, <span class=\"n\">1</span>, <span class=\"n\">0</span>, <span class=\"n\">3</span>, <span class=\"n\">5</span>,", "        };", "", "        <span class=\"k\">private</span> Mesh _mesh;", "        <span class=\"k\">private</span> Vector3[] _verts;", "        <span class=\"k\">private</span> Color32[] _colours;", "        <span class=\"k\">private</span> DefectRecord[] _records;", "        <span class=\"k\">private</span> Vector3[] _chartPos;     <span class=\"c\">// chart-local [0,1]^3</span>", "        <span class=\"k\">private</span> <span class=\"k\">float</span>[] _radius;", "        <span class=\"k\">private</span> Vector3[] _startWorld;   <span class=\"c\">// extraction start (defect position in the specimen)</span>", "        <span class=\"k\">private</span> <span class=\"k\">float</span>[] _delay;", "        <span class=\"k\">private</span> <span class=\"k\">float</span> _extractTime = -<span class=\"n\">1f</span>;", "        <span class=\"k\">private</span> Vector2[] _range = <span class=\"k\">new</span> Vector2[<span class=\"n\">3</span>];", "        <span class=\"k\">private</span> <span class=\"k\">string</span>[] _columns = <span class=\"k\">new</span> <span class=\"k\">string</span>[<span class=\"n\">3</span>];", "        <span class=\"k\">private</span> <span class=\"k\">readonly</span> Dictionary&lt;<span class=\"k\">int</span>, <span class=\"k\">int</span>&gt; _indexById = <span class=\"k\">new</span> Dictionary&lt;<span class=\"k\">int</span>, <span class=\"k\">int</span>&gt;();", "        <span class=\"k\">private</span> <span class=\"k\">readonly</span> List&lt;GameObject&gt; _axisObjects = <span class=\"k\">new</span> List&lt;GameObject&gt;();", "", "        <span class=\"c\">/// &lt;summary&gt;True once extraction has started (dots are in the world).&lt;/summary&gt;</span>", "        <span class=\"k\">public</span> <span class=\"k\">bool</span> IsShown =&gt; _extractTime &gt;= <span class=\"n\">0f</span>;", "", "        <span class=\"c\">/// &lt;summary&gt;True when every dot has landed.&lt;/summary&gt;</span>", "        <span class=\"k\">public</span> <span class=\"k\">bool</span> ExtractionComplete { <span class=\"k\">get</span>; <span class=\"k\">private</span> <span class=\"k\">set</span>; }", "", "        <span class=\"c\">/// &lt;summary&gt;Raised when every dot has landed.&lt;/summary&gt;</span>", "        <span class=\"k\">public</span> <span class=\"k\">event</span> Action Extracted;", "", "        <span class=\"c\">/// &lt;summary&gt;Builds dots and axes for a dataset. The chart stays hidden until &lt;see cref=&quot;Extract&quot;/&gt;.&lt;/summary&gt;</span>", "        <span class=\"k\">public</span> <span class=\"k\">void</span> Build(VolumeDataset data, Material dotMaterial, TMP_FontAsset font)", "        {", "            Clear();", "            _records = <span class=\"k\">new</span> DefectRecord[data.Catalog.Count];", "            <span class=\"k\">for</span> (<span class=\"k\">int</span> i = <span class=\"n\">0</span>; i &lt; _records.Length; i++) _records[i] = data.Catalog.Records[i];", "            <span class=\"k\">for</span> (<span class=\"k\">int</span> a = <span class=\"n\">0</span>; a &lt; <span class=\"n\">3</span>; a++) _columns[a] = data.Meta.chart_axes[a].column;", "", "            _chartPos = <span class=\"k\">new</span> Vector3[_records.Length];", "            _radius = <span class=\"k\">new</span> <span class=\"k\">float</span>[_records.Length];", "            _startWorld = <span class=\"k\">new</span> Vector3[_records.Length];", "            _delay = <span class=\"k\">new</span> <span class=\"k\">float</span>[_records.Length];", "            ComputeRanges();", "            <span class=\"k\">float</span> maxCbrt = <span class=\"n\">0f</span>;", "            <span class=\"k\">foreach</span> (DefectRecord r <span class=\"k\">in</span> _records) maxCbrt = Mathf.Max(maxCbrt, Mathf.Pow(r.VolumeMm3, <span class=\"n\">1f</span> / <span class=\"n\">3f</span>));", "            <span class=\"k\">for</span> (<span class=\"k\">int</span> i = <span class=\"n\">0</span>; i &lt; _records.Length; i++)", "            {", "                _indexById[_records[i].Id] = i;", "                _chartPos[i] = Normalised(_records[i]);", "                <span class=\"c\">// Radius \u221d cube root of volume, i.e. \u221d physical size, so area does not exaggerate big pores.</span>", "                _radius[i] = Mathf.Lerp(MinDotRadius, MaxDotRadius, Mathf.Pow(_records[i].VolumeMm3, <span class=\"n\">1f</span> / <span class=\"n\">3f</span>) / Mathf.Max(maxCbrt, 1e-<span class=\"n\">9f</span>));", "            }", "", "            _verts = <span class=\"k\">new</span> Vector3[_records.Length * VertsPerDot];", "            _colours = <span class=\"k\">new</span> Color32[_verts.Length];", "            <span class=\"k\">var</span> normals = <span class=\"k\">new</span> Vector3[_verts.Length];", "            <span class=\"k\">var</span> tris = <span class=\"k\">new</span> <span class=\"k\">int</span>[_records.Length * IndicesPerDot];", "            <span class=\"k\">for</span> (<span class=\"k\">int</span> i = <span class=\"n\">0</span>; i &lt; _records.Length; i++)", "            {", "                <span class=\"k\">for</span> (<span class=\"k\">int</span> v = <span class=\"n\">0</span>; v &lt; VertsPerDot; v++) normals[i * VertsPerDot + v] = Octa[v];", "                <span class=\"k\">for</span> (<span class=\"k\">int</span> t = <span class=\"n\">0</span>; t &lt; IndicesPerDot; t++) tris[i * IndicesPerDot + t] = i * VertsPerDot + OctaTris[t];", "            }", "            _mesh = <span class=\"k\">new</span> Mesh { name = <span class=\"s\">&quot;ChartDots&quot;</span>, indexFormat = UnityEngine.Rendering.IndexFormat.UInt32 };", "            _mesh.vertices = _verts;", "            _mesh.normals = normals;", "            _mesh.colors32 = _colours;", "            _mesh.triangles = tris;", "            _mesh.bounds = <span class=\"k\">new</span> Bounds(Vector3.one * <span class=\"n\">0.5f</span>, Vector3.one * <span class=\"n\">100f</span>); <span class=\"c\">// dots fly in from outside</span>", "            gameObject.GetComponent&lt;MeshFilter&gt;().sharedMesh = _mesh;", "            gameObject.GetComponent&lt;MeshRenderer&gt;().sharedMaterial = dotMaterial;", "            BuildAxes(data, font);", "            SetVisible(<span class=\"k\">false</span>);", "        }", "", "        <span class=\"c\">/// &lt;summary&gt;Recolours every dot (call when the selection or colour mode changes).&lt;/summary&gt;</span>", "        <span class=\"k\">public</span> <span class=\"k\">void</span> Recolour(Func&lt;DefectRecord, Color32&gt; colourOf, Func&lt;<span class=\"k\">int</span>, <span class=\"k\">bool</span>&gt; isFocused)", "        {", "            <span class=\"k\">if</span> (_records == <span class=\"k\">null</span>) <span class=\"k\">return</span>;", "            <span class=\"k\">for</span> (<span class=\"k\">int</span> i = <span class=\"n\">0</span>; i &lt; _records.Length; i++)", "            {", "                Color32 c = colourOf(_records[i]);", "                c.a = c.a &gt; <span class=\"n\">0</span> ? (byte)<span class=\"n\">255</span> : (byte)<span class=\"n\">0</span>; <span class=\"c\">// the dot shader clips on alpha</span>", "                <span class=\"k\">for</span> (<span class=\"k\">int</span> v = <span class=\"n\">0</span>; v &lt; VertsPerDot; v++) _colours[i * VertsPerDot + v] = c;", "            }", "            _mesh.colors32 = _colours;", "            _focusedId = <span class=\"n\">0</span>;", "            <span class=\"k\">foreach</span> (DefectRecord r <span class=\"k\">in</span> _records) <span class=\"k\">if</span> (isFocused(r.Id)) { _focusedId = r.Id; <span class=\"k\">break</span>; }", "            WriteVertices();", "        }", "", "        <span class=\"k\">private</span> <span class=\"k\">int</span> _focusedId;", "", "        <span class=\"c\">/// &lt;summary&gt;</span>", "        <span class=\"c\">/// Starts the extraction animation. &lt;paramref name=&quot;defectWorld&quot;/&gt; gives each defect&#x27;s</span>", "        <span class=\"c\">/// current world position inside the specimen.</span>", "        <span class=\"c\">/// &lt;/summary&gt;</span>", "        <span class=\"k\">public</span> <span class=\"k\">void</span> Extract(Func&lt;DefectRecord, Vector3&gt; defectWorld)", "        {", "            Vector3 chartCentre = transform.TransformPoint(Vector3.one * <span class=\"n\">0.5f</span>);", "            <span class=\"k\">float</span> maxD = 1e-<span class=\"n\">6f</span>;", "            <span class=\"k\">for</span> (<span class=\"k\">int</span> i = <span class=\"n\">0</span>; i &lt; _records.Length; i++)", "            {", "                _startWorld[i] = defectWorld(_records[i]);", "                _delay[i] = Vector3.Distance(_startWorld[i], chartCentre);", "                maxD = Mathf.Max(maxD, _delay[i]);", "            }", "            <span class=\"c\">// Nearest defects leave first: the flow reads as a stream from specimen to chart.</span>", "            <span class=\"k\">for</span> (<span class=\"k\">int</span> i = <span class=\"n\">0</span>; i &lt; _records.Length; i++) _delay[i] = StaggerSeconds * _delay[i] / maxD;", "            _extractTime = <span class=\"n\">0f</span>;", "            ExtractionComplete = <span class=\"k\">false</span>;", "            SetVisible(<span class=\"k\">true</span>);", "            WriteVertices();", "        }", "", "        <span class=\"c\">/// &lt;summary&gt;Hides the chart and returns to the pre-extraction state.&lt;/summary&gt;</span>", "        <span class=\"k\">public</span> <span class=\"k\">void</span> Collapse()", "        {", "            _extractTime = -<span class=\"n\">1f</span>;", "            ExtractionComplete = <span class=\"k\">false</span>;", "            SetVisible(<span class=\"k\">false</span>);", "        }", "", "        <span class=\"k\">private</span> <span class=\"k\">void</span> Update()", "        {", "            <span class=\"k\">if</span> (_extractTime &lt; <span class=\"n\">0f</span> || ExtractionComplete) <span class=\"k\">return</span>;", "            _extractTime += Time.deltaTime;", "            WriteVertices();", "            <span class=\"k\">if</span> (_extractTime &gt;= StaggerSeconds + FlightSeconds)", "            {", "                ExtractionComplete = <span class=\"k\">true</span>;", "                Extracted?.Invoke();", "            }", "        }", "", "        <span class=\"c\">/// &lt;summary&gt;Where the dot of &lt;paramref name=&quot;id&quot;/&gt; is now, in world space.&lt;/summary&gt;</span>", "        <span class=\"k\">public</span> <span class=\"k\">bool</span> TryGetDotWorld(<span class=\"k\">int</span> id, <span class=\"k\">out</span> Vector3 world)", "        {", "            <span class=\"k\">if</span> (_indexById.TryGetValue(id, <span class=\"k\">out</span> <span class=\"k\">int</span> i))", "            {", "                world = transform.TransformPoint(CurrentLocal(i));", "                <span class=\"k\">return</span> <span class=\"k\">true</span>;", "            }", "            world = <span class=\"k\">default</span>;", "            <span class=\"k\">return</span> <span class=\"k\">false</span>;", "        }", "", "        <span class=\"c\">/// &lt;summary&gt;The visible dot nearest to &lt;paramref name=&quot;world&quot;/&gt; within &lt;paramref name=&quot;maxMeters&quot;/&gt; (0 = none).&lt;/summary&gt;</span>", "        <span class=\"k\">public</span> <span class=\"k\">int</span> NearestDot(Vector3 world, <span class=\"k\">float</span> maxMeters)", "        {", "            <span class=\"k\">if</span> (!ExtractionComplete) <span class=\"k\">return</span> <span class=\"n\">0</span>;", "            <span class=\"k\">int</span> best = <span class=\"n\">0</span>;", "            <span class=\"k\">float</span> bestD = maxMeters;", "            <span class=\"k\">for</span> (<span class=\"k\">int</span> i = <span class=\"n\">0</span>; i &lt; _records.Length; i++)", "            {", "                <span class=\"k\">if</span> (_colours[i * VertsPerDot].a == <span class=\"n\">0</span>) <span class=\"k\">continue</span>;", "                <span class=\"k\">float</span> d = Vector3.Distance(world, transform.TransformPoint(_chartPos[i]));", "                <span class=\"k\">if</span> (d &lt; bestD) { bestD = d; best = _records[i].Id; }", "            }", "            <span class=\"k\">return</span> best;", "        }", "", "        <span class=\"c\">/// &lt;summary&gt;True if &lt;paramref name=&quot;world&quot;/&gt; is inside the chart cube expanded by &lt;paramref name=&quot;marginMeters&quot;/&gt;.&lt;/summary&gt;</span>", "        <span class=\"k\">public</span> <span class=\"k\">bool</span> Contains(Vector3 world, <span class=\"k\">float</span> marginMeters)", "        {", "            <span class=\"k\">if</span> (!ExtractionComplete) <span class=\"k\">return</span> <span class=\"k\">false</span>;", "            Vector3 l = transform.InverseTransformPoint(world);", "            <span class=\"k\">float</span> m = marginMeters / SizeMeters;", "            <span class=\"k\">return</span> l.x &gt;= -m &amp;&amp; l.y &gt;= -m &amp;&amp; l.z &gt;= -m &amp;&amp;            Mathf.InverseLerp(_range[<span class=\"n\">2</span>].x, _range[<span class=\"n\">2</span>].y, r.Column(_columns[<span class=\"n\">2</span>])));", "", "        <span class=\"k\">private</span> <span class=\"k\">void</span> ComputeRanges()", "        {", "            <span class=\"k\">for</span> (<span class=\"k\">int</span> a = <span class=\"n\">0</span>; a &lt; <span class=\"n\">3</span>; a++)", "            {", "                <span class=\"k\">float</span> lo = <span class=\"k\">float</span>.MaxValue, hi = <span class=\"k\">float</span>.MinValue;", "                <span class=\"k\">foreach</span> (DefectRecord r <span class=\"k\">in</span> _records)", "                {", "                    <span class=\"k\">float</span> v = r.Column(_columns[a]);", "                    <span class=\"k\">if</span> (<span class=\"k\">float</span>.IsNaN(v)) <span class=\"k\">continue</span>;", "                    lo = Mathf.Min(lo, v);", "                    hi = Mathf.Max(hi, v);", "                }", "                <span class=\"k\">if</span> (hi &lt;= lo) hi = lo + <span class=\"n\">1f</span>;", "                _range[a] = <span class=\"k\">new</span> Vector2(lo, hi);", "            }", "        }", "", "        <span class=\"k\">private</span> Vector3 CurrentLocal(<span class=\"k\">int</span> i)", "        {", "            <span class=\"k\">if</span> (_extractTime &lt; <span class=\"n\">0f</span>) <span class=\"k\">return</span> _chartPos[i];", "            <span class=\"k\">float</span> t = Mathf.Clamp01((_extractTime - _delay[i]) / FlightSeconds);", "            <span class=\"k\">if</span> (t &gt;= <span class=\"n\">1f</span>) <span class=\"k\">return</span> _chartPos[i];", "            <span class=\"k\">float</span> e = t * t * (<span class=\"n\">3f</span> - <span class=\"n\">2f</span> * t); <span class=\"c\">// smoothstep easing</span>", "            Vector3 start = transform.InverseTransformPoint(_startWorld[i]);", "            Vector3 end = _chartPos[i] > SetColourMode(DefectColourMode mode)", "        {", "            <span class=\"k\">if</span> (mode == DefectColourMode.GroundTruth &amp;&amp; (Dataset == <span class=\"k\">null</span> || !Dataset.Meta.HasGroundTruth)) <span class=\"k\">return</span>;", "            _colourMode = mode;", "            RefreshColours();", "            <span class=\"k\">if</span> (mode == DefectColourMode.GroundTruth)", "            {", "                SpecimenMeta.GroundTruth gt = Dataset.Meta.ground_truth;", "                _feedback.ShowLabel(<span class=\"s\">&quot;gt&quot;</span>, ChartAnchor() + Vector3.up * <span class=\"n\">0.36f</span>,", "                    $<span class=\"s\">&quot;precision {gt.precision:0.00}  recall {gt.recall:0.00}  IoU {gt.iou:0.00}&quot;</span>);", "            }", "            <span class=\"k\">else</span>", "            {", "                _feedback.HideLabel(<span class=\"s\">&quot;gt&quot;</span>);", "            }", "        }", "", "        <span class=\"c\">/// &lt;summary&gt;&quot;Hide unselected&quot; mode: after extraction, ghost everything not selected.&lt;/summary&gt;</span>", "        <span class=\"k\">public</span> <span class=\"k\">void</span> SetHideUnselected(<span class=\"k\">bool</span> hide)", "        {", "            _hideUnselected = hide;", "            RefreshColours();", "        }", "", "        <span class=\"k\">private</span> <span class=\"k\">void</span> Update()", "        {", "            <span class=\"k\">float</span> dt = Time.deltaTime;", "            Hands.Tick(dt);", "            <span class=\"k\">if</span> (Dataset == <span class=\"k\">null</span> || IsLoading) <span class=\"k\">return</span>;", "", "            GestureContext ctx = BuildContext();", "            Recognizer.Update(ctx, dt);", "            _controller.Tick(<span class=\"k\">new</span> ToolFrame(ctx, Recognizer, dt));", "            _sonifier.UpdateReading(_probe.Reading, Mathf.Max(Dataset.ExtentMm.x, Mathf.Max(Dataset.ExtentMm.y, Dataset.ExtentM
